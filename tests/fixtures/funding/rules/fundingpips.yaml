# FundingPips — the rules the catalogue does not carry. Same format as hantec.yaml (see its header).
# The firm's own pages block automated reading: sources are third parties or search snippets of the
# firm's pages, so nothing here is `confirmed` until the owner reads it on the firm's site.

- rule_key: eas_allowed
  family: '*'
  stage: plan
  field: eas_allowed
  value: null
  text: "Third parties quote the help centre ('Trading Conduct and Security Standards'): third-party EAs only as trade or risk managers, any other third-party EA for trading denies the evaluation or reward. Whether a self-built EA (SQX-generated) counts as third-party is not stated. Ask FundingPips support."
  source: https://help.fundingpips.com/hc/en-us/articles/34505029138449-Trading-Conduct-and-Security-Standards
  status: conflict
  checked_on: 2026-10-04
- rule_key: reward_share_base
