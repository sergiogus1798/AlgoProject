  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445801-instant-funding"
  status: confirmed
  checked_on: 2026-09-29
- rule_key: fee_refund
  family: '*'
  value: false
  text: "Help article 'Do I receive a Refund after passing my challenge or after reaching payout?' answers: 'No, refund of challenge fees are not issued upon withdrawals.' (modified 11 May). Wording speaks of withdrawals; the Terms and the purchase page were not read."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000444247-do-i-receive-a-refund-after-passing-my-challenge-or-after-reaching-payout-"
  status: confirmed
  checked_on: 2026-10-04
- rule_key: consistency_formula
  family: enhancedx
  value: "best day profit / total profit <= 35 %"
  text: "\"(Best Trading Day's Profit / Total Profit) x 100\" with a 35 % threshold."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445799-enhancedx-2-step-consistency-"
  status: confirmed
  checked_on: 2026-09-29
- rule_key: consistency_formula
  family: instant-lite
  value: "best day profit / total profit <= 20 %"
  text: "Score of 20 % or lower required for withdrawal."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445802-instant-lite"
  status: confirmed
  checked_on: 2026-09-29
