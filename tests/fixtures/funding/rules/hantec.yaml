- rule_key: trade_consistency
  family: instant24
  value: 15
  text: "No single trade above 15 % of total accumulated profit; minimum profit 3 % before a reward can be requested."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445803-instant24"
  status: confirmed
  checked_on: 2026-09-29
- rule_key: forbidden_practices
  family: '*'
  value: "scalping (net profit from trades held under 3 min >= 30 % of total); copy/group/coordinated trading and identical strategies across accounts or users; reverse hedging across accounts; overleveraging, overexposure, one-sided bets; multiple registrations; EAs built to pass challenges"
  text: "Folder 'Prohibited Strategies/Practices' (6 articles, modified 13-14 May). HFT, arbitrage, grid, martingale and tick scalping are not named; scalping is defined by the 3-minute / 30 % profit test and the company may adjust or remove profits. Overleveraging articles give no numeric limit; the Risk Management Group article sets 3 % risked per trade (1 % Instant Lite) as 'all-or-nothing' trading, which cuts funded leverage (FX 1:30, indices/commodities 1:5, metals 1:3, crypto 1:1) — not applied to Challenge accounts."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/folders/158001034577"
  status: confirmed
  checked_on: 2026-10-04
- rule_key: ea_policy
  family: '*'
  value: "EAs allowed on MT5 except Instant accounts; max $400,000 allocation per EA/strategy; no identical EA across accounts/users"
  text: "Article 'Can I trade with an EA?' (modified 7 Sep): third-party or custom EAs allowed if customised, genuine and with a unique strategy; no coordinated or mirrored automated trading; EAs designed to pass challenges, same EA across accounts without meaningful variation, and anything that circumvents rules are prohibited; Hantec may ask for EA details. Instant accounts: all automation prohibited."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000444279-can-i-trade-with-an-ea-"
  status: confirmed
  checked_on: 2026-10-04
- rule_key: max_risk_per_trade
  family: '*'
  value: "3 % (1 % Instant Lite) — soft, via Risk Management Group"
  text: "Consistently risking more than 3 % per trade (open exposure and closed trades) puts a trader in the Risk Management Group: funded leverage reduced, review after 3 successful payouts. Challenge accounts excluded. No hard breach stated."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000444270-what-is-the-risk-management-group-"
  status: confirmed
  checked_on: 2026-10-04
- rule_key: stop_loss_required
