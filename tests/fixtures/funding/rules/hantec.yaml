# Hantec Trader — the rules its catalogue JSON does not carry, curated by hand and by the
# fundingWatcher agent every Sunday. Read by `python3 -m portfolio.funded.catalog.refresh`.
#
# One entry per rule. `family`: one family, a list, or '*'. `field` + `stage` (optional): the value
# overwrites that column of the database — stage 'plan' (plans table), 'phases' (every phase),
# 'funded', 'phase1'…'phase3' or 'all'. Without `field` the rule is compendium text only.
# `value: null` = still unknown. `status`: confirmed (read on the firm's own current pages) ·
# unconfirmed (help centre, third party or inferred) · conflict (sources disagree — never guessed).
# Discounts are ignored on purpose (owner, 2026-09-29): prices are list prices.

- rule_key: eas_allowed
  family: [express, enhanced, enhancedx, endurance]
  stage: plan
  field: eas_allowed
  value: true
  text: "Expert advisors allowed in the Challenge and Hantec Trader stages, as long as they do not breach the prohibited strategies (that page not read yet)."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445798-enhanced-2-step-"
  status: confirmed
  checked_on: 2026-09-29
- rule_key: eas_allowed
  family: instant-funding
  stage: plan
  field: eas_allowed
  value: false
  text: "We do not allow EA & Robots for Instant funding programs."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445801-instant-funding"
  status: confirmed
  checked_on: 2026-09-29
- rule_key: eas_allowed
  family: [instant-lite, instant24]
  stage: plan
  field: eas_allowed
  value: false
  text: "\"We do not allow EA & Robots\" on Instant Lite (this URL) nor on Instant24 (158000445803-instant24)."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445802-instant-lite"
  status: confirmed
  checked_on: 2026-09-29
