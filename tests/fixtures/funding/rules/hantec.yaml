- rule_key: daily_loss_basis
  family: '*'
  value: "max(balance, equity) at previous 00:00 server time"
  text: "Enhanced 2-Step page (2026-10-11): At 00:00 Server time the daily loss limit is calculated for the next day based on the higher of balance or equity. Instant24 page states it exactly (previous end-of-day 00:00 server balance or equity, whichever is higher); Express says \"recalculated daily at 00:00 server time\"; the other pages give only the percentage."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445798-enhanced-2-step-"
  status: confirmed
  checked_on: 2026-10-11
- rule_key: trailing_lock
  family: express
  value: "locks at starting balance once profit equals the max loss (6 %)"
  text: "Max total loss 6 % trails upward and locks at the starting balance once 6 % gains are reached."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445797-express-1-step-"
  status: confirmed
  checked_on: 2026-09-29
- rule_key: trailing_max_loss
  family: [instant-funding, instant24]
  value: "trails balance high watermark"
  text: "Instant Funding: 6 % max loss trailing as balance rises. Instant24: 3 % initially, trails (high watermark - 3 %) on closed balance."
  source: "https://help.htrader.hmarkets.com/en/support/solutions/articles/158000445803-instant24"
  status: confirmed
  checked_on: 2026-09-29
