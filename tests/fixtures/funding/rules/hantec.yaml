  text: "Pending support's answer; prudent reading by Council decision 2026-10-04: the \"Profit Target -2%\" add-on lowers phase 1 only (combos.EFFECTS). Help articles do not say which phases (add-ons article 158000444230 re-read 2026-10-04: only 'Reduces the required profit target'; Enhanced 2-Step article 158000445798 re-read 2026-10-11 lists no such add-on). Today the catalogue sells it on Express (one phase) alone, so the reading moves no number yet."
  source: ""
  status: unconfirmed
  checked_on: 2026-10-11
