# The prop firms the project follows. Read by portfolio/funded/catalog/firms.py, the weekly
# fundingWatcher, the daily dealHunter and the buying universe. Protocol for adding one: the
# /firm-onboard skill (.claude/skills/firm-onboard/SKILL.md).
#
# status: candidate — followed (catalogue, rules, deals) while the admission protocol runs, NOT in
#         the studies or the notifications; active — admitted by the owner, in the universe and the
#         studies; rejected — no longer followed (kept here with the reason).
# catalogue: auto = a code adapter reads the firm's own site; manual = the site blocks automated
#         reading, the catalogue is typed in manual/<firm>.yaml and confirmed by the owner.
# code_check: whether a discount code can be verified with the firm itself (dealHunter).

- firm: hantec
  name: Hantec Trader
  status: active
  catalogue: auto
  code_check: true
  added_on: 2026-09-29
  admitted_by: owner, 2026-09-29
  notes: "Public purchase JSON; EAs on the challenges, not on the Instant programs."
- firm: ftmo
  name: FTMO
  status: active
  catalogue: auto
  code_check: false
  added_on: 2026-09-29
  admitted_by: owner, 2026-09-29
  notes: "Pricing table inline in the home page; sales visible there. The owner has an account."
- firm: fundednext
  name: FundedNext
