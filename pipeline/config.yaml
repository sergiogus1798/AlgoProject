# Every tunable of the pipeline, in one place. Nothing below is hidden in code.

run:
  # A stage prints its progress on stdout as "PROGRESS <0..100> <status line>". Any other
  # line becomes the status without moving the bar. This is the whole coupling between the
  # pipeline and the modules it chains: one print statement, no import.
  protocol: PROGRESS
  # Refuse to start a mother when the data root is already over budget. The budget is what
  # has to stop a multi-day run, not a full disk -- perf/disk owns the ceilings.
  stop_over_budget: true

  # How many variants each mother gets. The design is always the full one in the brief --
  # this picks how many of its rows are fabricated and retested, SPREAD across the strata
  # rather than taken off the top. Small numbers are for looking; the study's own number
  # is the brief's n_target, and `sample: 0` means all of it.
  #
  # ⚠️ Retesting costs ~70 ms per variant on the custodian, so 5,000 is about six minutes
  # of machine per mother -- but fabricating them is 70 MB, and 100 mothers is 7 GB.
  #
  # 2,000 is the default because it is where the answer stops being "cannot tell". Measured
  # on Strategy 17.9.39, 2026-09-22, the same grid at four sizes:
  #     11 points ->  9 usable, rho 0.18, IC [-0.55, 0.75]   indeciso
  #    150 points -> 74 usable, rho 0.23, IC [-0.00, 0.43]   indeciso
  #    600 points -> 297 usable, rho 0.22, IC [ 0.10, 0.32]  indeciso
  #  2,000 points -> 1001 usable, rho 0.19, IC [ 0.13, 0.25] no_fiable  <- decides
  # Roughly half of any batch is dropped for trading too little, so 2,000 buys ~1,000
  # points, and that is the width that separates a weak-but-real rho from nothing.
  # Whole run, cold start to verdict: 2 min 16 s and 28 MB.
  sample: 5000

  # Where the frozen mother strategies live, under the data root. Copies, never the live
  # master databank -- the reconnaissance has to be repeatable, and SQX rewrites what it
  # holds. MADRES.json beside them records each one's md5 and parameter count.
  mothers: donors/madres-2026-09-22

verdict:
  # Thresholds are the user's, they are changeable, and changing one re-runs the verdict
  # stage alone: the ledger stores the numbers, never the judgement. `number` is
  # "<file stem>.<field>", read from the design brief (`brief.`) and from every .json the
  # stages left in the work directory.
  rules:
    - number: brief.n_eff
      min: 1000
      why: fewer effective permutations than this and the SPP grid is not a sample of anything
    - number: brief.observed_max
      min: 0.0
      why: a family whose best variant loses money in sample is not worth an out-of-sample look
    # The canaries are NOT here. A failed canary is not a strategy being bad, it is the
    # experiment being invalid, so it is a hard gate on the `ran` row of recipe.yaml and
    # it stops the run rather than producing a verdict nobody should read.
    - number: wfc.rho
      min: 0.30
      why: below this the in-sample surface does not order the out-of-sample one
    # PROPOSED, from §11 of the protocol: "PBO below 50 % with the chosen rule". It is
    # read on `argmax` because that is what optimising means unless somebody decides
    # otherwise -- if the owner adopts the plateau centre as the house rule, this line
    # becomes cscv.pbo_plateau_centre and nothing else changes.
    # ⚠️ Measured 2026-09-22: on panels of pure noise the PBO of a single grid has a
    # standard deviation of 0.21 across draws. A grid at 0.45 and a grid at 0.55 are not
    # distinguishable, so this gate is a coarse filter and the report is the evidence.
    - number: cscv.pbo_argmax
      max: 0.50
      why: >-
        above this, picking the best parameters in sample chooses the ones about to
        disappoint more often than not -- the optimisation is worse than not optimising

sweep:
  # What `cleanup` is allowed to remove once a mother is finished. It deletes only paths
  # the collect stage recorded as removable, and only after re-hashing what it exported.
  require_hashes: true
