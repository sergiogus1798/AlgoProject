# The seven stages, in order, as data. `run.py` reads this file and nothing else decides
# what a pipeline is; the daemon that replaces the CLI will read the same file.
#
# Fields:
#   name       what the ledger calls the stage
#   command    the `python3 -m ...` line, run from the repository root. Split on spaces
#              first and each token formatted after, so a strategy name with spaces stays
#              one argument.
#   needs      paths that must exist before it starts, relative to the data root
#   produces   paths that must exist for it to count as done
#   record_from  the file `record`, `hash` and `must` read; default {work}/<name>.json
#   hash       ledger field -> file to fingerprint. `brief_hash` says WHICH design the
#              later stages were built from, so a brief that changed afterwards is caught
#   must       hard refusals read from the stage's own output. A gate, not a threshold:
#              it stops the run instead of producing a verdict
#   record     fields lifted from {work}/<name>.json into the ledger entry. This is how
#              stages.collected.removable gets there, which is what perf/disk/retention.py
#              reads to call a deletion proven rather than likely
#   recompute  re-run it even when it is done; only the verdict, which is a judgement
#
# Placeholders: {project} {databank} {strategy} {safe} {day} {work} {reports}
#   {work}     pipeline/<project>/<safe>
#   {reports}  reports/<project>/<databank>/<day>
#   {sample}   how many variants to fabricate, from pipeline/config.yaml
#   {safe}     the strategy name with spaces as _ and dots as -, the same spelling
#              sppUltra already uses for its brief filenames
#
# All seven rows drive real modules. `stubs/placeholder.py` is kept for verify/, which
# swaps every command for it so the ledger can be tested without SQX or a real export.

stages:
  - name: sppultra
    command: python3 -m strategies.sppUltra.report --project {project} --databank {databank} --strategy {strategy}
    needs: ["raw/{project}/{databank}"]
    produces: ["{reports}/design_brief_{safe}.json"]
    record_from: "{reports}/design_brief_{safe}.json"
    record: [verdict, n_eff]
    hash: {brief_hash: "{reports}/design_brief_{safe}.json"}

  # `design` and `build` are the same entry point twice: sqx.variants.make with and without
  # --design-only. That is not a workaround -- the design is seeded from variants/config.yaml
  # (`design.seed`) and every stratum draws from seed + its own index, so the second call
  # reproduces the first call's plan exactly and then fabricates it. Splitting them keeps the
  # cheap half resumable on its own, which is the whole point of a two-line design stage.
  # --out sends both at {work}, so the batch lands beside its own ledger instead of in
  # variants/<project>/<strategy>, which is where the command writes when run by hand.
  - name: design
    command: python3 -m sqx.variants.make --brief {reports}/design_brief_{safe}.json --project {project} --out {work} --design-only
    needs: ["{reports}/design_brief_{safe}.json"]
    produces: ["{work}/design.json", "{work}/plan.csv"]
    record: [n, shortfall]

  - name: build
    #   also produces {work}/manifest.parquet  (C2) and {work}/sqx/P*.sqx
    command: python3 -m sqx.variants.make --brief {reports}/design_brief_{safe}.json --project {project} --out {work} --sample {sample}
    needs: ["{work}/design.json"]
    produces: ["{work}/build.json", "{work}/manifest.parquet"]
    record: [n, bytes]

  # Drives the custodian: loads the batch, runs the harness's one Retest task, exports the
  # panel. It is the only stage that talks to SQX, and the only long one.
  - name: ran
    command: python3 -m sqx.variants.execute --work {work}
    needs: ["{work}/build.json"]
    produces: ["{work}/ran.json", "{work}/retest.csv"]
    record: [n_loaded, n_returned]

  # The ledger name is `collected` because perf/disk/retention.py already reads
  # stages.collected.removable to decide what is provably safe to delete.
  # It exits non-zero when the controls all return the same number, which is what a batch
  # that never actually ran looks like -- see knowhow/01-file-formats.md.
  - name: collected
    command: python3 -m sqx.variants.collect --work {work}
    needs: ["{work}/ran.json"]
    produces: ["{work}/collected.json", "{work}/metrics.parquet"]
    record: [n, files, removable, canaries_distinct]
    must:
      - number: canaries_distinct
        min: 2
        why: >-
          los controles han devuelto todos el mismo numero. Una variante que no llego a
          correr no sale vacia: sale con las metricas del padre, porque SQX las guarda en
          settings.xml y la fabrica solo reescribe los parametros. Si todos coinciden, no
          se reteseo nada y nada de lo que se mida despues quiere decir nada

  - name: wfc
    command: python3 -m strategies.walkForwardCorrelation.report --work {work}
    needs: ["{work}/collected.json"]
    produces: ["{work}/wfc.json", "{work}/wfc.html"]
    record: [n, rho, call]

  - name: verdict
    command: python3 -m pipeline.stages.verdict --work {work} --brief {reports}/design_brief_{safe}.json
    needs: ["{work}/wfc.json"]
    produces: ["{work}/verdict.json"]
    recompute: true
