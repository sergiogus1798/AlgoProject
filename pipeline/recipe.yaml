# The twelve stages, in order, as data. `run.py` reads this file and nothing else decides
# what a pipeline is; the daemon that replaces the CLI will read the same file.
#
# Fields:
#   name       what the ledger calls the stage
#   command    the `python3 -m ...` line, run from the repository root. Split on spaces
#              first and each token formatted after, so a strategy name with spaces stays
#              one argument.
#   needs      paths that must exist before it starts, relative to the data root
#   produces   paths that must exist for it to count as done
#   record_from  the file `record`, `hash` and `must` read; default {work}/<name>.json
#   hash       ledger field -> file to fingerprint. `brief_hash` says WHICH design the
#              later stages were built from, so a brief that changed afterwards is caught
#   must       hard refusals read from the stage's own output. A gate, not a threshold:
#              it stops the run instead of producing a verdict
#   record     fields lifted from {work}/<name>.json into the ledger entry. This is how
#              stages.collected.removable gets there, which is what perf/disk/retention.py
#              reads to call a deletion proven rather than likely
#   recompute  re-run it even when it is done; only the verdict, which is a judgement
#
# Placeholders: {project} {databank} {strategy} {safe} {day} {work} {reports}
#   {work}     pipeline/<project>/<safe>
#   {reports}  reports/<project>/<databank>/<day>
#   {sample}   how many variants to fabricate, from pipeline/config.yaml
#   {safe}     the strategy name with spaces as _ and dots as -, the same spelling
#              sppUltra already uses for its brief filenames
#   {project}  the mother's own workflow project (hard rule 10) -- ONE project for the
#              whole run, `spp_is`/`spp_oos` included: they rewrite that project's own
#              "SPP IS"/"SPP OOS" task by title (sqx.variants.harness), never a project
#              built just to hold the harness (OPEN.md §38, owner 2026-09-29)
#
# All twelve rows drive real modules. `stubs/placeholder.py` is kept for verify/, which
# swaps every command for it so the ledger can be tested without SQX or a real export.

stages:
  # The reconnaissance, in sample and out. These are the expensive rows -- tens of minutes
  # and tens of gigabytes each -- and they are first because everything downstream is
  # shaped by what they find. ⚠️ Both run on the custodian, one at a time: the profile is
  # ~20 MB on disk but tens of gigabytes while it is built, so two at once do not fit.
  - name: spp_is
    command: python3 -m sqx.variants.spp --work {work} --mother {mother} --kind spp_is --chart XAUUSD_DukasM1_Infinox=M30=5 --project {project}
    needs: []
    produces: ["{work}/spp_is.json"]
    record: [tested, wall_s, max_tests, spread_pct]

  - name: spp_oos
    command: python3 -m sqx.variants.spp --work {work} --mother {mother} --kind spp_oos --chart XAUUSD_DukasM1_Infinox=M30=10 --project {project}
    needs: ["{work}/spp_is.json"]
    produces: ["{work}/spp_oos.json"]
    record: [tested, wall_s]

  # Lift the in-sample profile out of the worker and into the data root, where sppUltra
  # reads it. The out-of-sample one is exported for comparison and is not what the grid is
  # built from: a design chosen on the data it will be judged against is not a design.
  - name: spp_export
    command: python3 -m sqx.export.export_spp --project {project} --databank SPPRecon_In --role custodian --out-databank {databank}
    needs: ["{work}/spp_oos.json"]
    produces: ["raw/{project}/{databank}/{day}/spp/spp.parquet"]

  - name: sppultra
    command: python3 -m studies.breakage.spp.report --project {project} --databank {databank} --strategy {strategy}
    needs: ["raw/{project}/{databank}"]
    produces: ["{reports}/spp/design_brief_{safe}.json"]
    record_from: "{reports}/spp/design_brief_{safe}.json"
    record: [verdict, n_eff]
    hash: {brief_hash: "{reports}/spp/design_brief_{safe}.json"}

  # `design` and `build` are the same entry point twice: sqx.variants.make with and without
  # --design-only. That is not a workaround -- the design is seeded from variants/config.yaml
  # (`design.seed`) and every stratum draws from seed + its own index, so the second call
  # reproduces the first call's plan exactly and then fabricates it. Splitting them keeps the
  # cheap half resumable on its own, which is the whole point of a two-line design stage.
  # --out sends both at {work}, so the batch lands beside its own ledger instead of in
  # variants/<project>/<strategy>, which is where the command writes when run by hand.
  - name: design
    command: python3 -m sqx.variants.make --brief {reports}/spp/design_brief_{safe}.json --project {project} --out {work} --design-only
    needs: ["{reports}/spp/design_brief_{safe}.json"]
    produces: ["{work}/design.json", "{work}/plan.csv"]
    record: [n, shortfall]

  - name: build
    #   also produces {work}/manifest.parquet  (C2) and {work}/sqx/P*.sqx
    command: python3 -m sqx.variants.make --brief {reports}/spp/design_brief_{safe}.json --project {project} --out {work} --sample {sample}
    needs: ["{work}/design.json"]
    produces: ["{work}/build.json", "{work}/manifest.parquet"]
    record: [n, bytes]

  # Drives the custodian: loads the batch, runs the project's THREE retest tasks -- build,
  # oos1 and oos2, each at its own costs and with the cross-market check inside -- and
  # exports one panel per leg. It is the only stage that talks to SQX, and the only long one.
  - name: ran
    command: python3 -m sqx.variants.execute --work {work}
    needs: ["{work}/build.json"]
    produces: ["{work}/ran.json"]   # y un retest_<tramo>.csv por pata, que ran.json nombra
    record: [n_loaded, n_returned, n_on_disk]

  # Reads every retested .sqx off the custodian's disk and keeps the one thing the panel
  # throws away: what each variant earned period by period. Nothing here talks to SQX --
  # the `ran` stage flushed the databank to files before it stopped the install, and this
  # is a zip read. It has to run BEFORE the next mother's `ran` clears that databank.
  #
  # ⚠️ Between `ran` and here, those files are only as safe as the next restart of the
  # custodian. Whoever starts that install next syncs what its memory holds, and an empty
  # memory means 5,000 deleted files (knowhow/databanks/sync-deletes-unloaded-files.md, hard rule 1). A run that
  # stops between the two stages should resume at `equity` before anything else touches
  # W2 -- and if another session needs the custodian meanwhile, harvest first.
  - name: equity
    command: python3 -m sqx.variants.equity --work {work}
    needs: ["{work}/ran.json"]
    produces: ["{work}/equity.json", "{work}/equity.parquet"]
    record: [n, days, bytes, open_at_end, markets]
    must:
      - number: unreadable
        max: 0
        why: >-
          hay un bloque (tramo x mercado) donde NINGUNA curva cuadra con lo que SQX
          guardo. Un .sqx reteseado con cross-check lleva una curva por mercado mas la
          del portfolio: si se esta leyendo la que no es, todo lo que venga despues mide
          otra cosa. Unas pocas descuadradas no son fallo -- son posiciones abiertas al
          cerrar el tramo, y van en `open_at_end`

  # The ledger name is `collected` because perf/disk/retention.py already reads
  # stages.collected.removable to decide what is provably safe to delete.
  # It exits non-zero when the controls all return the same number, which is what a batch
  # that never actually ran looks like -- see knowhow/sqx-format/.
  - name: collected
    command: python3 -m sqx.variants.collect --work {work}
    needs: ["{work}/equity.json"]   # las uniones se recortan con los tramos que midio equity
    produces: ["{work}/collected.json", "{work}/metrics.parquet", "{work}/segments.parquet"]
    record: [n, files, removable, canaries_distinct]
    must:
      - number: canaries_distinct
        min: 2
        why: >-
          los controles han devuelto todos el mismo numero. Una variante que no llego a
          correr no sale vacia: sale con las metricas del padre, porque SQX las guarda en
          settings.xml y la fabrica solo reescribe los parametros. Si todos coinciden, no
          se reteseo nada y nada de lo que se mida despues quiere decir nada

  - name: wfc
    command: python3 -m studies.optimisation.wfc.report --work {work}
    needs: ["{work}/collected.json"]
    produces: ["{work}/wfc.json", "{work}/estudios/wfc.html"]
    record: [n, rho, call]

  # Where `wfc` asks whether this surface carried over, this asks whether the WAY the
  # parameters get picked is prone to overfitting at all -- 924 ways of splitting the
  # history, three selection rules, and what each one costs. Needs the per-period matrix,
  # which is why it sits after `equity` and not next to `wfc`.
  # Named for what it writes, like every other row: the stage is `cscv`, the command that
  # produces it is `pbo`. `pipeline/stages/verdict.py` keys its thresholds on the file
  # stem, so a row whose name and output disagree is a threshold that cannot be read.
  - name: cscv
    command: python3 -m studies.optimisation.cscv.report --work {work}
    needs: ["{work}/wfc.json", "{work}/equity.parquet"]
    produces: ["{work}/cscv.json", "{work}/estudios/cscv.html"]
    record: [pbo_argmax, pbo_plateau_centre, dsr, n_clusters, slope]

  - name: verdict
    command: python3 -m pipeline.stages.verdict --work {work} --brief {reports}/spp/design_brief_{safe}.json
    needs: ["{work}/wfc.json", "{work}/cscv.json"]
    produces: ["{work}/verdict.json"]
    recompute: true
