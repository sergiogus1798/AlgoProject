# What the autopilot keeps at each judging step. Read by pipeline/autopilot/judge.py.
#
# dev — while the workflow itself is being built (owner, 2026-10-01: "no me interesan los
#   filtros, me interesa que la aplicación y el workflow funcionen bien"). At the steps in `at`,
#   keep `sample` strategies drawn at random among those that pass the step's rules — all of
#   them while a step has none. `seed: null` draws a fresh seed each run; the run records it.
#   `on: false` once the criteria below are the real ones.
#
# steps — one entry per judging step:
#   cut    the databank the next SQX task reads: where the verdict is applied. A step with
#          rules and no `cut` stops the run.
#          Step 12 cuts CrossTF, before step 13 copies its mothers to CrossTF_Mothers: a mother
#          is judged by her siblings' facts (`crossTF.cells.<role>.<tf>.*`, `crossTF.reading.*`)
#          and, if she passes, only she goes on — on her own timeframe, unscaled. Every scaled
#          sibling in a cut databank always goes (owner, 2026-10-01).
#          Step 14 cuts «MCR 8 Stress», the one of the eight MCR databanks SPP IS reads; the
#          other seven keep everyone and nothing reads them again (owner, 2026-10-01).
#          Step 16 cuts «SPP OOS»: the WFM (19) reads it, and 16.5 takes the survivors from it,
#          matched to their «SPP IS» counterparts, and designs from the combined backtest
#          (owner, 2026-10-01).
#   rules  each one tests one fact, a key of the step's hechos.parquet
#          (`python3 -m pipeline.autopilot.facts --project P --step N` lists them), and gives
#          pass, limbo or fail:
#            {fact: K, pass: ">= 0", limbo: ">= -100"}
#            {fact: K, near_median: 0.2, limbo_near_median: 0.5}
#              |value − median| ≤ tol × |median|, the median over the databank being cut
#          A rule may vary by what the project is — its timeframe, symbol or asset class
#          (`forex`, `no_forex`); several joined by "+" must all hold; the first entry that
#          matches replaces the fields it names, no match leaves the rule as written:
#            {fact: K, pass: ">= 2.33", limbo: ">= 1.65", by: {H4: {pass: ">= 2.5", limbo: ">= 1.9"}}}
#          A strategy's outcome is its worst rule; a strategy without the fact is limbo
#          (owner, 2026-10-01: odd, but limbo). A rule may say where a missing fact goes:
#            `missing: pass|limbo|fail` (limbo when absent: today's behaviour).
#          No rules: every strategy passes. A limbo goes on, marked (owner, 2026-10-01).
#          Not everything is a number (owner, 2026-10-03):
#            {fact: K, is: pass}                    a verdict: the test said yes (its fact is 1);
#                                                   `is: fail` wants its no (0)
#            {all: [rule, rule]} / {any: [...]}     a compound: its worst part / its best part;
#                                                   a part may be any rule, a compound included
#          `else: limbo` on a rule of any shape: not met is Limbo instead of Fail (the explicit
#          form of an unreachable limbo). `name:` is the words the window shows for the rule.
#
# The window's «Criterios» zone reads and writes this file (ui/daemon/criteria/), comments kept;
# each change is one line of ledger/criteria-history.jsonl. Its «Congelar» writes
# `frozen: {on, by, sha}` here, first: from then on the window refuses every write. Lifting it
# is deleting that line by hand.
dev:
  on: true
  sample: 3
  at: ["8"]
  seed: null

steps:
  # PROVISIONAL (Council 2026-10-04): do not freeze before a null population has run the chain. Steps 17, 18, 19, 21, 23, 24 annotate only: no rule on purpose.
  # Paso 8 — propuesta de agente 2026-10-04, PROVISIONAL hasta que el dueño la apruebe. Sustituye a la
  # del 2026-10-02 (poblaciones que incumplían las reglas 14 y 15). Recalibrada sobre 116 celdas
  # base (17 activos, M30 y H1, cinco familias y pullback, largo y corto; 405.866 estrategias) con
  # oos2 como zona de VALIDACIÓN (autorizado por el dueño para esta calibración):
  # docs/AgentPDFs/criterios-pasos-6-a-12-2026-10-04.md §5.
  # El paso 8 LIMPIA, no prueba: lo que pasa bien oos1 va algo mejor en oos2 (+52 por cada 1.000
  # a t >= 1,65, a igual número de operaciones) pero el 60 % sigue acabando en negativo. Por eso
  # Fallo es sólo lo claramente malo, y la t decide entre Limbo y Pass. Medido sobre las 116
  # celdas con «Fallo = R1, R2, R2b o R9»: 734 Fallo, 259 Limbo, 6,2 Limbo con t >= 1,65 y 0,9
  # Pass por cada 1.000 (las reglas del 2026-10-02 daban 997 / 3,1 / 0,04). Las líneas de Pass de
  # R4-R8 de abajo no entran en esa cuenta: la harán algo más estricta.
  # Un «limbo» imposible de incumplir (">= -1000", "<= 1000") quiere decir «esta regla nunca da
  # Fallo»: sólo separa Pass de Limbo.
  "8":
    cut: OOS
    segment: oos1     # what the cut reads: the ledger row's segment (oos1 when a step omits it)
    rules:
      # R1 — está en el databank OOS y su lista de operaciones no es escasa ni un clon
      - {fact: gate.scorecard.presencia_passed, pass: ">= 1", missing: fail}
      - {fact: gate.scorecard.sanidad_passed, pass: ">= 1", missing: fail}
      # R2 — ganó dinero en oos1 (en oos2: +34 por cada 1.000 a igual número de operaciones)
      - {fact: gate.scorecard.estaticas_value, pass: "> 0"}
      # R2b — sigue ganando al spread real de Darwinex (en oos2: +28). Sin escaneo de spread
      # para el activo el dato falta, y un dato que falta es Limbo.
      - {fact: spread.verdict_csv.neto_con_slippage_real_oos, pass: "> 0"}
      # R3 — t de la operación en oos1 descontando la deriva del mercado. Nunca da Fallo: 2,33 es
      # la línea de Pass (en oos2: +103 por cada 1.000, sobre pocas celdas) y por debajo es Limbo.
      # ⚠️ El término de deriva de la puerta está sesgado por el lado (tamaño ∝ 1/ATR): hasta
      # ±0,27 de t en H1 y M30. La corrección está medida y propuesta (§5.3 del dossier) y NO
      # aplicada: este dato sigue siendo el de la puerta sin corregir.
      # Council 2026-10-04: t>=2.33 PASS (FPR 0.6 %), 1.65-2.33 LIMBO (FPR 3.9 %), <1.65 FAIL. H1 is at most LIMBO (lift +19 ~ 0): its pass line is unreachable on purpose until a fresh sample (10, 12, 20) promotes it.
      - {fact: gate.scorecard.drift_excess_t, pass: ">= 2.33", limbo: ">= 1.65",
         by: {H4: {pass: ">= 2.5", limbo: ">= 1.65"}, H1: {pass: ">= 1000", limbo: ">= 1.65"}}}
      # R4 — operaciones por año en el IS. El suelo del dueño (35) es línea de Pass, NO descarte:
      # como descarte pierde el 81 % de las robustas, en H1 y en M30 por igual, sin mejorar la
      # calidad por operación. Por debajo de 10 no hay estadística. Techo: por encima de 75 las
      # poblaciones dan 0,41 veces lo que da el azar. H4 no se ha recalibrado.
      # Council: <20/yr FAIL (15 on H4), 20-35 LIMBO.
      - {fact: gate.scorecard.is_trades_per_year, pass: ">= 35", limbo: ">= 20", by: {H4: {pass: ">= 35", limbo: ">= 15"}}}
      # Council: above 75 = FAIL (no limbo).
      - {fact: gate.scorecard.is_trades_per_year, pass: "<= 75",
         by: {H4: {pass: "<= 50", limbo: "<= 65"}}}
      # R5 — la frecuencia no se hundió fuera de muestra
      - {fact: gate.scorecard.oos_trades_per_year, pass: ">= 15", limbo: ">= 10"}
      # Council: fewer than 100 oos1 trades = unreadable, LIMBO.
      - {fact: spread.verdict_csv.operaciones_oos, pass: ">= 100", else: limbo}
      # Council (step 25's band, read here because edgeCost already runs at step 8): the edge
      # survives the declared cost x2 PASS, x1.25-2 LIMBO, dies at x1.25 FAIL (Kaufman).
      - {fact: edgeCost.verdict_csv.edge_mean, pass: ">= 2", limbo: ">= 1.25", missing: limbo}
      # R6, R7, R8 — drawdown OOS / IS, años de oos1 en positivo y concentración del beneficio.
      # No recalibradas en 2026-10-04: dejan de dar Fallo y sólo separan Pass de Limbo.
      - {fact: gate.scorecard.forma_value, pass: "<= 1.25", limbo: "<= 1000"}
      - {fact: gate.scorecard.degradacion_years_positive, pass: ">= 3", limbo: ">= -1000"}
      - {fact: gate.scorecard.degradacion_concentration, pass: "<= 0.5", limbo: "<= 1000"}
      # R9 — riesgo flotante en R (1R = el riesgo por operación del sizing). A 1 % de cuenta por
      # R, un día de -5R es el límite diario del 5 % de una cuenta de fondeo. Las robustas tienen
      # un peor día mediano de -1,8R a -2,3R en todas las familias.
      - {fact: gate.scorecard.oos_worst_day_r, pass: ">= -3", limbo: ">= -5"}
      - {fact: gate.scorecard.oos_worst_trade_mae_r, pass: ">= -3", limbo: ">= -5"}
      # Drawdown / neto anual: ya no da Fallo (sólo el 12 % de las limpias cumplía <= 2,5 y con
      # ella el Fallo subía a 969 por cada 1.000).
      - {fact: gate.scorecard.oos_dd_over_net_year, pass: "<= 1.5", limbo: "<= 1000"}
      # SIN regla, a propósito: p del mono (no separa en oos2: 301 frente a 296 por cada 1.000),
      # edge por coste y snooping (separan, pero repiten a R2), calidad del feed, forma del
      # beneficio y calidad de la entrada (dueño, 2026-10-01: fuera de este criterio).
  "10":
    cut: Retest Markets - Family
    segment: oos1
    rules:
      # Council: half the markets at >=0.5x the original AND pooled t>=2.33 PASS; pooled t<1.0 FAIL. Stouffer is never a criterion.
      - {fact: crossmarket.verdict_csv.excess_t_vs_main_half, pass: ">= 0.5", limbo: "> 0", missing: limbo}
      - {fact: crossmarket.verdict_csv.excess_t_pooled, pass: ">= 2.33", limbo: ">= 1.0"}
  "12":
    cut: CrossTF
    segment: oos1
    rules:
      # Council: z_new>=2.33 PASS; below it LIMBO, never FAIL. Raw z never counts.
      - {fact: crossTF.combined.z_new, pass: ">= 2.33", else: limbo}
  "14":
    cut: MCR 8 Stress
    segment: oos1
    rules:
      # Council: kill-only. Surviving this is not evidence, only "not dead".
      - {fact: mcRetest.stress.la_cola.profit_factor_p5.valor, pass: ">= 1.0"}
  "16":
    cut: SPP OOS
    segment: oos1
    # Council: FAIL-only on a peak solution / grid mean - 1 sd < 0; neither is exposed as a fact yet, so no rule.
    rules: []
