# What the autopilot keeps at each judging step. Read by pipeline/autopilot/judge.py.
#
# dev — while the workflow itself is being built (owner, 2026-10-01: "no me interesan los
#   filtros, me interesa que la aplicación y el workflow funcionen bien"). At the steps in `at`,
#   keep `sample` strategies drawn at random among those that pass the step's rules — all of
#   them while a step has none. `seed: null` draws a fresh seed each run; the run records it.
#   `on: false` once the criteria below are the real ones.
#
# steps — one entry per judging step:
#   cut    the databank the next SQX task reads: where the verdict is applied. A step with
#          rules and no `cut` stops the run; `cut: null` judges and writes but deletes nothing.
#          Step 12 cuts CrossTF, before step 13 copies its mothers to CrossTF_Mothers: a mother
#          is judged by her siblings' facts (`crossTF.cells.<role>.<tf>.*`, `crossTF.reading.*`)
#          and, if she passes, only she goes on — on her own timeframe, unscaled. Every scaled
#          sibling in a cut databank always goes (owner, 2026-10-01).
#          Step 14 cuts «MCR 7 OHLC», the MCR databank SPP IS reads (owner, 2026-10-07; it was
#          «MCR 8 Stress»); the other MCR databanks keep everyone and nothing reads them again.
#          Step 16 cuts «SPP OOS»: the WFM (19) reads it, and 16.5 takes the survivors from it,
#          matched to their «SPP IS» counterparts, and designs from the combined backtest
#          (owner, 2026-10-01).
#   siblings  `follow` — a scaled sibling in the cut databank leaves only with its mother
#          (step 11.5: its databank feeds 11.7); absent, every sibling goes, as at step 12.
#   rules  each one tests one fact, a key of the step's hechos.parquet
#          (`python3 -m pipeline.autopilot.facts --project P --step N` lists them), and gives
#          pass, limbo or fail:
#            {fact: K, pass: ">= 0", limbo: ">= -100"}
#            {fact: K, near_median: 0.2, limbo_near_median: 0.5}
#              |value − median| ≤ tol × |median|, the median over the databank being cut
#          A rule may vary by what the project is — its timeframe, symbol or asset class
#          (`forex`, `no_forex`); several joined by "+" must all hold; the first entry that
#          matches replaces the fields it names, no match leaves the rule as written:
#            {fact: K, pass: ">= 2.33", limbo: ">= 1.65", by: {H4: {pass: ">= 2.5", limbo: ">= 1.9"}}}
#          A strategy's outcome is its worst rule; a strategy without the fact is limbo
#          (owner, 2026-10-01: odd, but limbo). A rule may say where a missing fact goes:
#            `missing: pass|limbo|fail` (limbo when absent: today's behaviour).
#          Step 8's facts come level by level (`gate.scorecard.*`): a strategy the gate dropped
#          at a rule has no fact of the levels after it, and its reason is that rule alone
#          (the scorecard's `cayo_nivel` / `cayo_regla`), not the «sin dato» of the rest.
#          No rules: every strategy passes. A limbo goes on, marked (owner, 2026-10-01).
#          Not everything is a number (owner, 2026-10-03):
#            {fact: K, is: pass}                    a verdict: the test said yes (its fact is 1);
#                                                   `is: fail` wants its no (0)
#            {all: [rule, rule]} / {any: [...]}     a compound: its worst part / its best part;
#                                                   a part may be any rule, a compound included
#          `else: limbo` on a rule of any shape: not met is Limbo instead of Fail (the explicit
#          form of an unreachable limbo). `name:` is the words the window shows for the rule.
#
# The window's «Criterios» zone reads and writes this file (ui/daemon/criteria/), comments kept;
# each change is one line of ledger/criteria-history.jsonl. Its «Congelar» writes
# `frozen: {on, by, sha}` here, first: from then on the window refuses every write. Lifting it
# is deleting that line by hand.
steps:
  # PROVISIONAL (Council 2026-10-04): do not freeze before a null population has run the chain. Step 21 annotates only: no rule on purpose.
  # Paso 8 — la puerta por niveles (encargo 44, conmutada el 2026-10-07): 16 reglas (R5 son dos
  # líneas de un lado), en el orden de los niveles de studies/screening/gate/levels.py. La
  # puerta juzga cada regla tras el nivel que da su hecho y la estrategia sale en su primer
  # Falla; el juez relee estas mismas reglas sobre el scorecard. Las líneas son las de la tabla
  # final del encargo (§1.2) y las lecturas del dueño (P.5 bis): R3 sin Limbo ni excepción por
  # timeframe, y sin dato Falla. Reglas de dos hechos: `all` = la peor parte, `any` = la mejor.
  # Niveles: 0 = R1a, R1b, R2 · 1b = coste, R5d, calidad de datos · 2 = retraso · 3 = R7, R6, la z del mono.
  # Fuera desde la conmutación: R5 vieja (oos_trades_per_year), R6-R8 viejas (forma,
  # degradacion), R9a y R9c (peor día, drawdown / neto), spread.* y edgeCost.*.
  "8":
    cut: OOS
    medoids: 4        # of the survivors, only the medoid (by entry-bar Jaccard) of the N largest structure groups; N is read here by the judge
    segment: oos1     # what the cut reads: the ledger row's segment (oos1 when a step omits it)
    rules:
      # R1a — la estrategia del build aparece en el retest
      - {fact: gate.scorecard.presencia_passed, pass: ">= 1", missing: fail}
      # R1b — sanidad y clones, como hoy
      - {fact: gate.scorecard.sanidad_passed, pass: ">= 1", missing: fail}
      # R2 — neto de oos1
      - {fact: gate.scorecard.estaticas_value, pass: "> 0"}
      # R4a, R5, R5b, R8, R9b — YA NO JUZGAN (dueño, 2026-10-12, encargo 65 §5.2): la puerta los
      # sigue calculando y el scorecard los guarda como columnas (is_trades_per_year,
      # sanidad_value, z_frec, t_sin_mejor_trimestre, t_sin_3_mejores, mae_p95_r), sin regla.
      # R3 y la t de R5c (t_exceso_k) tampoco juzgan: los sustituye la z de abajo. Queda de R5c
      # la parte del coste: la ventaja frente al coste, sin la t.
      - {fact: gate.scorecard.edge_mean_oos, pass: ">= 2", limbo: ">= 1.25"}
      # R5d — degradacion dentro de oos1: t_b < -1,65 es Limbo, y Falla solo si ademas e_fin <= 0
      - all:
          - {fact: gate.scorecard.t_b, pass: ">= -1.65", else: limbo}
          - any:
              - {fact: gate.scorecard.t_b, pass: ">= -1.65"}
              - {fact: gate.scorecard.e_fin, pass: "> 0"}
      # Calidad de datos — Pasa con ret >= 0,60 o ninguna operacion afectada; Falla solo con
      # ret < 0,25 y t_a > 1,65 (la tercera parte: Limbo si t_a <= 1,65, nunca Pasa por si sola)
      - any:
          - {fact: gate.scorecard.n_afectadas, pass: "== 0"}
          - {fact: gate.scorecard.ret_datos, pass: ">= 0.6", limbo: ">= 0.25"}
          - all:
              - {fact: gate.scorecard.t_a, pass: "<= 1.65"}
              - {fact: gate.scorecard.ret_datos, pass: ">= 0.6", else: limbo}
      # Retraso de una barra — como la calidad de datos, sobre la peor variante
      - any:
          - {fact: gate.scorecard.retraso_ret_min, pass: ">= 0.6", limbo: ">= 0.25"}
          - all:
              - {fact: gate.scorecard.retraso_t_delta, pass: "<= 1.65"}
              - {fact: gate.scorecard.retraso_ret_min, pass: ">= 0.6", else: limbo}
      # R7 — homogeneidad por trimestres. Nunca da Falla
      - {fact: gate.scorecard.q_p, pass: "> 0.05", else: limbo}
      # R6 — drawdown
      - {fact: gate.scorecard.dd_p, pass: "> 0.10", limbo: "> 0.01"}
      # La z — LA regla que juzga (encargo 65 §5.2): la z de la estrategia sobre su mono con horas
      # (sorteado solo en sus horas de entrada) >= Φ⁻¹(1 − alpha/B), B = lotes cribados en oos1 en
      # la celda (activo × TF × dirección × familia) contando este. No lleva número: el umbral es
      # por celda y lo calcula el juez (criteria.thresholded, ledger.cells.batches_for): 1,645 con
      # B = 1; 1,960 con 2; 2,241 con 4. La fila del ledger anota B y el umbral usado.
      - {name: "z del mono con horas, por celda", fact: gate.scorecard.z_mono, alpha: 0.05, per: cell,
         missing: fail}
      # p_fdr (probabilidad de no ser nula, nula empírica del lote; engines/inference/localfdr) es
      # una COLUMNA del scorecard, sin regla: su corte espera a la fila 9 del encargo 65.
  "10":
    cut: Retest Markets - Family
    segment: oos1
    # Paso 10 — «¿la lógica viaja?» (encargo 46): P1-P9 de la propuesta del dueño del 2026-10-06
    # (criterios-implementados-2026-10-12.md, §7.2 y §7.3), lo que mide
    # studies/transfer/crossmarket/travel. PROVISIONAL y SIN CALIBRAR: las líneas son las de la
    # propuesta; falta pasar la población nula y la de ventaja plantada. P7 divide entre e_principal,
    # la ventaja del principal en su oos1, que crossmarket calcula él mismo desde el 2026-10-09
    # (antes sin dato: nadie pasaba el paso 10). Una condición con dos hechos (frecuencia, mercados en
    # contra, degradación) es una regla compuesta: `all` = la peor parte, `any` = la mejor.
    rules:
      # 7.1 — controles previos: la lista de mercados es usable
      - {name: "Mercados válidos de la lista", fact: crossmarket.verdict_csv.invalid_fraction,
         pass: "<= 0.25", else: limbo}
      # P1 — unidades de las reglas: distancias fijas en puntos o pips no viajan
      - {name: "P1 · Reglas sin distancias fijas", fact: crossmarket.verdict_csv.fixed_distance,
         pass: "<= 0", else: limbo}
      # P2 — frecuencia por mercado: 0 mercados fuera pasa, 1-2 Limbo, 3 o más (o más del 25 %) Falla
      - name: "P2 · Frecuencia de operar en cada mercado"
        all:
          - {fact: crossmarket.verdict_csv.freq_off, pass: "<= 0", limbo: "<= 2"}
          - {fact: crossmarket.verdict_csv.freq_off_fraction, pass: "<= 0.25"}
      # P3 — z conjunta frente al azar sobre V0 + V2 (V1, donde el principal se ajustó, fuera;
      # dueño, 2026-10-12). P4 (z_conj_v2) ya no juzga: queda como columna.
      - {name: "P3 · Mejor que el azar en el conjunto", fact: crossmarket.verdict_csv.z_conj_v0v2,
         pass: ">= 1.65", limbo: ">= 0"}
      # P5 — quitando cada mercado: la evidencia no cuelga de uno. Nunca da Falla
      - {name: "P5 · No depende de un solo mercado", fact: crossmarket.verdict_csv.z_minus_market,
         pass: ">= 1.65", else: limbo}
      # P6 — amplitud: la dirección se repite en más mercados de lo que daría la suerte. Nunca da Falla
      - {name: "P6 · Amplitud entre mercados", fact: crossmarket.verdict_csv.p_breadth,
         pass: "<= 0.10", else: limbo}
      # P7 — rendimiento mínimo en la mitad de los mercados, frente a casa. Sin dato: Limbo
      - {name: "P7 · Rendimiento mínimo en la mitad", fact: crossmarket.verdict_csv.tau_half,
         pass: ">= 0.5", limbo: "> 0", missing: limbo}
      # P8 — mercados en contra: hasta 1 pasa, 2 Limbo, 3 o más (o más del 25 %) Falla.
      # Los structural de volatility/meanReversion/session son control negativo y cuentan con z >= +1,65;
      # los de trendFollowing/momentum/pattern no cuentan (assets/_markets.yaml › _expected_sign).
      - name: "P8 · Mercados en contra"
        all:
          - {fact: crossmarket.verdict_csv.worse, pass: "<= 1", limbo: "<= 2"}
          - {fact: crossmarket.verdict_csv.worse_fraction, pass: "<= 0.25"}
      # P9 (§7.3) — degradación en el tiempo, relajada. Con z = z_beta y e = e_end:
      #   Pasa:  z > -1.65, o (z > -2.33 y e > 0)
      #   Falla: z <= -2.33 y e <= 0
      #   Limbo: lo demás (cae claro pero queda ventaja; cae algo y ya no queda; sin dato)
      # Primera parte: Pasa cuando alguna de las dos vías se cumple, Limbo si sólo cae algo sin
      # ventaja o cae mucho con ventaja. Segunda: Falla sólo si fallan las dos condiciones.
      - name: "P9 · Degradación en el tiempo"
        all:
          - any:
              - {fact: crossmarket.verdict_csv.z_beta, pass: "> -1.65"}
              - all:
                  - {fact: crossmarket.verdict_csv.z_beta, pass: "> -2.33", else: limbo}
                  - {fact: crossmarket.verdict_csv.e_end, pass: "> 0", else: limbo}
          - any:
              - {fact: crossmarket.verdict_csv.z_beta, pass: "> -2.33"}
              - {fact: crossmarket.verdict_csv.e_end, pass: "> 0"}
  "11.5":
    # Criba de fase 1 de crossTF (encargo 47): T0, T2a y T3 con lo que hay en oos1. SIN regla que
    # corte hasta el «corta» del dueño (la regla lista para pegar está en docs/encargos/47-…,
    # «Paquete del corte»): el paso registra sus hechos `crossTF.tf.*` y no quita a nadie.
    # Cuando corte, lo hará en CrossTF_Input, lo que el 11.7 lee: sale la madre que falle y sus
    # hermanas (`siblings: follow`); las hermanas de las que siguen se quedan para el build.
    cut: CrossTF_Input
    segment: oos1
    siblings: follow
    rules: []
  "12":
    cut: CrossTF
    segment: oos1
    rules:
      # Council: z_new>=2.33 PASS; below it LIMBO, never FAIL. Raw z never counts.
      - {fact: crossTF.combined.z_new, pass: ">= 2.33", else: limbo}
  "14":
    cut: MCR 7 OHLC
    segment: oos1
    # Paso 14 — columna, sin regla (consenso de las cuatro opiniones, encargo 65 §3d; dueño,
    # 2026-10-12): T2 y T3 se borraron y T1 queda como hechos `mcRetest.fragilidad.t1.*` que el
    # 16.5 enseña. No corta ni juzga.
    rules: []
  "16":
    cut: SPP OOS
    segment: oos1
    # Council: FAIL-only on a peak solution / grid mean - 1 sd < 0; neither is exposed as a fact yet, so no rule.
    rules: []
  "16.5":
    # Fábrica de variantes y nube (encargo 48): un lote y un mapa que no cortan nada. Sin regla.
    cut: null
    rules: []
  "17":
    # Paso 17 — «¿elegir por el pasado sirve fuera?» (propuesta criterios-implementados-2026-10-12, §6; dueño,
    # 2026-10-07). Sólo la composición c1 (build+oos1 → oos2) decide. `wfc.c1.estado` es un
    # NÚMERO (los hechos lo son): pasa = 1, limbo = 0, no_pasa = -1. PASA es un veto levantado,
    # no un voto a favor. Tabla (dueño, 2026-10-08: el nivel LLEVA significancia, como en el
    # encargo 48): orden positivo o neutro, mediana neta del top fuera > 0 y `p_nivel` <=
    # `wfc.level_alpha` = PASA; mediana > 0 sin significancia, u orden perverso con el top
    # ganando = LIMBO; mediana del top <= 0 = NO PASA; sin dato = LIMBO. oos2 sigue sellado hasta que
    # `studies.optimisation.wfc.calibrate` registre su calibración para este fichero
    # (`ledger.gate.seal`). `cut: null` a propósito (dueño, 2026-10-07): el 17 sólo anota —
    # el juez evalúa su regla, escribe hechos, veredicto y fila del ledger y no borra nada en
    # SQX; 18, 18.5 y 19 corren para toda superviviente y el 20 lee NO PASA como fallo.
    cut: null
    segment: oos2
    rules:
      - {name: "WFC · el top gana fuera y elegir no empeora (c1)",
         fact: wfc.c1.estado, pass: ">= 1", limbo: ">= 0", missing: limbo}
  "18":
    # Paso 18 — columna, sin veredicto (encargo 65 §3c; dueño, 2026-10-12): la CSCV y el PBO se
    # calculan y se enseñan. Sus hechos (`cscv.p_perdida`,
    # `cscv.p_perdida_sobre_p95`, `cscv.pbo_sobre_p95`) siguen en su estudio.
    # Lee el histórico entero (oos2 dentro): es del bloque ciego.
    cut: null
    segment: build+oos1+oos2
    rules: []
  "18.5":
    # De VUELTA (encargo 65 fila 8) sin su lectura previa build+oos1: `blind.skipped` salta la madre
    # cuyo `descuadre_sqx` (wfc.json) no es < `wfc.sqx_gap_relative`, o no existe; sin hecho,
    # `missing: limbo` la deja en LIMBO, nunca corta.
    # Paso 18.5 — superficies por mercado (propuesta criterios-implementados-2026-10-12, §5 y §9;
    # dueño, 2026-10-07). El paso se parte: la lectura que decide (build+oos1) se corre y se
    # juzga tras el 16.5, ANTES del bloque ciego; dentro del bloque se relee con oos2 y se
    # vuelve a juzgar al cierre, y oos2 sólo puede añadir LIMBO. `orden.estado` es un NÚMERO:
    # positivo = 1, neutro = 0, perverso = -1 (sin_dato = hecho ausente = LIMBO). Orden perverso
    # = NO PASA; prima del 20 % mejor <= p5 de su nulo = LIMBO; orden perverso en oos2 = LIMBO,
    # y ausente (antes del bloque ciego) no cuenta. `cut: null`: anota y juzga, no borra.
    cut: null
    segment: build+oos1
    rules:
      - {name: "Superficies · el orden entre mercados no es perverso",
         fact: marketSurfaces.orden.estado, pass: ">= 0", missing: limbo}
      - {name: "Superficies · la prima del 20 % mejor no cae bajo el p5 de su nulo",
         fact: marketSurfaces.prima.bajo_p5, pass: "< 1", else: limbo, missing: limbo}
      - {name: "Superficies · el orden en oos2 no es perverso (bloque ciego)",
         fact: marketSurfaces.oos2.perverso, pass: "< 1", else: limbo, missing: pass}
      - {name: "Superficies · oos2 se pudo leer (bloque ciego; dueño, 2026-10-08)",
         fact: marketSurfaces.oos2.sin_dato, pass: "< 1", else: limbo, missing: pass}
  "19":
    # Paso 19 — Walk Forward Matrix (propuesta criterios-implementados-2026-10-12, §5; dueño, 2026-10-07).
    # L1, siempre: NO PASA si p- <= 0,05 (reoptimizada pierde en dato limpio más que el ruido);
    # LIMBO si la mediana del exceso en oos2 <= 0 sin esa significancia; PASA el resto. Las dos
    # reglas `wfm.reopt.*` sólo existen con `modo_real: reoptimizado` (dueño, 2026-10-07: por
    # defecto `fijo`): en modo fijo el estudio no emite esos hechos y `missing: pass` hace que
    # no cuenten; cuando existen sólo pueden dar LIMBO. `cut: null`: anota y juzga, no borra.
    cut: null
    segment: oos2
    rules:
      - {name: "WFM · L1 no pierde en oos2 más de lo que explica el ruido (p−)",
         fact: wfm.l1.p_menos, pass: "> 0.05", missing: limbo}
      - {name: "WFM · L1 gana en oos2 (mediana del exceso)",
         fact: wfm.l1.mediana_exceso, pass: "> 0", else: limbo, missing: limbo}
      - {name: "WFM · la celda que se va a operar gana (sólo reoptimizado)",
         fact: wfm.reopt.centro_exceso, pass: "> 0", else: limbo, missing: pass}
      - {name: "WFM · reoptimizar no empeora a congelar (sólo reoptimizado)",
         fact: wfm.reopt.l2_p_menos, pass: "> 0.05", else: limbo, missing: pass}
  "19.5":
    # Lectura única de oos2 (encargo 65 §6; dueño, 2026-10-12, D2): paso propio, 19.5, el ÚNICO que corta la cola. No
    # sustituye a nadie: el estudio es
    # `studies/optimisation/oos2Reading` (se firma como paso 19 ante `ledger.gate.seal`). Las
    # reglas de 17 y 19 siguen juzgando y esta CORTA además: sobrevive quien supera las tres.
    # Corta SÓLO por signo: `oos2Reading.z` es el exceso neto semanal de la madre sobre su mono con
    # horas, en desviaciones de su nulo de volteos centrados (100.000, una cola). Su nivel (z) sólo ordena
    # las medoides; la p y su error de simulación se publican, no cortan. Sin hecho (celda «solo vivo»,
    # no se lee) = LIMBO: nadie se corta sin lectura.
    cut: SPP OOS
    segment: oos2
    rules:
      - {name: "Lectura única de oos2 · el exceso neto sobre el mono con horas no es negativo",
         fact: oos2Reading.z, pass: "> 0", missing: limbo}
  "20":
    # Paso 20 — lectura conjunta ciega (dueño, 2026-10-11): corta lo que el estudio descarta.
    # `blindJoint.verdict_csv.drop` vale 1 cuando su verdict.csv dice DESCARTAR (lectura `fail`);
    # REVISAR (`watch`) y MANTENER no cortan: la superviviente sigue, marcada por el estudio.
    # Corta «SPP OOS», el mismo databank que el 16: el 21 sigue leyendo de ahí.
    cut: SPP OOS
    segment: oos2
    rules:
      - {name: "Lectura conjunta · el estudio no la descarta (REVISAR sigue)",
         fact: blindJoint.verdict_csv.drop, pass: "< 1", missing: limbo}
