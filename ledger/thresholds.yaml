      latencia o información del futuro. Sale del PDF del dueño (TRADE_LEVEL_TESTS §4)

  - key: parameterCloud.rank_high
    value: 0.95
    source: studies/optimisation/cloud/config.yaml#verdict.rank_high
    set_by: agente
    set_on: 2026-09-24
    why: por encima de esto la original es la cima de su vecindad; sólo se lee junto a plateau_low

