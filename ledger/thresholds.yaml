  - key: cscv.blocks
    value: 16
    source: studies/optimisation/cscv/config.yaml#cscv.blocks
    set_by: dueño
    set_on: 2026-09-30
    why: antes 12 (C(12,6) = 924 particiones); el dueño sube a 16 (C(16,8) = 12.870) en la
      pasada de feedback de UI del 2026-09-30 (FEEDBACK §8.4)

