      PROVISIONAL hasta que el dueño lo fije

  # ── Paso 8 y paso 25 · edge por coste (encargo 11) ────────────────────────────────────
  - key: edgeCost.min_edge_spreads
    value: 2.0
    source: studies/readings/edgeCost/config.yaml#verdict.min_edge_spreads
    set_by: agente
    set_on: 2026-09-26
    why: >-
