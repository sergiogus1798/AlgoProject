      menos del 9 % de su varianza. Fijado antes de mirar ningún lote

  - key: marketSurfaces.j_quantile
    value: 0.975
    source: studies/optimisation/marketSurfaces/config.yaml#j_quantile
    set_by: agente
    set_on: 2026-09-26
    why: >-
      percentil del Jaccard de dos órdenes independientes (hipergeométrica) que el observado
      tiene que superar. Optimista: el diseño agrupa variantes y el nulo real es más ancho

  - key: marketSurfaces.min_share
    value: 0.5
