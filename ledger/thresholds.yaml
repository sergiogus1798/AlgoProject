# Los umbrales de la cadena, versionados. LOS MÓDULOS LOS LEEN; NINGUNO LOS ESCRIBE.
#
# Un umbral movido después de ver los resultados es la forma más barata de sobreajustar una
# cadena entera, y sin fecha no se distingue de uno fijado de antemano. Por eso cada fila
# lleva quién lo puso, cuándo y por qué.
#
# CÓMO LLEGA UN NÚMERO A SU MÓDULO. El `config.yaml` del módulo escribe `ledger:<key>` donde
# antes ponía el número, y su `config()` lo sustituye por el `value` de aquí al leer
# (`ledger.thresholds.fill`). Una clave ausente o repetida hace fallar la lectura. `source`
# apunta a ese hueco del `config.yaml`; una fila cuyo módulo aún guarda su propio número es una
# COPIA, y `python3 -m ledger.report --check-thresholds` dice de cada fila si se lee del ledger
# o es copia, y grita si una copia diverge. `tests/test_thresholds.py` prueba que un módulo
# migrado no lee el número de ningún otro sitio.

version: 2026-09-24

thresholds:
  # ── Paso 8 · la puerta OOS ────────────────────────────────────────────────────────────
  - key: gate.sanidad.min_trades
    value: 20
    source: studies/screening/gate/config.yaml#screens[name=sanidad].min_trades
    set_by: dueño
    set_on: 2026-09-23
    why: una estrategia con cuatro trades fuera de muestra no tiene error estándar que leer

  - key: gate.degradacion.min_retention
    value: 0.0
    source: studies/screening/gate/config.yaml#screens[name=degradacion].min_retention
    set_by: dueño
    set_on: 2026-09-23
    why: laxo a propósito — hoy sólo pide que la pendiente fuera de muestra sea positiva

  - key: gate.degradacion.max_concentration
    value: 1.0
    source: studies/screening/gate/config.yaml#screens[name=degradacion].max_concentration
    set_by: dueño
    set_on: 2026-09-23
    why: laxo a propósito; el suelo real lo pondrá el dueño cuando vea la distribución

  - key: gate.forma.max_dd_ratio
    value: 5.0
    source: studies/screening/gate/config.yaml#screens[name=forma].max_dd_ratio
    set_by: dueño
    set_on: 2026-09-23
    why: un múltiplo de 5 es casi no pedir nada

  - key: gate.mono.max_p
    value: 0.50
    source: studies/screening/gate/config.yaml#screens[name=mono].max_p
    set_by: dueño
    set_on: 2026-09-23
    why: la mediana del mono — hoy sólo pide estar en la mitad buena

  - key: gate.familia.alpha
    value: 0.05
    source: studies/screening/gate/config.yaml#screens[name=familia].alpha
    set_by: dueño
    set_on: 2026-09-23
    why: Benjamini-Hochberg sobre la familia superviviente; SOFT hasta que el dueño vea el exceso

  - key: snoopingScreen.stepm.fwer
    value: 0.05
    source: studies/screening/snoopingScreen/config.yaml#stepm.fwer
    set_by: dueño
    set_on: 2026-09-25
    why: probabilidad de nombrar al menos una que no bate al buy & hold a igual riesgo; anota, no corta

