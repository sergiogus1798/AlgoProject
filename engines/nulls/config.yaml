# Every tunable of the null study, in one place. Nothing below is hidden in code.
#
# There are no acceptance thresholds here and no verdict. This module reports p-values and
# the reasons to distrust them; which strategy to keep is the owner's call, made outside it.

nulls:
  draws: 2500                 # random runs per strategy and per rung; the smallest p
                              # observable is 1/(draws+1) = 4.0e-4, which is what a
                              # Benjamini-Hochberg over ~125 strategies needs to resolve
  seed: null                  # null = a fresh root drawn from OS entropy every run (owner,
                              # 2026-09-29: "no quiero una misma semilla, quiero un test del
                              # mono truly different"); `engines.nulls.inputs.config` draws it
                              # once per run and every caller records the root it drew. Set an
                              # explicit int here, or `--set nulls.seed=<int>`, to reproduce
                              # one run exactly
  chunk_trades: 200000       # trade valuations per seeded block. Sets the cache footprint
                             # (swept 2026-09-25: fastest at 130-220 k) AND the random
                             # streams: changing it changes every monkey
  rungs: [timing, timing_holds, timing_sizing, free]
  headline: timing            # the rung whose p the summary reports: it is the only one
                              # that changes exactly one thing, so it is the only one whose
                              # low p is attributable to the entry timing alone

barrier:
  atr_bars: 14                # lookback of the ATR the sizing rule and the barriers use
  max_hold: 400               # bars scanned ahead before the vertical barrier is forced.
                              # Only a ceiling on the scan: a real hold longer than this
                              # makes the module refuse rather than silently truncate
  intrabar: pessimistic       # which barrier wins when one bar's range touches both.
                              # "pessimistic" = the stop. Calibrated by calibrate.convention()
                              # against SQX's own P/L; with no barriers it cannot be read

statistics:                   # reported for the real run and every null run, each with the
                              # side that counts as good. The choice of statistic moves the
                              # verdict more than the choice of null does -- measured
                              # 2026-09-22: 51.0% of strategies beat the null on sharpe and
                              # 21.5% on net, from the same simulation.
  report: [net, sharpe, pf, retdd, dd]

verdict:
  alpha: 0.05                 # one-sided, applied to the empirical p
  min_trades: 30              # fewer than this and the p is not computed at all
