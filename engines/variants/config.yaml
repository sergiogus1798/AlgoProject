# The knobs of reading a retested variant batch that the WFC and the CSCV must share: the
# rho and the PBO are two statements about one set of points, so which points and which
# split cannot live in two files that may drift. Each study loads this beside its own.

# ⚠️ Este suelo es EL SEGUNDO, y actúa sobre lo que ya sobrevivió al primero. El duro está
# en `wfc.min_trades_total` de `assets/_build.yaml`: 50 operaciones en TOTAL sobre
# build+oos1+oos2, por variante y por mercado, y lo que no llega no entra en
# `metrics.parquet` — o sea que no llega aquí siquiera (dueño, 2026-09-24).
#
# Éste mira cada LADO de la partición por separado: una variante puede sumar 200
# operaciones y llevar sólo 4 en el tramo que hace de fuera de muestra, y entonces su punto
# mide cuatro operaciones por mucho que el total sea sano. 30 es el suelo que usa el propio
# SQX en sus condiciones de aceptación para una muestra de esta longitud.
#
# ⚠️ Ojo con `split_mode: oos2_only`: ahí el lado fuera de muestra es sólo `oos2`, 3,7 años,
# y pedirle 30 operaciones es bastante más duro que pedírselas a los 10 años de `build`.
# El informe dice cuántos puntos cayó cada suelo; si el segundo se come el lote, bájalo
# aquí y no toques el duro.
min_trades: 30

# ─── Las dos lecturas de un mismo lote ────────────────────────────────────────────────
# Decisión del dueño, 2026-09-24, y es exactamente la razón de tener `oos2` en un pedestal:
# el mismo lote retesteado una vez se puede leer de dos maneras, y las dos son legítimas.
#
#   oos1_oos2   IS = build,        OOS = oos1 + oos2   la pregunta normal: ¿lo que se
#                                                       construyó predice todo lo que vino
#                                                       después?
#   oos2_only   IS = build + oos1, OOS = oos2          la estricta: dando por vistos los
#                                                       dos primeros tramos, ¿sigue
#                                                       apareciendo en el que no ha mirado
#                                                       nadie? Es la que gasta el reservado.
#
# Cambiar esto NO re-corre ningún backtest: `sqx.variants.collect` deja las columnas de los
# dos en `metrics.parquet`. `report.py --split <modo>` lo pisa para una ejecución suelta.
#
# ⚠️ El CSCV no cambia con esto, y está comprobado leyendo el código: `cscv.run` parte la
# historia de sus 924 maneras y no mira la frontera declarada, así que el PBO es el MISMO
# número en los dos modos. Lo que sí se mueve son los cuatro números cronológicos que van
# al lado en el mismo informe: el coste de cada regla de selección, el Sharpe desinflado,
# el número de pruebas independientes y el drift.
split_mode: oos2_only
