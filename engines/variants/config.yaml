# The knobs of reading a retested variant batch that more than one study shares: only the
# `panel` section at the bottom is read today (by the WFC and the market surfaces; the CSCV has
# its own `panel` in its config.yaml). `min_trades` and `split_mode` were the CSCV's and the
# old WFC's; since the redesign of 2026-10-07 NO study reads them — they stay, and are still
# loaded into those studies' config and its fingerprint, until the owner says to delete them.

# ⚠️ Este suelo es EL SEGUNDO, y actúa sobre lo que ya sobrevivió al primero. El duro está
# en `wfc.min_trades_total` de `assets/_build.yaml`: 50 operaciones en TOTAL sobre
# build+oos1+oos2, por variante y por mercado, y lo que no llega no entra en
# `metrics.parquet` — o sea que no llega aquí siquiera (dueño, 2026-09-24).
#
# Éste mira cada LADO de la partición por separado: una variante puede sumar 200
# operaciones y llevar sólo 4 en el tramo que hace de fuera de muestra, y entonces su punto
# mide cuatro operaciones por mucho que el total sea sano. 30 es el suelo que usa el propio
# SQX en sus condiciones de aceptación para una muestra de esta longitud.
#
# ⚠️ Ojo con `split_mode: oos2_only`: ahí el lado fuera de muestra es sólo `oos2`, 3,7 años,
# y pedirle 30 operaciones es bastante más duro que pedírselas a los 10 años de `build`.
# El informe dice cuántos puntos cayó cada suelo; si el segundo se come el lote, bájalo
# aquí y no toques el duro.
min_trades: 50

# ─── La composición del corte ─────────────────────────────────────────────────────────
# Dueño, 2026-09-27 (encargo 24, Q11): `build` va SIEMPRE dentro de muestra; dentro es
# `build` o `build+oos1`; fuera es lo que queda, y `oos1` puede quedarse fuera de las dos.
# Las cuatro composiciones admitidas, y las dos que tienen nombre desde el 2026-09-24:
#
#   IS build        OOS oos1          (ya no la lee el WFC)
#   IS build        OOS oos2          (oos1 apagado)
#   IS build        OOS oos1 + oos2   = oos1_oos2   la pregunta normal: ¿lo construido
#                                                   predice todo lo que vino después?
#   IS build + oos1 OOS oos2          = oos2_only   la estricta: dando por vistos los dos
#                                                   primeros tramos, ¿sigue apareciendo en el
#                                                   que no ha mirado nadie?
#
# Aquí sólo cabe un nombre. Desde el rediseño del 2026-10-07 (pasos 17 y 18) NO lo lee ningún
# estudio: el CSCV lee la historia entera y el WFC ya no elige composición, mide siempre las tres de `panel.KEYS` (c1 decide, c2 y c3 se
# anotan) en un solo `estudios/wfc.*` y no tiene `--inside/--outside/--split`. Ninguna vuelve
# a hacer un backtest: `sqx.variants.collect` deja en `metrics.parquet` las columnas de todas.
# Una que toque `oos2` pasa antes por la puerta (`ledger.gate.allow`) y por el sello
# (`ledger.gate.seal`).
#
# ⚠️ El CSCV nunca cambió con esto: parte el historial en 16 bloques y lee sus 12.870
# particiones (C(16,8)), siempre build+oos1+oos2. Los cuatro números cronológicos que antes
# se leían en este nombre (coste de cada regla, Sharpe desinflado, pruebas independientes,
# drift) ya no existen en el informe.
split_mode: oos2_only

# ─── Los filtros del panel (encargo 48, parte P; propuesta del 17 §2) ──────────────────────
# Cada número es una fila de `ledger/thresholds.yaml` (dueño, 2026-10-07). Sección propia
# (`panel`) para que `studies/optimisation/wfc/config.yaml` no la pise al mezclarse.
panel:
  floor_is_per_param: ledger:wfc.floor_is_per_param    # operaciones dentro por parámetro vivo
  floor_oos_per_year: ledger:wfc.floor_oos_per_year    # operaciones fuera por año de la ventana
  min_variants: ledger:wfc.min_variants                # por debajo, «sin dato»
