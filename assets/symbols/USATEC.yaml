# USATEC — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: USATEC
class: no_forex
broker: Infinox
sqx_symbol: USATEC_DukasM1_Infinox
feeds:
  - USATEC_DukasM1_Infinox
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: US100.cash_ftmo  # FTMO nombra los indices distinto que el simbolo del feed

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.01
  point_value: 1            # $ por 1.0 de precio y 1.0 de lote
  min_distance: 0

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread_is:
    use: 69.7                 # points — tramo `build`
    sqx_now: 85               # points, el unico que hay hoy
    why: "2026-09-27 — opción A del dueño: spread proporcional al precio (modelo `relativo`: el spread medio en % del precio de los días Darwinex × el precio Dukascopy de cada día del build; medido donde hay ticks, 20 % del tramo). Media del tramo 55.7 puntos × factor 1.25 (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27."
  spread_oos:
    use: 104.4                # points — tramo `oos1` (oos2 lleva `spread_oos2`)
    sqx_now: 85               # points, el unico que hay hoy
    why: "2026-09-27 — media del spread medio diario de Darwinex (USATEC_DarwTick_Infinox) en oos1, 2020-01-02 a 2023-12-29 (1034 días), 83.6 puntos × factor 1.25 del dueño (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27."
  spread_oos2:
    use: 114.9
    sqx_now: null
    why: 2026-09-27 — media del spread medio diario de Darwinex (USATEC_DarwTick_Infinox) en oos2, 2024-01-02 a 2026-08-31 (687 días), 91.9 puntos × factor 1.25 del dueño (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27.
  commission:
    use: 0.0                  # % del nocional
    sqx_now: {method: SizeBased, value: 1}   # $ por lote — HAY QUE PASARLO A %
    why: "2026-09-27 — decisión del dueño: los índices en la cuenta raw no pagan comisión."
  slippage_is:
    use: 34.9                 # points — tramo(s) build
    sqx_now: 0.0
    why: "2026-09-27 — la mitad del spread de su tramo (69.7), default del dueño."
  slippage_oos:
    use: 52.2                 # points — tramo oos1 (oos2 lleva `slippage_oos2`)
    sqx_now: 0.0
    why: "2026-09-27 — la mitad del spread de su tramo (104.4), default del dueño."
  slippage_oos2:
    use: 57.5
    sqx_now: null
    why: 2026-09-27 — la mitad del spread de su tramo (114.9), default del dueño.
  swap_long:
    use: -8.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: money, value: -6.18}
    why: "2026-09-27 — decisión del dueño: -8 % anual aproximado, el mismo en largo y en corto (ambos lados pagan). Valor por defecto: el swap real cambia con los tipos y no hay histórico."
  swap_short:
    use: -8.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: money, value: 1.2}
    why: "2026-09-27 — decisión del dueño: -8 % anual aproximado, el mismo en largo y en corto (ambos lados pagan). Valor por defecto: el swap real cambia con los tipos y no hay histórico."

notes:
  - "USATEC is the Nasdaq 100 (US Tech index) at Infinox. The owner said the Nasdaq should use 80 points of spread rather than 40, but what SQX actually carries here is 85 and the 40 belongs to USA500. Confirm which instrument and which number before filling `use`, rather than assuming either."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
# ⚠️ PISA el bloque `swap` de `../_policy.yaml` ENTERO, no campo a campo: `load()` fusiona con
# {**politica, **activo}, por eso `rollout_hour` se repite aunque no cambie. La politica fija
# WEDNESDAY para los diecinueve; este feed lleva FRIDAY en el <Swap tripleSwapOn> del maestro, y
# sin este bloque el coste de financiacion triple caia la noche equivocada. Leido 2026-09-23.
swap:
  triple_swap_on: FRIDAY
  rollout_hour: "23:00"

mc_retest:
  spread:
    min: 30.1
    max: 281.3
    sqx_now: {min: 1, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados
  slippage:
    min: null
    max: null
    sqx_now: {min: 0, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - AUDJPY
  - EURUSD
  - USDJPY
  - XAUUSD
