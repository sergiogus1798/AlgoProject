  spread_is:
    use: 145.32               # points — tramo `build`
    sqx_now: 100              # el maestro no configura este feed hoy
    why: "onboard 2026-09-30 — spread medio de Darwinex del tramo × factor 1.25, modelo `relativo` donde no hay ticks (DAX40_TICK). studies.data.spread.onboard"
