# NIKKEI225 — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: NIKKEI225
class: no_forex
broker: Infinox
sqx_symbol: NIKKEI225_DukasM1_Infinox
feeds:
  - NIKKEI225_DukasM1_Infinox
  - NIKKEI225_DarwTick_Infinox
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: JP225.cash_ftmo  # FTMO nombra los indices distinto que el simbolo del feed

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.01
  point_value: 0.64935      # $ por 1.0 de precio y 1.0 de lote
  min_distance: 0

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread_is:
    use: 606.7                # points — tramo `build`
    sqx_now: 1100             # points, el unico que hay hoy
    why: "2026-09-27 — opción A del dueño: spread proporcional al precio (modelo `relativo`: el spread medio en % del precio de los días Darwinex × el precio Dukascopy de cada día del build; medido donde hay ticks, 29 % del tramo). Media del tramo 485.3 puntos × factor 1.25 (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27."
  spread_oos:
    use: 915.5                # points — tramo `oos1` (oos2 lleva `spread_oos2`)
    sqx_now: 1100             # points, el unico que hay hoy
    why: "2026-09-27 — media del spread medio diario de Darwinex (NIKKEI225_DarwTick_Infinox) en oos1, 2020-01-02 a 2023-12-29 (1034 días), 732.4 puntos × factor 1.25 del dueño (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27."
  spread_oos2:
    use: 559.1
    sqx_now: null
    why: 2026-09-27 — media del spread medio diario de Darwinex (NIKKEI225_DarwTick_Infinox) en oos2, 2024-01-02 a 2026-08-31 (687 días), 447.3 puntos × factor 1.25 del dueño (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27.
  commission:
    use: 0.0                  # % del nocional
    sqx_now: {method: SizeBased, value: 1}   # $ por lote — HAY QUE PASARLO A %
    why: "2026-09-27 — decisión del dueño: los índices en la cuenta raw no pagan comisión."
  slippage_is:
    use: 303.4               # points — tramo(s) build
    sqx_now: 0.0
    why: "2026-09-27 — la mitad del spread de su tramo (606.7), default del dueño."
  slippage_oos:
    use: 457.8               # points — tramo oos1 (oos2 lleva `slippage_oos2`)
    sqx_now: 0.0
    why: "2026-09-27 — la mitad del spread de su tramo (915.5), default del dueño."
  slippage_oos2:
    use: 279.6
    sqx_now: null
    why: 2026-09-27 — la mitad del spread de su tramo (559.1), default del dueño.
  swap_long:
    use: -8.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: money, value: -2.454}
    why: "2026-09-27 — decisión del dueño: -8 % anual aproximado, el mismo en largo y en corto (ambos lados pagan). Valor por defecto: el swap real cambia con los tipos y no hay histórico."
  swap_short:
    use: -8.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: money, value: 1.338}
    why: "2026-09-27 — decisión del dueño: -8 % anual aproximado, el mismo en largo y en corto (ambos lados pagan). Valor por defecto: el swap real cambia con los tipos y no hay histórico."

notes: []

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
# ⚠️ PISA el bloque `swap` de `../_policy.yaml` ENTERO, no campo a campo: `load()` fusiona con
# {**politica, **activo}, por eso `rollout_hour` se repite aunque no cambie. La politica fija
# WEDNESDAY para los diecinueve; este feed lleva FRIDAY en el <Swap tripleSwapOn> del maestro, y
# sin este bloque el coste de financiacion triple caia la noche equivocada. Leido 2026-09-23.
swap:
  triple_swap_on: FRIDAY
  rollout_hour: "23:00"

mc_retest:
  spread:
    min: 165.5
    max: 1206.6
    sqx_now: [{min: 1, max: 5}, {min: 80, max: 200}, {min: 120, max: 400}]   # varias tareas, rangos distintos
  slippage:
    min: null
    max: null
    sqx_now: [{min: 0, max: 5}, {min: 100, max: 300}, {min: 100, max: 400}]   # varias tareas, rangos distintos

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - SP500_H1
