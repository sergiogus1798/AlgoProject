  spread_is:
    use: 606.66               # points — tramo `build`
    sqx_now: 1100             # points, el unico que hay hoy
    why: "onboard 2026-09-30 — spread medio de Darwinex del tramo × factor 1.25, modelo `relativo` donde no hay ticks (NIKKEI225_TICK). studies.data.spread.onboard"
