# USA500 — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: USA500
class: no_forex
broker: Infinox
sqx_symbol: USA500_DukasM1_Infinox
feeds:
  - USA500_DukasM1_Infinox
  - USA500_DarwTick_Infinox
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: US500.cash_ftmo  # FTMO nombra los indices distinto que el simbolo del feed

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.01
  point_value: 10           # $ por 1.0 de precio y 1.0 de lote
  min_distance: 0

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread_is:
    use: 33.6                 # points — tramo `build`
    sqx_now: 40               # points, el unico que hay hoy
    why: "2026-09-27 — opción A del dueño: spread proporcional al precio (modelo `relativo`: el spread medio en % del precio de los días Darwinex × el precio Dukascopy de cada día del build; medido donde hay ticks, 20 % del tramo). Media del tramo 26.9 puntos × factor 1.25 (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27."
  spread_oos:
    use: 42.8                 # points — tramo `oos1` (oos2 lleva `spread_oos2`)
    sqx_now: 40               # points, el unico que hay hoy
    why: "2026-09-27 — media del spread medio diario de Darwinex (USA500_DarwTick_Infinox) en oos1, 2020-01-02 a 2023-12-29 (1034 días), 34.2 puntos × factor 1.25 del dueño (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27."
  spread_oos2:
    use: 49.7
    sqx_now: null
    why: 2026-09-27 — media del spread medio diario de Darwinex (USA500_DarwTick_Infinox) en oos2, 2024-01-02 a 2026-08-31 (687 días), 39.8 puntos × factor 1.25 del dueño (ledger spread.safety.factor). studies.data.spread, docs/AgentPDFs/spread-real-2026-09-27.
  commission:
    use: 0.0                  # % del nocional
    sqx_now: {method: SizeBased, value: 1}   # $ por lote — HAY QUE PASARLO A %
    why: "2026-09-29 — most_restrictive de los brokers confirmados (owner, 2026-09-29): FTMO es el único confirmado (comisión cero explícita en todos los símbolos de índice) a falta de cifra propia de Darwinex/Infinox/Hantec/the5ers/FundedNext/FundingPips en índices; se mantiene en 0, como ya llevaba, pero ahora respaldado por una fuente y no por \"usar el default de SQX\". Si algún bróker confirma una comisión > 0 en índices, este valor sube. `core.commission.most_restrictive` + `use_value`."
    brokers:
      ftmo:
        method: SizeBased
        value: 0.0
        unit: usd_per_lot
        source: https://ftmo.com/en/blog/zero-commissions-on-indices/
        date: 2025-08-01 (publicado; comprobado 2026-09-29)
        confirmed: true
        note: '"this zero-commission advantage applies to all index symbols" — explícito, todos los índices'
      darwinex:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: página propia dice que "hay diferencias importantes" por activo mas no da cifra para índices; la tabla de spreads de índices no cargó en el fetch
      infinox:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: agregadores dan $2/lote en índices; sin página propia confirmable
      hantec:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: tabla propia sólo lista forex
      the5ers:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: agregadores dicen comisión cero en índices; sin cifra en página propia
      fundednext:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: página propia confirmada sólo detalla cripto/metales/acciones
      fundingpips:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: agregadores dicen comisión cero en índices; 403 en el fetch propio
  slippage_is:
    use: 16.8               # points — tramo(s) build
    sqx_now: 0.0
    why: "2026-09-27 — la mitad del spread de su tramo (33.6), default del dueño."
  slippage_oos:
    use: 21.4               # points — tramo oos1 (oos2 lleva `slippage_oos2`)
    sqx_now: 0.0
    why: "2026-09-27 — la mitad del spread de su tramo (42.8), default del dueño."
  slippage_oos2:
    use: 24.9
    sqx_now: null
    why: 2026-09-27 — la mitad del spread de su tramo (49.7), default del dueño.
  swap_long:
    use: -8.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: money, value: -15.317}
    why: "2026-09-27 — decisión del dueño: -8 % anual aproximado, el mismo en largo y en corto (ambos lados pagan). Valor por defecto: el swap real cambia con los tipos y no hay histórico."
  swap_short:
    use: -8.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: money, value: 3.17}
    why: "2026-09-27 — decisión del dueño: -8 % anual aproximado, el mismo en largo y en corto (ambos lados pagan). Valor por defecto: el swap real cambia con los tipos y no hay histórico."

notes:
  - "SQX carries 40 points of spread here. If the owner's '80 rather than 40' remark was about this instrument and not the Nasdaq, this is the file to change. Ask before assuming."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
# ⚠️ PISA el bloque `swap` de `../_policy.yaml` ENTERO, no campo a campo: `load()` fusiona con
# {**politica, **activo}, por eso `rollout_hour` se repite aunque no cambie. La politica fija
# WEDNESDAY para los diecinueve; este feed lleva FRIDAY en el <Swap tripleSwapOn> del maestro, y
# sin este bloque el coste de financiacion triple caia la noche equivocada. Leido 2026-09-23.
swap:
  triple_swap_on: FRIDAY
  rollout_hour: "23:00"

mc_retest:
  spread:
    min: 14.4
    max: 84.1
    sqx_now: {min: 1, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados
  slippage:
    min: null
    max: null
    sqx_now: {min: 0, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - SP500_H1
