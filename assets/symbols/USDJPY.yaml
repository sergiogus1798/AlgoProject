# USDJPY — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: USDJPY
class: forex
broker: the5ers
sqx_symbol: USDJPY_DukasM1_the5ers
feeds:
  - USDJPY_DukasM1_the5ers
  - USDJPY_DarwTick_the5ers
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: USDJPY_ftmo

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.01
  point_value: 653.919594   # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread:
    use: 0.1                 # points
    sqx_now: 0.1              # points
    why: "PROVISIONAL 2026-09-23 — `defaultSpread` que el maestro lleva HOY, leido de los project.cfx con `sqx.inspect.instruments`. NO es una cifra pactada con the5ers: es el default de fabrica de SQX, y su ordenacion relativa entre pares no es creible (CADJPY 0.1 contra GBPJPY 1.2 con el mismo point_value; CADJPY seis veces mas barato que EURJPY siendo menos liquido). Sirve para montar la cadena y medir la correlacion entre mercados, que apenas depende del nivel de coste; NO sirve para juzgar si un edge es real."
  commission:
    use: 0.0                 # $ por lote
    sqx_now: {method: SizeBased, value: 0.00}   # $ por lote
    why: "PROVISIONAL 2026-09-23 — `SizeBased 0.00` es lo que el maestro lleva hoy: comision CERO en los diez pares. the5ers cobra del orden de 8 $/lote round-turn, que en un par con point_value 100000 equivalen a 0.8 pips. Con este valor el coste modelado infravalora el real unas 10 veces. Se escribe para desbloquear la autoria (regla dura 5), no porque sea creible."
  slippage_is:
    use: 0.05                 # points — tramo(s) build
    sqx_now: 0.0
    why: "PROVISIONAL 2026-09-23 — la mitad del spread de su tramo, convencion elegida por el dueno. No es una medicion: SQX lleva defaultSlippage 0.0 en los 17 y un backtest no devuelve slippage, aplica el que se le da."
  slippage_oos:
    use: 0.05                 # points — tramo(s) oos1 y oos2
    sqx_now: 0.0
    why: "PROVISIONAL 2026-09-23 — la mitad del spread de su tramo, convencion elegida por el dueno. No es una medicion: SQX lleva defaultSlippage 0.0 en los 17 y un backtest no devuelve slippage, aplica el que se le da."
  swap_long:
    use: 0.0                 # points por noche
    sqx_now: {type: points, value: 0}
    why: "PROVISIONAL 2026-09-23 — `<Swap use=true type=points>` del maestro, leido de los project.cfx. No pactado con the5ers. Rollout 23:00, triple swap el miercoles. Mismo valor en todos los proyectos que tocan el par, sin conflictos."
  swap_short:
    use: -10.4                 # points por noche
    sqx_now: {type: points, value: -10.4}
    why: "PROVISIONAL 2026-09-23 — `<Swap use=true type=points>` del maestro, leido de los project.cfx. No pactado con the5ers. Rollout 23:00, triple swap el miercoles. Mismo valor en todos los proyectos que tocan el par, sin conflictos."

notes:
  - "2026-09-23: spread, commission y los dos swap rellenados con lo que el MAESTRO lleva hoy
     (leido de los project.cfx con `sqx.inspect.instruments`), para desbloquear la regla dura 5
     sin esperar a las cifras de the5ers. Son defaults de fabrica de SQX, comision CERO incluida:
     el coste modelado infravalora el real ~10x y su ordenacion entre pares no es creible. Todo
     resultado con coste producido antes de que el dueno los sustituya arrastra esa advertencia."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
mc_retest:
  spread:
    min: null
    max: null
    sqx_now: {min: 1, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados
  slippage:
    min: null
    max: null
    sqx_now: {min: 0, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - USDJPY
