# USDJPY — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: USDJPY
class: forex
broker: the5ers
sqx_symbol: USDJPY_DukasM1_the5ers
feeds:
  - USDJPY_DukasM1_the5ers
  - USDJPY_DarwTick_the5ers
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: USDJPY_ftmo

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.01
  point_value: 653.919594   # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread:
    use: 0.65                # points
    sqx_now: 0.1              # points
    why: "onboard 2026-09-27 — spread medio de Darwinex del tramo × factor 1.25, modelo `volatilidad_precio` donde no hay ticks (USDJPY_DarwTick_the5ers). studies.data.spread.onboard"
  commission:
    use: 8.0                 # $ por lote
    sqx_now: {method: SizeBased, value: 0.00}   # $ por lote
    why: "2026-09-29 — se mantiene 8 USD por lote ida y vuelta, decisión del dueño del 2026-09-27 (cuenta raw Infinox). La regla de desarrollo es la comisión MÁS cara de todos los brokers (dueño, 2026-09-29); los 8 USD de Infinox cuentan aunque su web no se haya podido leer, porque es la cifra real de su cuenta. Los brokers confirmados en su web (Hantec 5, the5ers 4, Darwinex ≈3,3-4,9) cobran menos, así que no bajan el default. SizeBased cobra una vez por operación."
    brokers:
      darwinex:
        method: PercentageBased
        value: 0.005
        unit: pct_of_notional
        source: https://help.darwinex.com/execution-costs
        date: '2026-09-29'
        confirmed: true
        note: '"Forex & Commodities", 0.005 % del nocional ida y vuelta.'
      the5ers:
        method: SizeBased
        value: 4.0
        unit: usd_per_lot
        source: https://the5ers.com/asset-specifications/
        date: '2026-09-29'
        confirmed: true
        note: ''
      hantec:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: https://htrader.hmarkets.com/product-specifications/
        date: '2026-09-29'
        confirmed: true
        note: ''
      ftmo:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: agregadores dan $3-5/lote; ftmo.com/en/symbols no renderizó la tabla
      infinox:
        method: SizeBased
        value: 8.0
        unit: usd_per_lot
        source: decisión del dueño 2026-09-27 (cuenta raw, 8 USD por lote ida y vuelta)
        date: '2026-09-27'
        confirmed: true
      fundednext:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: no cubre forex en la página propia confirmada
      fundingpips:
        method: null
        value: null
        unit: null
        source: null
        date: '2026-09-29'
        confirmed: false
        note: help.fundingpips.com devolvió 403
  slippage_is:
    use: 0.325                # points — tramo(s) build
    sqx_now: 0.0
    why: "onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño."
  slippage_oos:
    use: 0.325                # points — tramo(s) oos1 y oos2
    sqx_now: 0.0
    why: "onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño."
  swap_long:
    use: 11.6                # points por noche
    sqx_now: {type: points, value: 0}
    why: "2026-09-27 — decisión del dueño: media del swap en puntos por noche de las 8 variantes de USDJPY con swap activo en el registro de instrumentos de SQX (dukascopy, ftmo, roboforex, the5ers, icmarkets, pepperstone, darwinex, Infinox); mediana 11.53. Fuera: USDJPY_monevis(off), USDJPY.pro_oanda(percent) (desactivado o en %). Antes 0.0 (the5ers). Valor por defecto: el swap real cambia con los tipos."
  swap_short:
    use: -25.13                # points por noche
    sqx_now: {type: points, value: -10.4}
    why: "2026-09-27 — decisión del dueño: media del swap en puntos por noche de las 8 variantes de USDJPY con swap activo en el registro de instrumentos de SQX (dukascopy, ftmo, roboforex, the5ers, icmarkets, pepperstone, darwinex, Infinox); mediana -25.92. Fuera: USDJPY_monevis(off), USDJPY.pro_oanda(percent) (desactivado o en %). Antes -10.4 (the5ers). Valor por defecto: el swap real cambia con los tipos."

notes:
  - "2026-09-23: spread, commission y los dos swap rellenados con lo que el MAESTRO lleva hoy (leido de los project.cfx con `sqx.inspect.instruments`), para desbloquear la regla dura 5 sin esperar a las cifras de the5ers. Son defaults de fabrica de SQX, comision CERO incluida: el coste modelado infravalora el real ~10x y su ordenacion entre pares no es creible. Todo resultado con coste producido antes de que el dueno los sustituya arrastra esa advertencia."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
mc_retest:
  spread:
    min: 0.42
    max: 0.95
    sqx_now: {min: 1, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados
  slippage:
    min: null
    max: null
    sqx_now: {min: 0, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - USDJPY
