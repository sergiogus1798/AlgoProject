# UKOIL — Brent, con el nombre de FTMO en MT5 (UKOIL.cash). Hasta el 2026-10-01 se llamaba BRENT.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
#
# Sesión: `UKOIL.cash_ftmo`, decisión del dueño, 2026-10-02 (la de FTMO para todos los activos);
# hasta entonces iba a null porque sólo era mercado de cross-check de XAUUSD. Como mercado extra
# nada cambia: su <Setup> lleva `session="No Session"` y hereda la del test principal; la sesión
# de esta ficha rige cuando se construye SOBRE brent.
