# UKOIL — Brent, con el nombre de FTMO en MT5 (UKOIL.cash). Hasta el 2026-10-01 se llamaba BRENT.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
#
# ESTE ACTIVO EXISTE HOY SÓLO COMO MERCADO DE CROSS-CHECK DE XAUUSD, no como activo main.
# `session: null` a propósito: el <Setup> del mercado extra lleva `session="No Session"` y
# hereda la del test principal. Construir SOBRE brent exigiría decidir su sesión primero.
