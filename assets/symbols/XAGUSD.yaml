# XAGUSD — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
#
# ESTE ACTIVO EXISTE HOY SÓLO COMO MERCADO DE CROSS-CHECK DE XAUUSD, no como activo main.
# Por eso `session` va a null: `sqx.projects.crossmarket` escribe `session="No Session"` en el
# <Setup> del mercado extra y hereda la del test principal (`MainTestValues session="true"`).
# Si algún día se construye SOBRE plata, hay que decidir su sesión antes: `session: null`
# bloquea la autoría de un proyecto main, y eso es lo correcto.
symbol: XAGUSD
class: no_forex
broker: Infinox
sqx_symbol: XAGUSD_DukasM1_Infinox
feeds:
  - XAGUSD_DukasM1_Infinox
  - XAGUSD_DarwTick_Infinox
verified: 2026-09-23

session: null

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.001
  point_value: 5000            # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10             # SQX lleva minDistance 0.0; el <Setup> del cross-check escribe 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread_is:
    use: 11.0                # points — tramo `build`
    sqx_now: 22.0            # points, el unico que hay hoy
    why: "PROVISIONAL 2026-09-23 — la mitad del defaultSpread de SQX, por el precedente de XAUUSD (SQX lleva 10 y el fichero declara is 5 / oos 10). NO es una cifra pactada con Infinox."
  spread_oos:
    use: 22.0                # points — tramos `oos1` y `oos2`
    sqx_now: 22.0            # points, el unico que hay hoy
    why: "PROVISIONAL 2026-09-23 — el defaultSpread que el maestro lleva hoy, leido de los project.cfx con `sqx.inspect.instruments`. Default de fabrica de SQX, NO pactado con Infinox."
  commission:
    use:                     # método y valor del bróker ganador, POR TRAMO (mixto: SizeBased $/lote o PercentageBased %)
      build:
        method: PercentageBased
        value: 0.005
      oos1:
        method: PercentageBased
        value: 0.005
      oos2:
        method: PercentageBased
        value: 0.005
    sqx_now: {method: SizeBased, value: 8}   # $ por lote — HAY QUE PASARLO A %
    why: "2026-09-29 — el dueño corrige el reparto por tramo: en un activo no_forex con comisión confirmada TODO el workflow de SQX (build y cada retest — OOS, crossmarket, MC Retest, SPP, WFM, variantes...) usa la % de Darwinex, 0.005 % del nocional, en los tres tramos por igual. Ya no se elige el bróker más caro tramo a tramo (per_segment queda retirado de ese papel); Darwinex es la referencia del spread y la más citada en el árbol de costes, así que fija el desarrollo. Forex sigue en 5 USD/lote SizeBased en los tres tramos; índices en 0 %: ninguno de los dos cambia. core.commission.broker_pct sigue dando la % propia de cada bróker para el paso 26 y weeklyReconciler."
