# XAGUSD — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
#
# Sesión: `XAGUSD_ftmo`, decisión del dueño, 2026-10-02 («la session de ftmo para la XAG y que
# aplique al resto de activos»). Hasta entonces iba a null porque el activo sólo era mercado de
# cross-check de XAUUSD. Como mercado extra nada cambia: `sqx.projects.crossmarket` sigue
# escribiendo `session="No Session"` en su <Setup> y hereda la del test principal
# (`MainTestValues session="true"`); la sesión de esta ficha rige cuando se construye SOBRE plata.
symbol: XAGUSD
class: no_forex
broker: Infinox
sqx_symbol: XAGUSD_M1
feeds:
  - XAGUSD_M1
  - XAGUSD_TICK
verified: 2026-09-23

session: XAGUSD_ftmo

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.001
  point_value: 5000.0          # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10             # SQX lleva minDistance 0.0; el <Setup> del cross-check escribe 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread_is:
    use: 33.29               # points — tramo `build`
    sqx_now: 22.0            # points, el unico que hay hoy
    why: "recalibrado 2026-10-14 — 0.1593 % del precio medio del tramo `build` (20.9): spread medio por tiempo de FundingPips, la más ancha de FTMO/Hantec/FundingPips, media de 12 meses de sus ticks, sin factor. knowhow/costs/funded-tick-spread-vs-price.md"
  spread_oos:
    use: 31.61               # points — tramos `oos1` y `oos2`
    sqx_now: 22.0            # points, el unico que hay hoy
    why: "recalibrado 2026-10-14 — 0.1593 % del precio medio del tramo `oos1` (19.8): spread medio por tiempo de FundingPips, la más ancha de FTMO/Hantec/FundingPips, media de 12 meses de sus ticks, sin factor. knowhow/costs/funded-tick-spread-vs-price.md"
  spread_oos2:
    use: 62.21
    sqx_now: null
    why: 'recalibrado 2026-10-14 — 0.1593 % del precio medio del tramo `oos2` (39.1): spread medio por tiempo de FundingPips, la más ancha de FTMO/Hantec/FundingPips, media de 12 meses de sus ticks, sin factor. knowhow/costs/funded-tick-spread-vs-price.md'
  commission:
