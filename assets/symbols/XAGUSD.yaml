  - "2026-09-23: fichero creado para que XAUUSD pueda escribir su cross-check de mercados adicionales, que se negaba porque ningun fichero declaraba el feed XAGUSD_M1. Todos los costes salen de lo que el MAESTRO lleva hoy, con las conversiones de unidad que exige la clase no_forex (% del nocional y % anual) hechas al ultimo cierre real. No hay ninguna cifra pactada con Infinox. El swap y la comision se mueven ~5x segun el precio de referencia que se elija; esta escrito en cada `why:`."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. Sin decidir: este activo no es
# main y no corre MC Retest. Ver `../_policy.yaml`.
mc_retest:
  spread:
    min: 5.79
    max: 23.06
    sqx_now: {min: 1, max: 5}
  slippage:
    min: 2.9
    max: 11.53
    sqx_now: {min: 0, max: 5}

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - XAUUSD
mt5:
  ftmo: XAGUSD
  hantec: XAGUSD.h
# Punto de MT5 en cada empresa, leído de su servidor el 2026-10-01 (mt5.live 'symbol').
# Spread de MT5 × to_sqx = puntos de SQX (to_sqx = point ÷ instrument.tick_size).
# No es siempre ÷10: forex y yenes ÷10, oro e índices ×1, Brent en Hantec ×10.
mt5_point:
  ftmo: {point: 0.001, digits: 3, to_sqx: 1.0}
  hantec: {point: 0.001, digits: 3, to_sqx: 1.0}
