# XAGUSD — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
#
# ESTE ACTIVO EXISTE HOY SÓLO COMO MERCADO DE CROSS-CHECK DE XAUUSD, no como activo main.
# Por eso `session` va a null: `sqx.projects.crossmarket` escribe `session="No Session"` en el
# <Setup> del mercado extra y hereda la del test principal (`MainTestValues session="true"`).
# Si algún día se construye SOBRE plata, hay que decidir su sesión antes: `session: null`
# bloquea la autoría de un proyecto main, y eso es lo correcto.
symbol: XAGUSD
class: no_forex
broker: Infinox
sqx_symbol: XAGUSD_M1
feeds:
  - XAGUSD_M1
  - XAGUSD_TICK
verified: 2026-09-23

session: null

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.001
  point_value: 5000.0          # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10             # SQX lleva minDistance 0.0; el <Setup> del cross-check escribe 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
