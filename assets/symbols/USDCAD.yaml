# USDCAD — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: USDCAD
class: forex
broker: the5ers
sqx_symbol: USDCAD_DukasM1_the5ers
feeds:
  - USDCAD_DukasM1_the5ers
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: USDCAD_ftmo

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.0001
  point_value: 71828.244302 # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread:
    use: 1.0                 # points
    sqx_now: 0.2              # points
    why: "onboard 2026-09-27 — spread medio de Darwinex del tramo × factor 1.25, modelo `relativo` donde no hay ticks (USDCAD_DarwTick_the5ers). studies.data.spread.onboard"
  commission:
    use:                     # $ por lote
      build:
        method: SizeBased
        value: 5.0
      oos1:
        method: SizeBased
        value: 5.0
      oos2:
        method: SizeBased
        value: 5.0
    sqx_now: {method: SizeBased, value: 0.00}   # $ por lote
    why: "2026-09-29 — el dueño fija 5 USD/lote ida y vuelta como la comisión de TODOS los brokers de este par (baja el default anterior de 8, la cifra de Infinox): \"cada bróker cobra 5 USD/lote\", y ésa es también la cifra de desarrollo/test. Sustituye las cifras propias medidas antes (the5ers 4, Hantec 5, Infinox 8) por la decisión directa del dueño; el máximo de todos sigue siendo 5, así que build, oos1 y oos2 llevan la misma pareja método/valor. `core.commission.per_segment`."
    brokers:
      darwinex:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
      the5ers:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
      hantec:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
      ftmo:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
      infinox:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
      fundednext:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
      fundingpips:
        method: SizeBased
        value: 5.0
        unit: usd_per_lot
        source: dueño, 2026-09-29
        date: '2026-09-29'
        confirmed: true
        note: cifra fija del dueño para todos los brokers de este par (encargo 2026-09-29), sustituye la cifra propia medida antes
  slippage_is:
    use: 0.5                 # points — tramo(s) build
    sqx_now: 0.0
    why: "onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño."
  slippage_oos:
    use: 0.5                 # points — tramo(s) oos1 y oos2
    sqx_now: 0.0
    why: "onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño."
  swap_long:
    use: 0.12                 # points por noche
    sqx_now: {type: points, value: 0.24}
    why: "2026-09-27 — decisión del dueño: media del swap en puntos por noche de las 7 variantes de USDCAD con swap activo en el registro de instrumentos de SQX (dukascopy, ftmo, roboforex, the5ers, icmarkets, pepperstone, darwinex); mediana -0.1. Fuera: USDCAD_monevis(off), USDCAD.pro_oanda(percent) (desactivado o en %). Antes 0.24 (the5ers). Valor por defecto: el swap real cambia con los tipos."
  swap_short:
    use: -6.12                 # points por noche
    sqx_now: {type: points, value: -3.82}
    why: "2026-09-27 — decisión del dueño: media del swap en puntos por noche de las 7 variantes de USDCAD con swap activo en el registro de instrumentos de SQX (dukascopy, ftmo, roboforex, the5ers, icmarkets, pepperstone, darwinex); mediana -5.57. Fuera: USDCAD_monevis(off), USDCAD.pro_oanda(percent) (desactivado o en %). Antes -3.82 (the5ers). Valor por defecto: el swap real cambia con los tipos."

notes:
  - "2026-09-23: spread, commission y los dos swap rellenados con lo que el MAESTRO lleva hoy (leido de los project.cfx con `sqx.inspect.instruments`), para desbloquear la regla dura 5 sin esperar a las cifras de the5ers. Son defaults de fabrica de SQX, comision CERO incluida: el coste modelado infravalora el real ~10x y su ordenacion entre pares no es creible. Todo resultado con coste producido antes de que el dueno los sustituya arrastra esa advertencia."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
mc_retest:
  spread:
    min: 0.71
    max: 1.44
    sqx_now: {min: 1, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados
  slippage:
    min: null
    max: null
    sqx_now: {min: 0, max: 5}   # el de fábrica de SQX, el mismo en todos los mercados

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - EURUSD
