    sqx_now: null
    why: 'recalibrado 2026-10-14 — 0.0139 % del precio medio del tramo `oos1` (147.3): spread medio por tiempo de FTMO, la más ancha de FTMO/Hantec/FundingPips, media de 12 meses de sus ticks, sin factor. knowhow/costs/funded-tick-spread-vs-price.md'
