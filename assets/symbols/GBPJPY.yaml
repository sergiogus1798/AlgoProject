  use: tick
  why: '2026-10-15, engines.market.rounding.measure after the half-up fix (OPEN #124), 18.5 variant batch of Trade_EURUSD_M30_reversionL_gorilla (20 variants, ~4,000 trades a segment): build tick 0 % vs none 0 %, oos1 tick 0 % vs none 85 %'
  measured: 2026-10-15
