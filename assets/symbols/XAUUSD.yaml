# XAUUSD — lo propio de este activo, y nada más.
#   · el esquema de sus costes, sus unidades y los ajustes de SQX → `../_classes.yaml`, clase `no_forex`
#   · los segmentos temporales y las convenciones de swap        → `../_policy.yaml`
#   · los mercados donde se retestea su edge                     → `../_markets.yaml`
symbol: XAUUSD
class: no_forex
broker: Infinox
sqx_symbol: XAUUSD_DukasM1_Infinox
feeds:
  - XAUUSD_DukasM1_Infinox
verified: 2026-09-03

# Sesión de negociación que SQX aplica a la tarea (`MarketOpenSession`). Tiene que ser la
# del activo que se construye: una tarea que nombra la sesión de otro mercado carga sin
# quejarse y opera horas que no son. `null` = sin decidir, y eso bloquea la autoría.
# Las sesiones se definen DENTRO del proyecto, en <Resources><Sessions>, así que una que
# el donante no lleve hay que darla de alta en SQX antes.
session: XAUUSD_ftmo

# Hechos del feed, leídos de SQX. No son decisiones y no se editan a mano:
# `python3 -m sqx.inspect.instruments` los vuelve a sacar del maestro.
instrument:
  tick_size: 0.01
  point_value: 100          # $ por 1.0 de precio y 1.0 de lote
  min_distance: 10

# Lo que se aplica. `use: null` = sin decidir, y eso BLOQUEA la autoría (regla dura 5).
# `sqx_now` es lo que el maestro lleva hoy — OJO, no siempre en la misma unidad que `use`.
costs:
  spread_is:
    use: 16.37               # points — tramo `build`
    sqx_now: 5               # points, el unico que hay hoy
    why: "onboard 2026-09-27 — spread medio de Darwinex del tramo × factor 1.25, modelo `volatilidad` donde no hay ticks (XAUUSD_DarwTick_Infinox). studies.data.spread.onboard"
  spread_oos:
    use: 22.54                # points — tramos `oos1` y `oos2`
    sqx_now: 10               # points, el unico que hay hoy
    why: "onboard 2026-09-27 — spread medio de Darwinex del tramo × factor 1.25, modelo `volatilidad` donde no hay ticks (XAUUSD_DarwTick_Infinox). studies.data.spread.onboard"
  spread_oos2:
    use: 37.49
    sqx_now: null
    why: onboard 2026-09-27 — spread medio de Darwinex del tramo × factor 1.25, modelo `volatilidad` donde no hay ticks (XAUUSD_DarwTick_Infinox). studies.data.spread.onboard
  commission:
    use: 0.004692           # % del nocional
    sqx_now: {method: SizeBased, value: 8}   # $ por lote — HAY QUE PASARLO A %
    why: "2026-09-27 — decisión del dueño: 8 USD por lote ida y vuelta (Infinox raw), pasados a % del nocional a la mediana del precio Darwinex de oos1 (2018-2022) 1705.02 × 100 onzas = 0.004692 %. SQX cobra PercentageBased una vez por operación sobre la apertura (OPEN.md #26), así que escala con el precio de cada época. (2026-09-29 — decisión del dueño OPEN.md #36: el precio de referencia de una conversión no_forex es la MEDIANA del precio del tramo cargado, no el último cierre — aquí oos1 2018-2022, el mismo tramo que carga el cross-check de mercados. studies.data.spread.onboard._oos1_price)"
  slippage_is:
    use: 8.19                # points — tramo(s) build
    sqx_now: 0.0
    why: "onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño."
  slippage_oos:
    use: 11.27             # points — tramo(s) oos1 y oos2
    sqx_now: 0.0
    why: "onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño."
  slippage_oos2:
    use: 18.75
    sqx_now: null
    why: onboard 2026-09-27 — la mitad del spread de su tramo, default del dueño.
  swap_long:
    use: -7.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: points, value: -73.42}
    why: "2026-09-27 — decisión del dueño: -7 % anual, el mismo en largo y en corto. Valor por defecto: el swap real cambia con los tipos y no hay histórico."
  swap_short:
    use: -7.0                 # % ANUAL (SQX divide /100 y /360)
    sqx_now: {type: points, value: 38.76}
    why: "2026-09-27 — decisión del dueño: -7 % anual, el mismo en largo y en corto. Valor por defecto: el swap real cambia con los tipos y no hay histórico."

notes:
  - "2026-09-21: spread, commission and point_value filled with SQX's own defaults so authoring is not blocked while the protocol is built. They are NOT agreed Infinox figures. Every cost-bearing result produced before the owner replaces them carries that caveat."

# Rangos que sortea la tarea MC Retest, en PUNTOS y por activo. `min`/`max` null =
# sin decidir. `sqx_now` es lo que el maestro lleva hoy para este símbolo; una lista
# significa que distintas tareas llevan rangos distintos. Ver `../_policy.yaml`.
mc_retest:
  spread:
    min: 8.7
    max: 31.98
    sqx_now: [{min: 1, max: 5}, {min: 5, max: 12}]   # varias tareas, rangos distintos
  slippage:
    min: 5
    max: 20
    sqx_now: [{min: 0, max: 5}, {min: 0, max: 10}]   # varias tareas, rangos distintos
  # Sólo lo usa la tarea `MCR 4 MinDist`, y esa tarea sólo se escribe si la población
  # lleva órdenes stop o limit — a mercado no hay ninguna orden pendiente cuya distancia
  # al precio el bróker pueda rechazar. Con `null` la tarea se queda sin configurar y
  # `sqx.projects.mcretest` lo dice. El `min_distance: 10` de `instrument:` de arriba es
  # lo que el bróker impone HOY, no el rango que se quiere sortear: son cosas distintas.
  min_distance:
    min: null
    max: null
    sqx_now: {min: 0.0, max: 10.0}   # el default de fábrica, igual en los 142 instrumentos

# Proyectos del maestro que usan este activo. Leído, no decidido.
projects_using_it:
  - AUDJPY
  - Builder
  - EURUSD
  - Retester
  - USDJPY
  - XAUUSD
