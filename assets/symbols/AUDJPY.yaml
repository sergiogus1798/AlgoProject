  spread_is:
    use: 1.61                # points
    sqx_now: 0.6              # points
    why: "onboard 2026-09-30 — spread medio de Darwinex del tramo × factor 1.25, modelo `volatilidad` donde no hay ticks (AUDJPY_TICK). studies.data.spread.onboard"
