# unify, `<ASSET>_M1` for Dukascopy bars and `<ASSET>_TICK` for ticks). Projects, strategies and
# exports written before that date keep the old names; `core.symbols.current()` translates them
# when the builder borrows a definition from one. Deleted that day: AUDJPY_DarwTick_icmarkets,
