# El universo de retest: para cada activo MAIN, en qué otros mercados hay que comprobar que
# el edge sobrevive. Un bloque por activo main, una lista por categoría.
#
# LA LISTA SE FIJA ANTES DE MIRAR NINGÚN RESULTADO. Elegir los mercados después de ver dónde
# funcionan las estrategias convierte la prueba en una selección y sus p-valores en decoración.
#
# Este fichero CLASIFICA; no decide qué existe. Lo que una estrategia se retesteó de verdad se
# lee del propio export (`markets.discovered()`, de la columna Symbol). Un feed del export que
# no esté aquí se reporta como sin clasificar, nunca se descarta; un feed de aquí que el export
# no traiga se reporta como ausente.
#
# El activo main nunca aparece en una categoría: es el mercado sobre el que se ajustaron las
# estrategias, así que su p-valor de entrada aleatoria no es interpretable. Va como referencia.
#
# LAS DOS CATEGORÍAS, y la diferencia importa porque responden a preguntas distintas:
#
#   family      Mismo motor económico que el main. Si el edge transfiere aquí, puede ser que
#               capture algo real de ese motor — o que los dos mercados sean el mismo trade.
#               Es la prueba fácil: pasarla no demuestra mucho, fallarla sí dice algo.
#
#   structural  Elegidos por tener una ESTRUCTURA parecida (volatilidad, horario, ruido,
#               tendencia) pero NINGÚN motor compartido. Es la prueba dura: si el edge
#               transfiere aquí, es que la lógica capta una regularidad del movimiento del
#               precio, no una exposición a un factor macro.
#
# feed        el símbolo SQX, exactamente como lo imprime `-symbol action=list`.
# data_from   primera fecha con datos. No se filtra nada con ella: se reporta para que se vea
#             cómo encoge la ventana común entre mercados.
#
# Los segmentos (build / oos1 / oos2) NO se repiten aquí: salen de `_policy.yaml`.
#
# Dueño, 2026-09-29: todo activo con ficha en assets/symbols/ es un main, no solo los que
# alguien ya había curado — el aviso "no es un main declarado" era ruido, no un hallazgo. Los
# 16 mains de abajo hasta XAUUSD/USDJPY fueron declarados en bloque ese día (`core.assetwrite`):
# cada uno lleva a TODOS los demás en `family`, sin `timeframe` (se rellena el día que ese
# activo corra de verdad un Cross Market, con el timeframe real de esa plantilla) y con
# `structural` vacío. Es una clasificación de partida, no una curada mercado a mercado — family
# aquí no afirma un motor económico compartido para cada par, solo evita bloquear el retest
# mientras nadie ha mirado con calma cuál de los dos cajones le toca a cada mercado.

XAUUSD:
  main: XAUUSD_DukasM1_Infinox
  timeframe: M30
  categories:
    # Misma familia macro que el oro: metales y energía, movidos por el dólar y por el riesgo.
    family:
      - {feed: XAGUSD_DukasM1_Infinox, data_from: 2003-08-08}
      # 2026-09-23: averiguado. `AlgoData/bars/manifest.json`, sincronizado de SQX el
      # 2026-09-21 con sync_bars.py: 4.105.534 barras M1 de 2013-01-01 a 2026-09-07.
      # Con `unknown` el cross-check le daba ventana desde 2008, cinco años sin datos.
      - {feed: BRENTCMDUSD_ftmo, data_from: 2013-01-01}
    # Vacío hasta que el dueño elija los mercados estructurales y corra ese retest. La
    # categoría existe para que el export se pueda clasificar contra ella.
    structural: []

USDJPY:
  main: USDJPY_DukasM1_the5ers
  timeframe: H1
  categories:
    # Los 28 pares de las 8 divisas major comparten motor macro — dólar, diferenciales de
    # tipos, apetito de riesgo — así que TODOS van en `family`. Ninguno es una prueba dura
    # para USDJPY, y decirlo aquí evita leer un resultado family como si fuera structural.
    #
    # El universo son los pares que el feed `the5ers` ya tiene descargados Y que declaran
    # costes en `symbols/`: 9 de los 27 posibles. Se fija ANTES de mirar ningún resultado
    # (dueño, 2026-09-23). Los 5 que tienen feed pero no fichero de costes — NZDUSD, EURGBP,
    # EURAUD, EURCAD, EURCHF — quedan FUERA a propósito: entrarían al coste por defecto del
    # registro de instrumentos, y un cross-market a un coste inventado es peor que nada.
    #
    # Los 9 tienen datos desde 2003-2004, antes del `build` de 2008: la ventana común es
    # entera, 2008-01-01 → 2022-12-31, sin que ningún mercado la recorte.
    family:
      - {feed: EURUSD_DukasM1_the5ers, data_from: 2003-05-05}
      - {feed: GBPUSD_DukasM1_the5ers, data_from: 2003-05-05}
      - {feed: USDCHF_DukasM1_the5ers, data_from: 2003-05-05}
      - {feed: AUDUSD_DukasM1_the5ers, data_from: 2003-08-04}
      - {feed: USDCAD_DukasM1_the5ers, data_from: 2003-08-04}
      - {feed: EURJPY_DukasM1_the5ers, data_from: 2003-08-04}
      - {feed: GBPJPY_DukasM1_the5ers, data_from: 2003-08-04}
      - {feed: AUDJPY_DukasM1_the5ers, data_from: 2003-12-01}
      - {feed: CADJPY_DukasM1_the5ers, data_from: 2004-10-25}
    # Vacío a propósito: ningún par de divisas es structural para otro. Los candidatos
    # reales son los mercados que ya tienen feed y costes fuera del FX — XAUUSD, DAX40,
    # USA500, NIKKEI225 — y entran cuando el dueño lo decida, no antes.
    structural: []
