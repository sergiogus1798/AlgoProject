# Filtros de aceptación del Build (paso 6): QUÉ estrategia entra en el databank mientras se genera.
#
# ⚠️ PROPUESTA DE AGENTE, 2026-10-04 — PROVISIONAL hasta que el dueño la apruebe. Recalibrada en
# `docs/AgentPDFs/criterios-pasos-6-a-12-2026-10-04.md` §4 sobre 203 poblaciones bien construidas
# (Simple Strategy, 1..2 condiciones por lado, una paleta por familia) y un bucle de siete rondas de
# builds con filtros dentro (`AlgoData/scratch/calib2/adaptive/RECIPE.md`).
#
# `_build.yaml` dice qué FORMA tiene la estrategia que se genera; este fichero dice cuáles de las
# generadas se quedan. Lo escribe `sqx/projects/rankings.py` en las condiciones de «Ranking» de la
# tarea Build de cada proyecto nuevo (`builder`), sustituyendo ENTERAS las del donante
# (`NumberOfTrades > 500`, `SortinoRatio > 0.6`, `Stagnation < 540`, que nadie había decidido).
# Lo resuelve `core/buildfilters.py`: defaults ← classes[clase del activo] ← symbols[activo].
# Si falta un valor para el activo o el timeframe, el builder SE NIEGA: no hay filtro por omisión.

# ─── Muestra ───────────────────────────────────────────────────────────────────────────
# Sobre qué muestra se mide cada condición. IS = `sampleType` 10 de SQX: sólo la ventana de
# construcción (`build`). Un filtro del build NUNCA lee OOS: seleccionar con el OOS lo gasta
# (knowhow/research/post-selection-bias.md). No hay otro valor admitido.
sample: IS

# ─── Filtros por defecto ───────────────────────────────────────────────────────────────
# ⚠️ DENTRO del build el filtro es MÍNIMO, a propósito. Medido el 2026-10-03, mismo activo, familia,
# lado y caja de build, filtro dentro contra control sin filtrar: ningún filtro de IS probado da
# más estrategias robustas por minuto; todos dan entre un 70 y un 98 % menos. Robustas por minuto
# (filtro / control): suelo de 35 ops/año 5,4 / 32,4 · PF >= 1,2 y Ret/DD >= 2 7,1 / 33,6 ·
# % de aciertos >= 55 10,6 / 32,4 · PF >= 1,3 y Ret/DD >= 3 4,8 / 35,8 · PF >= 1,5 y Ret/DD >= 5
# 0,6 / 35,8 · PF >= 1,8 y Ret/DD >= 8 no llega a 300 estrategias en 4 minutos. Poner el filtro
# dentro o aplicarlo después da lo mismo. SQX respeta ReturnDDRatio y WinningPct como condición.
# PF >= 1,3 y Ret/DD >= 3 es OPCIONAL (para revisar menos; pureza x1,54, intervalo 0,86-2,43) y
# nunca junto a un suelo de operaciones. NO probado en builds largos con el databank lleno.
defaults:
  # Operaciones POR AÑO, por timeframe. El suelo y el techo que se escriben en SQX son totales:
  # trades_per_year × años del tramo `build` del activo (`_policy.yaml`), suelo redondeado hacia
  # arriba y techo hacia abajo. XAUUSD H1, 10 años: 100 <= NumberOfTrades <= 750.
  # El suelo (10/año) sólo garantiza que haya estadística que leer. El techo (75/año en H1 y M30)
  # sí muerde: por encima, las poblaciones dan 0,41 veces lo que da el azar (2026-10-03).
  # Un suelo de 35/año NO va aquí: pierde el 81 % de las robustas en H1 y en M30.
  # Un timeframe que no esté aquí no se puede construir.
  trades_per_year:
    H1: {min: 10, max: 75}
    M30: {min: 10, max: 75}
    H4: {min: 10, max: 100}      # H4 no se ha recalibrado
  # Profit factor mínimo en el IS (ProfitFactor >= valor). 1.0 = sólo no perder.
  profit_factor_min: 1.0
  # Beneficio neto en el IS, estricto (NetProfit > valor).
  net_profit_min: 0

# ─── Excepciones por clase (`class:` del fichero del activo) ───────────────────────────
classes: {}

# ─── Excepciones por activo ────────────────────────────────────────────────────────────
# Sólo lo que cambia; lo demás se hereda. `trades_per_year` se mezcla timeframe a timeframe.
# Índices y crudo: su `build` es más corto (6,25-8,3 años frente a 10), así que el suelo por año sube
# para que el total no baje de ~100 operaciones. Medido el 2026-10-03: los índices construyen (sesión y feed salen de data.db).
symbols:
  DAX40: {trades_per_year: {H1: {min: 16, max: 75}, M30: {min: 16, max: 75}, H4: {min: 16, max: 100}}}
  DJ30: {trades_per_year: {H1: {min: 16, max: 75}, M30: {min: 16, max: 75}, H4: {min: 16, max: 100}}}
  NIKKEI225: {trades_per_year: {H1: {min: 13, max: 75}, M30: {min: 13, max: 75}, H4: {min: 13, max: 100}}}
  USA500: {trades_per_year: {H1: {min: 13, max: 75}, M30: {min: 13, max: 75}, H4: {min: 13, max: 100}}}
  USATEC: {trades_per_year: {H1: {min: 13, max: 75}, M30: {min: 13, max: 75}, H4: {min: 13, max: 100}}}
  UKOIL: {trades_per_year: {H1: {min: 15, max: 75}, M30: {min: 15, max: 75}, H4: {min: 15, max: 100}}}
  USOIL: {trades_per_year: {H1: {min: 15, max: 75}, M30: {min: 15, max: 75}, H4: {min: 15, max: 100}}}

# ─── Modo calibración ──────────────────────────────────────────────────────────────────
# `builder --acceptance calibration`: una población SIN seleccionar, para calibrar estos mismos
# filtros y los criterios del paso 8. Sólo un mínimo absoluto de operaciones y beneficio > 0,
# y el crosscheck MonteCarloManipulation del build apagado (no filtra nada y gasta CPU).
# Nunca para un proyecto `Trade_`.
calibration:
  trades_min: 100
  net_profit_min: 0
