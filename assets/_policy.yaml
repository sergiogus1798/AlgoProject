# ─── Convenciones de swap ──────────────────────────────────────────────────────────────
# Las lleva el atributo <Swap> de cada InstrumentInfo. Son iguales en los 142 instrumentos
# configurados hoy en el maestro, así que viven aquí en vez de repetirse 17 veces.
swap:
  triple_swap_on: WEDNESDAY
  rollout_hour: "23:00"

# ─── Convención de la ventana ──────────────────────────────────────────────────────────
# ⚠️ El proyecto XAUUSD del maestro NO sigue la convención inclusiva: su tarea Build lleva
# dateTo = 2017-12-31 00:00, o sea el principio del último día. Las estrategias que ya están
# en sus databanks vienen de esa ventana, un día más corta que la que describe este fichero.

# ─── Rangos de perturbación del MC Retest ──────────────────────────────────────────────
# La tarea `MC Retest` vuelve a correr el backtest entero contra una entrada perturbada. Dos
# de sus métodos sortean un valor dentro de un rango, y ese rango es lo único que decide si
# la prueba dice algo: `RandomizeSpread` y `RandomizeSlippage`.
#
#   <Method use="true" type="RandomizeSpread">
#     <Params><Param key="Min">…</Param><Param key="Max">…</Param></Params>
#   </Method>
#
# LOS DOS VAN EN PUNTOS, absolutos, no en múltiplos del spread real: 1 punto = 1 × tick_size.
# Por eso el rango tiene que estar a la escala del instrumento y se declara POR ACTIVO, en su
# propio fichero, bajo `mc_retest:`. El que trae SQX de fábrica —spread 1.0–5.0, slippage
# 0.0–5.0— es el mismo para todos los mercados y no tiene sentido en casi ninguno: en el
# NIKKEI225, cuyo spread real son 1100 puntos, sortea entre 1 y 5.
#
# `RandomizeMinDistance` tiene la misma forma y desde el 2026-09-23 también se declara por
# activo, bajo `mc_retest: min_distance:`. La diferencia es que ése SÓLO se usa si la
# población lleva órdenes stop o limit: a mercado no hay orden pendiente que el bróker pueda
# rechazar por estar demasiado cerca del precio, y la tarea `MCR 4 MinDist` no se escribe.
# Con los dos bordes en `null` la tarea tampoco se escribe, y el comando lo dice.
mc_retest:
  unit: points
  methods:
    spread: RandomizeSpread
    slippage: RandomizeSlippage
    min_distance: RandomizeMinDistance
  sqx_factory_default:
    spread: {min: 1.0, max: 5.0}
    slippage: {min: 0.0, max: 5.0}
    min_distance: {min: 0.0, max: 10.0}

  # Lo que se usa cuando un activo deja su rango en `null`, en MÚLTIPLOS del coste con que
  # corre el backtest — no en puntos. Decisión del dueño, 2026-09-24: «min 1x, max 4x, con el
  # spread y el slippage los del backtest normal». En múltiplos y no en puntos a propósito: el
  # día que cambie el spread pactado de un par, su rango de MC Retest lo sigue solo, y un
  # número escrito a mano en el fichero del activo sigue mandando sobre esto.
  # ⚠️ El de fábrica de SQX (arriba) es el MISMO en los diecisiete mercados y por eso no
  # significa nada: 1-5 puntos es enorme en un par de divisas y ridículo en un índice.
  default_multiples:
    spread: {min: 1, max: 4}
    slippage: {min: 1, max: 4}
