# Política de investigación: lo que vale igual para TODOS los activos.
#
# Un fichero `<SIMBOLO>.yaml` sólo declara lo que es propio de ese instrumento. Todo lo que
# aquí abajo se decide una vez, se decide para todos, y un activo únicamente lo sobreescribe
# cuando tiene un motivo escrito. Los ficheros que empiezan por `_` no son activos.

# ─── Segmentos temporales ──────────────────────────────────────────────────────────────
# Años enteros, ambos extremos INCLUIDOS: `from: 2008` es el 1 de enero de 2008 a las 00:00
# y `to: 2017` es el 31 de diciembre de 2017 completo. `core.assets.window()` los convierte
# en los milisegundos epoch que lleva una tarea de SQX.
#
# `segments_default` dice QUÉ ES cada tramo — su papel y qué spread usa — y vale para todos.
# `segments` dice DÓNDE EMPIEZA Y ACABA en cada activo, que es lo que cambia: el oro tiene
# datos desde 2003 y sólo se construye desde 2008; el DAX40 no tiene nada antes de 2013 y
# ahí se usa todo el histórico. Los 17 están juntos aquí a propósito, para poder mirarlos
# y ajustarlos de una vez en lugar de abrir diecisiete ficheros.
#
# `data` NO se edita a mano: es lo que SQX dice que tiene para el feed de ese activo, leído
# con `bin/sqx-worker.sh run -symbol action=list`. Está al lado de los tramos justo para que
# se vea de un golpe si una ventana pide datos que no existen — `core.assets.validate()` lo
# comprueba y la preflight lo canta.
#
# `from: null` = sin decidir. No bloquea la autoría (el coste ya lo hace), pero `window()`
# se niega a inventar una ventana y la preflight lo avisa.
segments_default:
  build:
    purpose: "Construcción. Es la única muestra que el generador ve."
    spread: is
  oos1:
    purpose: >-
      Todo lo que va desde el retest hasta los SPP: decaimiento, Monte Carlo, MC Retest,
      cross-market, SPP.
    spread: oos
  oos2:
    purpose: >-
      RESERVADO para Walk Forward Correlation y Walk Forward Matrix, que son las últimas
      pruebas. No usar antes: cada mirada a este tramo lo gasta.
    spread: oos
    reserved_for: [WFC, WFM]

segments:
  BRENT:
    data: {from: 2013-01-01, to: 2026-09-24}   # BRENTCMDUSD_ftmo, 4.121.895 barras M1
    build: {from: null, to: null}
    oos1: {from: null, to: null}
    oos2: {from: null, to: null}
