note: 'Hueco libre único de squeezeBBLong en XAUUSD H1, largo, en AND con la fija:
  un contador de velas seguidas con el BB Width Ratio en la parte baja de su propia
  historia (≥ 4-8 velas): un ESTADO de compresión, sin dirección; entra a mercado
  y sale por SL/PT/barras de la plantilla. El papel del hueco lo fija assets/FAMILIAS.md
  para una fija de volatilidad: dar la dirección desde las otras familias, y nunca
  la propia. Solo el lado comprador de cada bloque (una dirección por build). Peso
  3 = (a) ruptura al alza — Donchian, bandas de Bollinger y Keltner por arriba, vela
  de ruptura en ATR, nube de Ichimoku, momentum del TTM: es la salida clásica de una
  compresión y la familia medida a favor en esta celda (channel55_trail, nota C, 3,7×
  el coste, no significativa tras corregir); (b) momentum positivo — ROC, Momentum,
  MACD/OSMA, AWO, WAE, RVI, QQE, WaveTrend, DSS, ergódico: nota C en H1 largo (vela
  > 2 ATR, 3,9×). Peso 2 = (c) tendencia alcista como contexto (medias, cruces, DI+,
  Vortex, SuperTrend, PSAR), sin evidencia medida en XAUUSD; (d) el disparo de reversión
  SOLO comprador (oscilador bajo o saliendo, estiramiento bajo la media, IBS bajo,
  reentrada en banda desde abajo): comprar el retroceso dentro de la compresión; VR(8)
  < 1 en 6 de 10 años en H1, pero la familia no paga el coste en M15/M30. Peso 1 =
  ADX que arranca y KER alto. Fuera: toda la familia volatilidad (Squeeze, BBWR, ATR
  y StdDev en cualquier lectura, KS, Wasserstein: nunca dos iguales junto a la fija),
  el lado vendedor de todo, patrones de velas (medido en XAUUSD: no pagan el coste,
  6 de 8 celdas), sesión (sin reloj solo se escribe con comparadores genéricos, cuyo
  peso SQX no respeta; prev_day_break p 0,96 en H1), reloj y calendario (regla 15),
  volumen y VWAP, régimen de rango (Choppiness, entropía, Hurst bajo: repite la compresión)
  y los niveles stop/limit: entrada a mercado, ningún indicador ni nivel encendido.'
