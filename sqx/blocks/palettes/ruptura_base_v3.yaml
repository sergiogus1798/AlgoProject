# Paleta «Ruptura — base (v3, 90-150)» — familia Ruptura.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `breakout`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: ruptura_base_v3
label: Ruptura — base (v3, 90-150)
family: breakout
origin: propia
based_on: ruptura_base_v2
created: '2026-10-02'
note: 'Paleta de familia v3 para poblaciones Simple Strategy (entrada 1..2, salida
  1..2, todo a mercado, una dirección por build): de aquí salen la entrada Y la salida.
  Peso 3 = todas las señales propias de la ruptura, no una por clase: rango de N barras
  (Donchian, Highest/Lowest, nube), Bollinger, Keltner (canal de ATR), vela de expansión
  y salida de compresión con dirección (los TTM Squeeze Momentum nativos exigen squeeze
  ON: leído en su código). Peso 2 = su contexto: la volatilidad (comprimida antes,
  expandiéndose después) y el arranque de tendencia. Peso 1 = lo ortogonal para la
  segunda condición y las salidas: reversión (contraria: tendencia con contratendencia),
  ruptura fallida, pérdida de media/trailing y cuatro velas. Fuera: tendencia y momentum
  como segunda condición (son iguales a la ruptura: nunca dos iguales), reloj y calendario,
  ruptura de franja horaria, niveles de sesión y del día (HighD/LowD…: dependen de
  una franja), volumen, y niveles stop/limit. Lo medido: ruptura larga en H1 es donde
  prior y medida coinciden; el coste es el muro.'
unlabelled: 'off'
# 2026-10-02 (calibration pilot): the value blocks and the generic comparison operators were
