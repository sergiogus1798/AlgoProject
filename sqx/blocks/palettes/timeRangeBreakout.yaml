# Paleta «Ruptura de franja horaria — XAUUSD M30» — familia Ruptura.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `breakout`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: timeRangeBreakout
label: Ruptura de franja horaria — XAUUSD M30
family: breakout
origin: propia
based_on: null
created: '2026-10-01'
note: 'Hueco libre único, AND con un CRUCE fijo (Close cruza el máximo de la franja).
  Por eso solo estados, no eventos: dos cruces en la misma barra matan la frecuencia.
  Peso 3 al régimen de volatilidad y tendencia/rango (lo que decide si una ruptura
  sigue); 2 a la tendencia alcista, la vela de ruptura, el VWAP de sesión y la hora
  en rango; 1 al momento/agotamiento por umbral. Fuera: otra ruptura de nivel (Highest,
  Donchian, BB/KC, TimeBreakout, sesión), los comparadores de cruce, BarHourIs (puede
  caer en la barra de reapertura de las 01:00, deriva falsa) y todo lo bajista o corto.
  Entrada a mercado y salidas ATR fijas: los niveles no se usan.'
