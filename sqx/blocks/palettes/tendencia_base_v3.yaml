# Paleta «Tendencia — base (v3, 90-150)» — familia Tendencia.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `trend`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: tendencia_base_v3
label: Tendencia — base (v3, 90-150)
family: trend
origin: propia
based_on: tendencia_base_v2
created: '2026-10-02'
note: 'Paleta de familia v3 para poblaciones Simple Strategy (entrada 1..2, salida
  1..2, todo a mercado, una dirección por build): de aquí salen la entrada Y la salida.
  Peso 3 = todas las señales propias de la tendencia: pendiente de la media, precio
  contra la media, rápida sobre lenta (estado) y su cruce (evento), movimiento direccional
  y trailing por volatilidad; cada indicador entra una vez por lectura, no sus ocho
  variantes. Peso 2 = su régimen: hay tendencia. Peso 1 = lo ortogonal: el retroceso
  (reversión, la contraria: tendencia con contratendencia), la volatilidad, el apagado
  de la tendencia como salida y cuatro velas. Unida a reversion_base_v3 forma la familia
  «pullback»: sus pesos 1 de reversión son un subconjunto del peso 3 de aquella. Fuera:
  ruptura y momentum como segunda condición (son iguales: nunca dos iguales), MACD
  contra su señal, ROC, Momentum (momentum), reloj, calendario, VWAP anclado y perfil
  de volumen (franja horaria), VWAP (volumen), niveles de sesión y del día, y niveles
  stop/limit. No hay en el catálogo un bloque de contexto D1 sin reloj: el filtro
  D1 se pone con un segundo gráfico, no desde la paleta. Lo medido: la tendencia en
  un solo activo está en el azar o por debajo a M30-H1.'
unlabelled: 'off'
