# Paleta «CCI en percentil bajo — USDJPY H1 largo» — familia Reversión a la media.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `mean_reversion`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: cciPercLong_withExit_USDJPY_H1
label: CCI en percentil bajo con salida — USDJPY H1 largo
family: mean_reversion
origin: propia
based_on: cciPercLong_EURUSD_M30
created: '2026-10-16'
note: 'Hueco libre de entrada de cciPercLong_withExit en USDJPY H1, largo, en AND con
  la fija: CCI en o bajo su percentil de las últimas N velas (estado de sobreventa);
  entra a mercado. El papel del hueco lo fija assets/FAMILIAS.md para una fija de
  reversión (USDJPY: reversión H1 largo nota C, 1,03× el coste, prior Alta, evidencia
  débil): volatilidad (3), momentum, ruptura y tendencia (2); patrón fuera (medido en
  USDJPY: no paga el coste, 5 de 8 celdas, máx. 0,55×) y sesión fuera (regla 15 y
  medida: 8 de 8 celdas bajo medio coste). Misma selección que cciPercLong_EURUSD_M30.
  Peso 3 = régimen de volatilidad en sus dos lados (ATR contra su historia, StdDev,
  Squeeze, BBWR, cambio de distribución): ortogonal a la fija; con coste/ATR 0,10 en
  H1, operar sólo en volatilidad alta es lo que puede pagar el coste. Peso 2 = régimen
  de tendencia o rango (ADX, Choppiness, Hurst, KER, entropía, CSSA, SuperTrend);
  contexto alcista de fondo, sólo su lado largo; giro al alza de otro oscilador; y la
  reentrada desde abajo en Bollinger, Keltner o el mínimo. Peso 1 = cruces de régimen
  y dirección de las bandas. Fuera: todo CCI (repite la fija), osciladores en zona
  baja y estiramientos bajo la media (repiten la sobreventa), lado bajista, rupturas
  por arriba, patrones de velas, sesión, reloj y calendario (regla 15), volumen, VWAP,
  comparadores con valores y niveles stop/limit (entrada a mercado). La salida libre
  de la plantilla sortea de esta MISMA lista (SQX tiene una sola por tarea Build).'
unlabelled: 'off'
