# Paleta «Momentum — base (v3, 90-150)» — familia Momentum.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `momentum`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: momentum_base_v3
label: Momentum — base (v3, 90-150)
family: momentum
origin: propia
based_on: momentum_base
created: '2026-10-02'
note: 'Paleta de familia v3 para poblaciones Simple Strategy (entrada 1..2, salida
  1..2, todo a mercado, una dirección por build): de aquí salen la entrada Y la salida.
  Peso 3 = todas las señales propias del momentum: velocidad (ROC y Momentum, que
  en SQX es un cociente ×100 y viaja entre activos), aceleración (MACD contra su señal,
  OSMA, Awesome), impulso que supera a la volatilidad (Waddah Attar, RVI) y cada oscilador
  contra su propia señal. El MISMO oscilador contra un nivel es reversión y vive en
  la otra paleta: por eso los pesos 3 no se pisan. Peso 2 = su contexto: movimiento
  limpio y volatilidad. Peso 1 = lo ortogonal: el agotamiento (reversión, la contraria),
  la pérdida de media/trailing como salida y cuatro velas. Fuera: tendencia y ruptura
  como segunda condición (son iguales: nunca dos iguales), MACD > 0 (tendencia), Bulls/Bears
  y Disparity (distancia a la media), Reflex y los Woodies (sin verificar), reloj,
  calendario, volumen y niveles stop/limit. Lo medido: momentum largo en H1 es, con
  la ruptura, donde prior y medida coinciden.'
unlabelled: 'off'
# 2026-10-02 (calibration pilot): the value blocks and the generic comparison operators were
# taken out. SQX does not weigh them: in the pilot 69 % of entry conditions were a comparator
# on one of two values, whatever the weights said. Named signal blocks only.
