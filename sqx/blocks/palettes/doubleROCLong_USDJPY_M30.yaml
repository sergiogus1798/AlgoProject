# Paleta «Doble ROC positivo — USDJPY M30 largo» — familia Momentum.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `momentum`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: doubleROCLong_USDJPY_M30
label: Doble ROC positivo — USDJPY M30 largo
family: momentum
origin: propia
based_on: null
created: '2026-10-05'
note: 'Hueco libre único de doubleROCLong en USDJPY M30, largo, en AND con la fija
  gemela: ROC > 0 en dos periodos (10-30), un ESTADO de momentum positivo en dos horizontes;
  entra a mercado y sale por SL/PT/barras de la plantilla. El papel del hueco lo fija
  assets/FAMILIAS.md para momentum en USDJPY M30 long (prior Alta; medido nota C,
  3,3× el coste, no significativa tras corregir): volatilidad (3) y reversión (2);
  sesión y patrón quedan fuera. Peso 3 = régimen de volatilidad en sus dos lados,
  estado y cambio (ATR contra su propia historia, StdDev, Squeeze, BBWR, cambio de
  distribución): ortogonal a la fija y sin dirección; la medida líder de la celda
  es una vela > 2 ATR. Peso 2 = (a) el disparo de reversión SOLO en su lado comprador
  — oscilador en zona baja o saliendo de ella, estiramiento bajo la media, IBS bajo,
  reentrada en banda desde abajo: comprar el retroceso dentro del momentum positivo,
  y el VR(8) < 1 medido en 9 de 10 años lo apoya; (b) fuerza de tendencia o rango
  en sus dos lados (ADX, Choppiness, Hurst, KER, entropía, CSSA), sin dirección. Peso
  1 = los cruces de régimen (eventos raros) y la dirección de las bandas. Fuera: toda
  la familia momentum (ROC, Momentum, MACD, OSMA, AWO, WAE positivo, RVI, QQE contra
  su señal: nunca dos iguales junto a la fija), tendencia y ruptura (son lo mismo
  que la fija), el lado alto de los osciladores (RSI alto con ROC > 0 repite la fija),
  patrones de velas (medido en USDJPY: no pagan el coste, 5 de 8 celdas), sesión,
  reloj y calendario (regla 15; medido: 8 de 8 celdas bajo medio coste), volumen y
  VWAP, los comparadores con valores (SQX no respeta su peso) y los niveles stop/limit:
  entrada a mercado, ningún indicador ni nivel encendido.'
