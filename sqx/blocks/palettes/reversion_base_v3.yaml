# Paleta «Reversión a la media — base (v3, 90-150)» — familia Reversión a la media.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `mean_reversion`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: reversion_base_v3
label: Reversión a la media — base (v3, 90-150)
family: mean_reversion
origin: propia
based_on: reversion_base_v2
created: '2026-10-02'
note: 'Paleta de familia v3 para poblaciones Simple Strategy (entrada 1..2, salida
  1..2, todo a mercado, una dirección por build): de aquí salen la entrada Y la salida.
  Peso 3 = todas las señales propias de la reversión: cada oscilador acotado en su
  extremo (estado y cruce del nivel), el estiramiento respecto de la media (ZScore,
  CMMA, Disparity; %B como valor), IBS, la reentrada en banda/canal tras salirse y
  el giro desde la zona. Peso 2 = su régimen: sin tendencia, y la volatilidad (la
  literatura: la reversión paga con volatilidad alta). Peso 1 = lo ortogonal: el filtro
  de tendencia que la convierte en pullback, la vuelta a la media y el momentum girado
  como salida, y cuatro velas de giro. Unida a tendencia_base_v3 forma la familia
  «pullback»: sus pesos 1 de tendencia son un subconjunto del peso 3 de aquella. Fuera:
  reloj, calendario, niveles de sesión y del día, volumen (MFI, VWAP), DPO contra
  nivel en puntos, Woodies CCI y SR Percent Rank (sin verificar) y niveles stop/limit.
  Lo medido: la reversión barra a barra es significativa y paga 0,2× el coste; sin
  contexto no llega.'
unlabelled: 'off'
# 2026-10-02 (calibration pilot): the value blocks and the generic comparison operators were
# taken out. SQX does not weigh them: in the pilot 69 % of entry conditions were a comparator
# on one of two values, whatever the weights said. Named signal blocks only.
