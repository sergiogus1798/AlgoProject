# Paleta «IBS diario bajo — USA500 H1 largo» — familia Reversión a la media.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `mean_reversion`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: indicesIBS_USA500_H1
label: IBS diario bajo — USA500 H1 largo
family: mean_reversion
origin: propia
based_on: null
created: '2026-10-05'
note: 'Hueco libre único de indicesIBS en USA500 H1, largo, en AND con un ESTADO que
  dura todo el día (IBS de la vela diaria de ayer < 0,2; sale con IBS > 0,8). El hueco
  pone el régimen y el momento dentro del día, por las dos reglas del director para
  una fija de reversión. Peso 3 = régimen de volatilidad como estado (ortogonal; la
  reversión paga con volatilidad alta, REV-39, y la medida líder de la celda pide
  ATR bajando: los dos lados). Peso 2 = fuerza de tendencia o rango (ADX, Choppiness,
  Hurst, KER, entropía, CSSA), la tendencia ALCISTA como contexto (comprar la caída
  dentro de la subida: pullback, prior Alta en USA500), el momentum ya girado al alza
  como estado, y el VWAP anclado de la sesión. Peso 1 = los eventos (cruces al alza
  de momentum y tendencia, cruces de volatilidad y de régimen) y la dirección de las
  bandas: IBS < 0,2 da ~39 operaciones/año sin filtro y el suelo es 35, así que un
  evento raro deja la estrategia sin muestra. Fuera: la propia familia (osciladores
  en extremo, IBS, ZScore, reentrada en banda: nunca dos iguales), toda la ruptura
  (eventos raros y entrada tardía), los patrones de velas (medido en USA500: no pagan
  el coste, 7 de 8 celdas), el lado bajista de tendencia y momentum, los comparadores
  con valores (OpenD, HighD, LowD, Close: SQX no respeta su peso y HighD/LowD repiten
  el dato de la fija), el volumen, reloj y calendario, y los niveles stop/limit (entrada
  a mercado; ningún indicador ni nivel encendido).'
unlabelled: 'off'
