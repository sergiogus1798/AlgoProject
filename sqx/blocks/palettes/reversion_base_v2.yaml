# Paleta «Reversión a la media — base (revisada v2)» — familia Reversión a la media.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `mean_reversion`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: reversion_base_v2
label: Reversión a la media — base (revisada v2)
family: mean_reversion
origin: propia
based_on: reversion_base
created: '2026-10-02'
note: 'Paleta PURA de familia: solo los bloques que SON de esta familia, un representante
  por clase de información, estados antes que eventos salvo donde la familia es un
  evento. Sin bloques de reloj ni de calendario y sin niveles stop/limit (regla 15).
  Cinco clases: estiramiento estadístico respecto de la media (ZScore ±2), oscilador
  en extremo (RSI; Estocástico, CCI, %R, DVO, DeMarker, MFI, Laguerre y WaveTrend
  miden lo mismo y salen), posición del cierre dentro de la barra (IBS), reentrada
  en la banda tras salirse (la ruptura falló) y régimen sin tendencia (ADX bajo).
  Fuera: las velas de giro (van en patrón), la compresión de volatilidad (va en volatilidad),
  CMMA/Disparity/DPO/%B (duplican el ZScore) y todos los indicadores y comparadores
  sueltos.'
unlabelled: 'off'
overrides:
  CBlock_ZScoreStretchedUp: 3
  CBlock_ZScoreStretchedDown: 3
  RSILower: 3
  RSIHigher: 3
  CBlock_IBSCloseLarger: 2
  CBlock_IBSCloseLarger_2: 2
  BBBarOpensAboveDownAfterOpenBelow: 2
  BBBarOpensBelowUpAfterOpenAbove: 2
  ADXLower: 2
