# Paleta «Pullback — tendencia + reversión (v3, 90-150)» — familia Reversión a la media.
#
# Una paleta dice qué puede sortear el builder. Los pesos de partida salen de
# `../taxonomy.yaml`, columna `mean_reversion`; aquí vive solo lo que esta paleta decide:
#   unlabelled  qué se hace con un bloque sin etiquetar — neutral (entra a peso 1) u off
#   overrides   un peso puesto a mano que gana sobre la taxonomía. 0 apaga el bloque
#
# Con `unlabelled: off` y una lista de `overrides`, la paleta ES esa lista: nada más entra.
# Es la forma de tener una paleta curada sin esperar a que la taxonomía esté etiquetada.
#
# ⚠️ Una paleta gobierna los huecos LIBRES de una plantilla. Un hueco atado a un grupo
# sortea ese grupo y la ignora, y un bloque fijo es parte del esqueleto: ninguno de los dos
# se puede estrechar desde aquí. Medido 2026-09-24, `knowhow/authoring/builder-block-switches.md`.

name: pullback_base_v3
label: Pullback — tendencia + reversión (v3, 90-150)
family: mean_reversion
origin: propia
based_on: reversion_base_v3
created: '2026-10-02'
note: 'Paleta «pullback» v3: tendencia + reversión juntas (decisión del dueño), para
  Simple Strategy con entrada 1..2 y salida 1..2 a mercado, una dirección por build.
  Peso 3 = dos conjuntos disjuntos e identificables: el CONTEXTO de tendencia, solo
  como ESTADO (pendiente, precio contra la media, rápida sobre lenta, DI/Vortex, trailing)
  — sin los cruces, que son eventos y un pullback entra contra las últimas barras
  dentro de una tendencia ya establecida — y el DISPARO de reversión (osciladores
  en extremo, estiramiento, IBS, reentrada en banda, giro desde zona). Ambos son subconjuntos
  del peso 3 de tendencia_base_v3 y de reversion_base_v3: el análisis cuenta como
  pullback la estrategia cuya entrada lleva uno de cada. Peso 2 = tendencia limpia
  y nivel de volatilidad. Peso 1 = cola corta para las salidas: vuelta a la media,
  tendencia apagada o trailing perdido, volatilidad, momentum girado y cuatro velas.
  Fuera, además de lo vetado en las otras v3 (reloj, franjas, volumen, stop/limit):
  los 14 cruces de medias, DICross, Aroon, PMax y cierre contra SuperTrend como entrada
  (eventos), y QQE, Schaff y Ergodic contra nivel (duplican RSI/Estocástico) para
  caber en banda. El campo family es mean_reversion porque el tablero archiva pullback
  bajo reversión (pullback_as).'
unlabelled: 'off'
# 2026-10-02 (calibration pilot): the value blocks and the generic comparison operators were
