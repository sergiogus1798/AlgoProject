# Which parameters of a CUSTOM block are lengths in bars, so `sqx.variants.scale` moves them with the timeframe.
#
# Built-in blocks need no row: SQX types each variable in the .sqx (<paramType>ParamTypePeriod</paramType>) and
# `scale.py` reads that. A custom block declares its parameters as plain Int/Double, SQX types them
# ParamTypeOtherParam, and only the block's own definition says what each one feeds. This table is that
# reading, block by block, for every custom block of the six v3 palettes (sqx/blocks/palettes/*_v3.yaml):
#   length      every inner parameter it feeds is a period or a bar count -> scaled
#   other       a level, a multiplier, a number, a shift -> never scaled (owner, 2026-09-23)
#   unverified  could not be read off the definition -> NOT scaled, and the sibling is flagged
#               (`unverified` in scaling.parquet; the study reads it as not tested)
# The comment on each line is what the parameter is called and what it is bound to inside the block.
# Generated 2026-10-02 from SQX_w2/user/settings/customBlocks.xml by
# AlgoData/scratch/calib_step12/lengths_table.py and reviewed by hand; edit a ruling here, not there.
# A custom block that is NOT listed is treated as unverified.

CBlock_ATRCrossMAATR:
  Int2:    length      # PeriodATR -> #Period#[period]
  Int3:    length      # PeriodEMA -> #Period#[period]
CBlock_ATRRankHighVol:
  Int2:    length      # ATR Period -> #ATRPeriod#[period]
  Int3:    length      # Rank Lookback -> #Lenght#[period]
  Double3: other       # Vol Level -> #Number#[-]
