# Every tunable of the variant factory, in one place. Nothing below is hidden in code.
# The shares between strata and the target count are NOT here: they arrive in the design
# brief (contract C1), because they are a property of the strategy being studied.

design:
  # A design is reproducible or it is not a design. Every sampler draws from this seed.
  seed: 20260921
  neighbourhood:
    radius: 2             # how far from the centre tuple the dense grid reaches, in level steps
  factorial:
    min_levels: 2         # the coarse grid never drops below the two ends of a span
  frozen:
    # The coverage stratum varies the frozen parameters too -- that is what makes it a
    # check on the freezing decision instead of a restatement of it. The brief carries no
    # range for a frozen parameter, only the value it is pinned at, so the range is
    # rebuilt the way SQX builds its own permutation ranges (knowhow/sqx-format/declared-parameters.md,
    # measured): +/-30 % of the value. A shift is never varied (owner, 2026-09-26): it stays at
    # the value the strategy was built with.
    span: 0.30
    steps: 5

minimum:
  # Owner, 2026-09-26: every mother is studied with at least this many distinct variants. When
  # its +/-30 % holds fewer (integer parameters with small values), the integer spans widen by
  # `widen_step` of the original value per side until it does, up to `max_span`, and whatever
  # is still missing is printed as a shortfall. `make --min-variants` overrides `variants`.
  variants: 1000
  widen_step: 0.05
  max_span: 0.60

canaries:
  # Controls whose result is known before the retest runs. They are chosen at the extremes
  # of the SPP table on purpose: a miswired chain returns a plausible middling number, it
  # does not return the maximum of a grid of four thousand.
  n: 3
  inert_pairs: true       # one pair per frozen parameter, differing only in it

build:
  # Which ZIP members a variant carries. Sizes measured on Strategy 17.9.39 as the repack
  # actually writes it -- the old 5.2 MB / 26 GB figures were a parent whose SPP profile had
  # been kept, and do not generalise.
  #   minimal     13.7 KB ->  70 MB at 5,000   META-INF, settings, portfolio, lastSettings, version
  #   no_profile  98.7 KB -> 505 MB at 5,000   everything but the parent's optimizationProfile.bin
  #   full       123.3 KB -> 631 MB at 5,000   a byte-for-byte copy of the parent's members
  #
  # SETTLED 2026-09-21: SQX loads, lists, exports and copies a five-member .sqx, and the
  # databank does not de-duplicate on the inherited <Fingerprint> -- it does not de-duplicate
  # at all on load or copy. So minimal is the shape, and it is 7x cheaper than the next one.
  #
  # ⚠️ minimal is cheaper, NOT safer. The parent's 36 <SQStats> blobs live in settings.xml,
  # which every shape keeps, so a variant that never ran exports the parent's metrics rather
  # than looking empty. The canaries are what catches that; the shape is not.
  # knowhow/sqx-format/five-member-sqx.md, both 2026-09-21 sections.
  shape: minimal

execute:
  # Where the batch is retested. The custodian takes ONE long job at a time and receives no
  # other command while it runs, so a sync can never delete the .sqx it is holding -- which
  # is the whole reason the role exists (knowhow/sqx-drive/three-install-topology.md).
  role: custodian
  # The batch retest (`sqx.variants.execute`) no longer reads this: it takes `--project`,
  # the workflow's own project (owner, 2026-09-25), and refuses a stock one. Only the SPP
  # reconnaissance harness of the unattended pipeline (`sqx.variants.spp`, pipeline/recipe.yaml)
  # still runs here -- ⚠️ on the STOCK `Retester`, against hard rule 10. OPEN.md §38.
  project: Retester
  # ⚠️ Estos dos son los del harness de una sola tarea que usa `spp.py` (el reconocimiento
  # SPP de una madre). El RETEST DEL LOTE ya no los usa: sus databanks salen de `wfc:` en
  # assets/_build.yaml — el de entrada y uno de salida por tramo—, que es donde se declara
  # el estudio entero. `sqx.projects.wfc` escribe las tareas con esos nombres y
  # `sqx.variants.legs` los lee, para que no haya dos sitios donde se llamen distinto.
  input: Results
  output: RetestOut
  poll_seconds: 5
  ready_tries: 40        # the port answers ~20 s before the CLI does; poll, do not conclude
  # How many polls to wait for `synctofiles` to finish writing, at poll_seconds each.
  # SQX writes a retested strategy to disk lazily -- 962 of 2,000 were there when the run
  # reported finished -- and `sqx.variants.equity` reads those files, not the databank.
  # ⚠️ Not a fixed sleep: syncing 962 .sqx took 21.95 s (custodian log, 2026-09-23), so
  # the cost grows with the batch and 5,000 is minutes. The poll stops as soon as the
  # folder holds what the retest returned; this is only the cap.
  sync_tries: 60
  # First day of the harness's <OutOfSample> range, which is what splits every harvested
  # curve. It is the same boundary `assets/XAUUSD.yaml` records (build ends 2017-12-31,
  # oos1 starts here), and `equity.py` both checks the curves against it and writes it
  # into equity.json -- so the studies downstream read the split rather than restating it.
  split: "2018-01-01"
  # ⚠️ `-project action=startOnlyTask` reports success and tests NOTHING on this install.
  # Only `action=start` runs the task. Measured 2026-09-22, knowhow/sqx-drive/running-a-task-headless.md.

spp:
  # The reconnaissance run. These are the study's own numbers, not the donor's: the donor
  # filters a population, this maps a surface.
  # ⚠️ The SPP is the OptProfileSysParamPermutation cross-check. SequentialOptimization
  # sits next to it in the same block, sounds like the same thing, and writes no profile.
  spread_pct: 35          # percent up and down from each parameter. 35 or 40; never 30
  step_pct: 4             # how much one step moves a parameter. Steps = 2*spread/step_pct
  max_tests: 15000        # ⚠️ SET it, never inherit: a donor can carry 1000000001, which is
                          # SQX's sentinel for exhaustive -- every combination of everything
  timeout_s: 3600         # an SPP reports nothing until it finishes; this is the only cap
  sync_s: 6               # seconds to let `synctofiles` land before reading the folder

crosstf:
  # Which parameters move when the timeframe moves. OWNER'S RULE, 2026-09-23: periods and
  # bar-count exits, NOTHING ELSE. This is a positive whitelist, not a classification --
  # anything unmatched is written through untouched, so an unknown custom-block parameter
  # is never silently reinterpreted.
  #
  # Deliberately NOT here, and the consequence stated so nobody reads a cell as clean:
  #   *Coef*, *Mult*, *Deviation*  multiply a volatility or range measure that grows when
  #                                bars are aggregated, so a StopLossCoef left at 2 is a
  #                                physically ~2x wider stop on H4 than on H1.
  #   *Lvl*                        oscillator thresholds, bounded 0..100, dimensionless.
  #   *Shift*, *Shf*               fixed at 1 by the builder; 1/4 is not a bar.
  #   *Mth*, *Fld*, *Str*          categorical selectors, not quantities.
  scale:
    - "(Period|Prd|Lookback|Lkb)\\d*$"
    - "EMA\\d*$"
    - "Bars\\d*$"        # ExitAfterBars, and the #Bars# lookback of comparisons like
                        # "Is rising" (IsBars1) -- found 2026-09-23 by the unmatched-int
                        # report, which is what that report is for
  # Candidates the whitelist does not claim yet -- `scale.py` prints every unmatched int
  # parameter so this list can be settled against real strategies rather than guessed:
  #   "Slw\\d*$"      Stochastic slowing, a smoothing length in bars
  #   "(Smooth|Smt)\\d*$"

  floor: 2        # the builder's own minPeriod; a scaled period below it is clamped and flagged
  shape: minimal  # 13.7 KB per file, and the parent's results cannot ride along
