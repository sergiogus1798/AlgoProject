# Every tunable of the variant factory, in one place. Nothing below is hidden in code.
# The batch size is `size:` below (ledger numbers); the plateau and class of each parameter
# arrive in the design brief (contract C1), because they are a property of the strategy.

design:
  # A design is reproducible or it is not a design. The Latin hypercube draws from this seed.
  # The design itself is always a Latin hypercube (`design/lhs.py`): points spread evenly over the
  # in-sample plateau of every live parameter; frozen parameters and shifts stay at the
  # mother's value in every variant (encargo 48, part F).
  seed: 20260921
  frozen:
    # Only the inert pairs read this: a frozen parameter moved this far from the mother's value
    # must return her exact result, which is the check on the freezing decision. A shift is
    # never varied (owner, 2026-09-26): it stays at the value the strategy was built with.
    span: 0.30
    steps: 5

size:
  # `n = min(n_max, max(n_min, per_coefficient * p))`, p = 1 + 2k + k(k-1)/2 for k live
  # parameters (owner, 2026-10-07). The numbers are the ledger's: ledger/thresholds.yaml.
  n_min: ledger:variants.n_min
  n_max: ledger:variants.n_max
  per_coefficient: ledger:variants.per_coefficient

pilot:
  # Owner, OPEN.md §41, 2026-09-29: half a batch can trade too little to be a point on a
  # performance surface (🔬 2026-09-24, Strategy 17.9.39: 1,002 of 2,000 under 30 trades).
  # ON by default, `--no-pilot` or `enabled: false` skip it: a few hundred tuples, sampled
  # over the LIVE parameters only, are fabricated and retested before the full batch --
  # one extra short SQX retest, on the same project and at the same per-task costs
  # (`sqx.variants.execute.awake`/`load`/`run`/`synced`, reused, not reimplemented) -- and
  # scored on trade count alone. A live parameter's level whose pilot points trade too
  # little is dropped before the full design is built, never silently: `pilot.json` records
  # every level's median trade count and whether it was dropped, and `design.json` carries
  # the same drop under `pilot_dropped`.
  enabled: true
  sample: 300           # a few hundred tuples, per the issue's own wording
  seed: 20260929         # its own draw, independent of `design.seed`
  min_trades: 30         # the issue's own floor -- knowhow/research/trade-filter-parameter-space.md
  min_support: 5         # a level's median is trusted only once this many pilot points used
                         # it; fewer and the level is undersampled, not silent

canaries:
  # Controls whose result is known before the retest runs. They are chosen at the extremes
  # of the SPP table on purpose: a miswired chain returns a plausible middling number, it
  # does not return the maximum of a grid of four thousand.
  n: 3
  inert_pairs: true       # one pair per frozen parameter, differing only in it

build:
  # Which ZIP members a variant carries. Sizes measured on Strategy 17.9.39 as the repack
  # actually writes it -- the old 5.2 MB / 26 GB figures were a parent whose SPP profile had
  # been kept, and do not generalise.
  #   minimal     13.7 KB ->  70 MB at 5,000   META-INF, settings, portfolio, lastSettings, version
  #   no_profile  98.7 KB -> 505 MB at 5,000   everything but the parent's optimizationProfile.bin
  #   full       123.3 KB -> 631 MB at 5,000   a byte-for-byte copy of the parent's members
  #
  # SETTLED 2026-09-21 (engineering): SQX loads, lists, exports and copies a five-member
  # .sqx, and the databank does not de-duplicate on the inherited <Fingerprint> -- it does
  # not de-duplicate at all on load or copy. `minimal` is 7x cheaper than the next shape and
  # nothing breaks on it.
  #
  # DECIDED 2026-09-29 (owner, OPEN.md §23): the default is `no_profile`, not `minimal`.
  # Cheaper is not the only cost that matters here -- `no_profile` keeps every member but
  # the parent's `optimizationProfile.bin`, which is strictly more of the parent's own
  # bookkeeping kept intact for the same retest, at 505 MB against 70 MB per 5,000. This is
  # the owner's call, not a reopening of the size measurement above.
  #
  # ⚠️ Neither shape is safer on the canaries. The parent's 36 <SQStats> blobs live in
  # settings.xml, which every shape keeps, so a variant that never ran exports the parent's
  # metrics rather than looking empty. The canaries are what catches that; the shape is not.
  # knowhow/sqx-format/five-member-sqx.md, both 2026-09-21 sections.
  shape: no_profile

execute:
  # Where the batch is retested. The custodian takes ONE long job at a time and receives no
  # other command while it runs, so a sync can never delete the .sqx it is holding -- which
  # is the whole reason the role exists (knowhow/sqx-drive/three-install-topology.md).
  role: custodian
  # This stage takes `--project` on the command line and refuses a stock one
  # (`sqx.variants.execute.STOCK`): the mother's own workflow project (hard rule 10).
  # 2 s since 2026-10-05 (was 5; the caps below scaled to the same seconds): a session waits
  # on five polls -- ready, the run, one sync per leg -- and step 16.5 holds 20 sessions.
  poll_seconds: 2
  ready_tries: 100       # the port answers ~20 s before the CLI does; poll, do not conclude
  # How many polls to wait for `synctofiles` to finish writing, at poll_seconds each.
  # SQX writes a retested strategy to disk lazily -- 962 of 2,000 were there when the run
  # reported finished -- and `sqx.variants.equity` reads those files, not the databank.
  # ⚠️ Not a fixed sleep: syncing 962 .sqx took 21.95 s (custodian log, 2026-09-23), so
  # the cost grows with the batch and 5,000 is minutes. The poll stops as soon as the
  # folder holds what the retest returned; this is only the cap.
  sync_tries: 150
  # ⚠️ `-project action=startOnlyTask` reports success and tests NOTHING on this install.
  # Only `action=start` runs the task. Measured 2026-09-22, knowhow/sqx-drive/running-a-task-headless.md.

crosstf:
  # Which parameters move when the timeframe moves. OWNER'S RULE, 2026-10-07 (encargo 47; it
  # replaces «periods and bar-count exits, NOTHING ELSE» of 2026-09-23): periods, bar-count
  # exits, and the coefficients that multiply a PER-BAR measure — those divided by the measured
  # ATR ratio c. Nothing else. Since 2026-10-02 («arregla el escalado») a period is what SQX
  # itself types one — `<paramType>ParamTypePeriod</paramType>` on the variable, which is how
  # MACD's Fast/Slow/Smooth, the Stochastic's slowing, WaveTrend's lengths, QQE's smoothing and
  # BH Ergodic's R/S/U/trigger are reached: no name pattern matched them, and 65 % of a
  # Simple-Strategy population carried one. A CUSTOM block's parameters are ruled one by one in
  # `lengths.yaml` (SQX types them as the block declared them, a plain Int). `sqx.variants.lengths`.
  #
  # The patterns below are only the FALLBACK, for what SQX types otherwise — ExitAfterBars is
  # `ParamTypeExitUsed`, the #Bars# of "Is rising" — and for a file older than the field.
  # They never claim a variable SQX types a shift.
  #
  # Coefficients (`ranges.yaml`, `sqx.variants.ranges`): a stop or target `X * ATR`, SuperTrend's
  # and Keltner's multiple, a custom block's ATR multiple are `bar` — on H1 the ATR of an M30
  # mother is ~1.42 times bigger, so the same X is a wider stop in price; the sibling carries
  # X / c and keeps the mother's distance. c = median ATR on the sibling's timeframe (period
  # already scaled) / median ATR on the mother's, over build + oos1 of the asset. A Bollinger
  # deviation is `window` (N bars, already scaled, cover the same hours) and stays. What the
  # table cannot rule is left alone and the sibling flagged `unverified`.
  #
  # Still never scaled:
  #   *Lvl*                        oscillator thresholds, bounded 0..100, dimensionless.
  #   *Shift*, *Shf*               fixed at 1 by the builder; 1/4 is not a bar.
  #   *Mth*, *Fld*, *Str*          categorical selectors, not quantities.
  #   Laguerre gamma, PSAR step    smoothing coefficients: there is no bar count to divide.
  scale:
    - "(Period|Prd|Lookback|Lkb)\\d*$"
    - "EMA\\d*$"
    - "Bars\\d*$"

  floor: 2        # the builder's own minPeriod; a scaled period below it is clamped and flagged
  atr_period: 20  # the period c is measured at on the mother's timeframe: the grafted stop's
  shape: minimal  # 13.7 KB per file, and the parent's results cannot ride along

neighbours:
  # Step 14's T1 «especificación» (owner, 2026-10-07): per mother, N neighbours with EVERY declared
  # parameter moved at once, retested over build and oos1 and priced trade by trade. A declared
  # parameter is a numeric variable SQX gave a <paramType> (MagicNumber has none and never moves).
  n: 500            # neighbours drawn per mother; a cap, never a quota: duplicates are dropped, not redrawn
  entry_pct: 15     # entry and indicator parameters move uniformly within +/- this percent of the mother's value
  exit_pct: 30      # exit parameters (paramType ParamTypeExitUsed: ExitAfterBars, stop and target coefficients)
  # Never moved, by name (regex, `search`), on top of what SQX itself types ParamTypeShift. The
  # role is the END of the name: `CBlock_WssShfInt1` is a custom block's own integer, not a shift.
  fixed:
    - "(Shift|Shf)\\d*$"                                                  # shifts (owner: untouched)
    - "(Method|Mth|Mode|Mde|Type|AppliedPrice|AppPrc|Fld|Str)\\d*$"       # selectors: an enum is not a quantity
  seed: 0           # mixed with the mother's name, so each mother has its own draw and a rerun repeats it
  int_floor: 1      # a rounded integer never drops below this (a period of 0 bars); a mother already below it is left free
  legs: [WFC 1 IS, WFC 2 OOS1]   # the legs retested, by title. NEVER `WFC 3 OOS2`: oos2 is reserved
  shape: minimal    # 13.7 KB per file, and the mother's own results cannot ride along in a neighbour
