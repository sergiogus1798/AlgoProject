# What each non-length parameter of a block multiplies or is compared with, so `sqx.variants.scale` knows
# which coefficients move with the timeframe (encargo 47 part F, owner 2026-10-07). `lengths.yaml` rules the
# lengths; this table rules everything else, read off each block's FORMULA (customBlocks.xml and the
# indicator's .java under user/extend/Snippets and internal/extend/Snippets) — never off the name:
#   bar         multiplies a PER-BAR measure (ATR, a candle's range) set against a price path -> divided by
#               the measured ATR ratio c (`ranges.ratio`): k_sibling = k_mother / c
#   window      multiplies, or is compared with, a measure over N bars (deviation of N closes, distance from
#               an N-bar mean): with N already scaled it covers the same hours -> not scaled
#   other       a threshold with no price unit (a percentile, an oscillator level, a ratio inside one
#               candle, a smoothing constant), or a parameter the block's comparison never reads -> not scaled
#   unverified  the formula shows it moves with the bar but not by c, or has two readings -> NOT scaled, and
#               the sibling is flagged (`unverified` in scaling.parquet: not comparable, T0)
# A custom block's double that is NOT listed is unverified. Reviewed by the owner: edit a ruling here.

# Built-in blocks. First rule whose `block` (regex, searched in the block key) and `param` match wins. A
# built-in double SQX types `ParamTypeConstant` (a level, a number) is never a coefficient; any other
# built-in double without a rule here is unverified. `SLPT.ATRBasedValue` (stop, target) needs no row:
# `ranges.py` reads the formula itself — its coefficient is bar, its literal ATR period a length.
_builtin:
  - {block: SuperTrend, param: ATRMult, measure: bar}            # median -/+ ATRMult x ATR (SuperTrend.java)
  - {block: "^(KC|KeltnerChannel|MTKeltnerChannel)", param: Deviation, measure: bar}  # middle -/+ Deviation x mean of (High - Low) (KeltnerChannel.java)
  - {block: "^(BB|BollingerBands)", param: Deviation, measure: window}   # stdev of N closes
  - {block: AnchoredVWAP, param: "(Fast|Slow)?StdDevMult", measure: window}  # stdev around the VWAP since the session opened (AnchoredVWAP.java); SQX types the Fast/Slow pair a period, and it is not one
  - {block: "^(PSAR|ParabolicSAR)", param: "Step|Maximum", measure: other}   # acceleration factors
  - {block: LaguerreRSI, param: Gamma, measure: other}           # a smoothing constant
  - {block: EhlersMotherOfAdaptiveMovingAverages, param: "FastLimit|SlowLimit", measure: other}  # alpha limits

