# Machine-specific settings. Copy to machine.yaml and edit for this machine.
# machine.yaml is NOT in git: it is the only file that may differ between computers.
# core/paths.py is the only code allowed to read it.
#
# On Windows, write paths with forward slashes and no drive letter guessing:
#   data_root: C:/Users/sergio/Desktop/AlgoData
# data_root is the one that matters there; sqx_master and sqx_worker still have to be
# present but are never opened, because everything that drives SQX runs
# bin/sqx-worker.sh and is Linux-only. See the Windows section of README.md.

# Top-level StrategyQuant X folders (the ones containing internal/ and user/).
sqx_master: ~/Desktop/SQX        # the GUI the owner works in
sqx_worker: ~/Desktop/SQX_w1     # headless install used for exports and authoring

# Worker command API. The master's CLI does not answer while its GUI is up.
worker_port: 5060

# Where exported data lives. Never inside the repo.
data_root: ~/Desktop/AlgoData

# Browser used to render the manual to PDF. Chromium works too:
# /usr/bin/chromium, /usr/bin/chromium-browser, or on macOS
# "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome".
browser: /usr/bin/google-chrome

# Read-only archive of the previous project. Optional; omit if absent.
archive: ~/Desktop/AlgoProject_Old

# Folders that hold .sqx files worth indexing, by short name. Trash is deliberately
# excluded: the owner has asked that it never appear in strategy searches.
# Optional; omit the whole block on a machine with no SQX install.
strategy_pools:
  master: ~/Desktop/SQX/user/projects
  june_tree: ~/Desktop/user
  wfm_dump: ~/Desktop/StrategiesWFM
  banquillo: ~/Desktop/BanquilloEstrategias
  worksqx: ~/Desktop/WorkSQX
  addons: ~/Desktop/AddonsSQX
  problem: ~/Desktop/StratsProblem
