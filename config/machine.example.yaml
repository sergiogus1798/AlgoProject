# Machine-specific settings. Copy to machine.yaml and edit for this machine.
# machine.yaml is NOT in git: it is the only file that may differ between computers.
# core/paths.py is the only code allowed to read it.
#
# On Windows, write paths with forward slashes and no drive letter guessing:
#   data_root: C:/Users/sergio/Desktop/AlgoData
# data_root is the one that matters there; sqx_master and sqx_worker still have to be
# present but are never opened, because everything that drives SQX runs
# bin/sqx-worker.sh and is Linux-only. See the Windows section of README.md.

# Top-level StrategyQuant X folders (the ones containing internal/ and user/).
sqx_master: ~/Desktop/SQX        # the GUI the owner works in
sqx_worker: ~/Desktop/SQX_w1     # headless install used for exports and authoring

# Worker command API. The master's CLI does not answer while its GUI is up.
worker_port: 5060

# Extra headless installs, by role. The conductor is sqx_worker / worker_port above — it
# is not repeated here, so its port lives in exactly one place.
#   conductor : short jobs, always awake. Exports, authoring, queries.
#   custodian : ONE long job at a time; receives no other command while it runs, so a
#               sync can never delete the .sqx it is holding.
# custodian is OPTIONAL: a machine with two installs (master + conductor) is a valid
# configuration and the code works unchanged without it — see docs/SETUP-NEW-MACHINE.md.
sqx_workers:
  custodian:
    path: ~/Desktop/SQX_w2
    port: 5070

# Port the desktop app's local daemon listens on, loopback only. Optional: 8765 if absent.
ui_port: 8765

# MetaTrader 5 under Wine: the prefix holding the terminal (bin/mt5-install.sh creates it).
# Optional: ~/Desktop/MT5 if absent.
mt5_prefix: ~/Desktop/MT5

# The funded accounts saved in that terminal (password saved there, never here), by firm key
# of AlgoData/funding/firms.yaml. MT5 Bridge › Verificar logs the tester into each one in turn.
# Optional: without it the bridge verifies nothing.
# mt5_accounts:
#   ftmo: {login: 12345678, server: FTMO-Server4}
#   hantec: {login: 1234567, server: HantecMarketsMU-MT5}

# The live MT5 fleet on the VPS (encargo 35). `accounts` is what MetaTracker needs to find each
# account's floors in the funding catalogue: by login, the firm, the plan's family, its size in
# the account's currency and the stage it is in (phase1, phase2, phase3, funded).
# fleet:
#   vps:
#     accounts:
#       12345678: {firm: ftmo, plan: 2step, size: 10000, phase: funded}
#       1234567: {firm: hantec, plan: enhanced, size: 100000, phase: phase1}

# Claude Code's CLI, which the window runs headless to author a template from its chat.
# Optional: the newest VS Code extension's bundled binary, else `claude` on the PATH.
# claude_bin: ~/.local/bin/claude

# Other servers that run workflows on a copy of THIS machine's master data. bin/mirror-data.sh
# copies user/data to each after the weekly update. `ssh` is an alias of ~/.ssh/config with a
# key that needs no passphrase; `master` is the SQX folder over there, relative to its home.
# Optional: omit the block on a machine that feeds no other.
# mirrors:
#   gorilla: {ssh: sqx2, master: Desktop/SQX}

# Where exported data lives. Never inside the repo.
data_root: ~/Desktop/AlgoData

# Browser used to render the manual to PDF. Chromium works too:
# /usr/bin/chromium, /usr/bin/chromium-browser, or on macOS
# "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome".
browser: /usr/bin/google-chrome


# Folders that hold .sqx files worth indexing, by short name. Trash is deliberately
# excluded: the owner has asked that it never appear in strategy searches.
# Optional; omit the whole block on a machine with no SQX install.
strategy_pools:
  master: ~/Desktop/SQX/user/projects
  june_tree: ~/Desktop/user
  wfm_dump: ~/Desktop/StrategiesWFM
  banquillo: ~/Desktop/BanquilloEstrategias
  worksqx: ~/Desktop/WorkSQX
  addons: ~/Desktop/AddonsSQX
  problem: ~/Desktop/StratsProblem
