<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte Carlo — __TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
    --grid: #d9d8d4; --null: #2a78d6; --real: #eb6834;
    --good: #1baf7a; --bad: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #131312; --card: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --grid: #3a3a37; --null: #3987e5; --real: #d95926;
      --good: #199e70; --bad: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 16px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 40px 24px 96px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 22px; margin: 52px 0 14px; padding-top: 20px;
       border-top: 1px solid var(--grid); letter-spacing: -0.01em; }
  h3 { font-size: 17px; margin: 30px 0 8px; }
  p, li { color: var(--ink); max-width: 68ch; }
  .lede { color: var(--ink-2); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 10px;
          padding: 20px 22px; margin: 18px 0; }
  .headline { display: flex; flex-wrap: wrap; gap: 28px; margin: 22px 0 8px; }
  .stat { min-width: 150px; }
  .stat b { display: block; font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; }
  .stat span { color: var(--ink-2); font-size: 14px; }
  .fig { margin: 20px 0 8px; }
  .fig figcaption { margin-bottom: 6px; }
  .fig figcaption b { font-size: 16px; }
  .fig figcaption span { display: block; color: var(--ink-2); font-size: 14px; }
  svg { width: 100%; height: auto; display: block; }
  .tick { fill: var(--ink-2); font-size: 12px; }
  .mark { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .clears { fill: var(--good); } .misses { fill: var(--bad); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid);
           white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--good); font-weight: 600; }
  .no { color: var(--bad); font-weight: 600; }
  .note { border-left: 3px solid var(--real); padding: 2px 0 2px 16px; margin: 18px 0;
          color: var(--ink-2); }
  .note b { color: var(--ink); }
  .fail { border-left: 3px solid var(--bad); padding: 2px 0 2px 16px; margin: 10px 0; }
  .fail b { color: var(--bad); }
  .tier { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px;
          font-weight: 700; border: 1px solid var(--grid); }
  .tier.pass { color: var(--good); } .tier.no { color: var(--bad); }
  a { color: var(--null); }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--grid);
           color: var(--ink-2); font-size: 13px; }
  code { font-size: 0.92em; background: color-mix(in srgb, var(--grid) 40%, transparent);
         padding: 1px 5px; border-radius: 4px; }

  body { margin: 0; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--grid); padding: 14px 24px 0; }
  header h1 { font-size: 19px; margin: 0 0 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select, button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 7px;
                   border: 1px solid var(--grid); background: var(--surface);
                   color: var(--ink); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--null); color: var(--null); }
  button:disabled { opacity: .45; cursor: default; }
  button.go { background: var(--null); border-color: var(--null); color: #fff; }
  .state { color: var(--ink-2); font-size: 13px; }
  .track { height: 6px; border-radius: 3px; background: transparent; margin: 12px 0 4px;
           overflow: hidden; }
  .track.on { background: var(--grid); }
  .fill { height: 100%; width: 0; background: var(--null); transition: width .25s; }
  .run { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2);
         font-size: 13px; min-height: 20px; padding-bottom: 8px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 24px 0; }
  nav button { border-radius: 7px 7px 0 0; border-bottom-color: transparent; }
  nav button.on { background: var(--card); color: var(--null); font-weight: 600;
                  border-color: var(--grid); border-bottom-color: var(--card); }
  main { max-width: 940px; margin: 0 auto; padding: 8px 24px 96px; }
  main > h2:first-child { margin-top: 18px; border-top: 0; padding-top: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
           margin: 18px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>Monte Carlo — __TITLE__</h1>
  <div class="bar">
    <select id="strategy"></select>
    <button class="go" id="all">Analizar todo</button>
    <button id="report">Generar informe</button>
    <span class="state" id="state"></span>
  </div>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
  <div class="run"><span id="stage"></span><span id="counts"></span></div>
</header>
<nav id="tabs"></nav>
<main id="content"></main>
<script>
const TABS = [["verdict", "Veredicto"], ["A", "Familia A"], ["B", "Familia B"],
              ["C", "Familia C"], ["D", "Familia D"], ["E", "Familia E"],
              ["tests", "Explorador de pruebas"]];
const METRICS = [["net", "beneficio neto"], ["dd_pct", "drawdown %"], ["dd", "drawdown $"],
                 ["ret_dd", "Ret/DD"], ["sharpe", "Sharpe"], ["pf", "profit factor"],
                 ["losing_run", "racha perdedora"], ["return_pct", "retorno"]];
let tab = location.hash.slice(1) || "verdict";
let busy = false, runs = [], adhoc = [];
const FIRST = {A: "dd_pct", B: "net", C: "net"};   // what each family is about

const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
    .then(r => r.json());
const strategy = () => $("strategy").value;

function drawTabs() {
  $("tabs").innerHTML = "";
  for (const [key, name] of TABS) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = key === tab ? "on" : "";
    b.onclick = () => { tab = key; location.hash = key; drawTabs(); show(); };
    $("tabs").append(b);
  }
}

async function state() {
  const s = await (await fetch("/api/state")).json();
  const keep = strategy();
  $("strategy").innerHTML = s.strategies.map(x =>
    `<option value="${x.name}">${x.name}${x.saved ? " ·  analizada" : ""}</option>`).join("");
  if (keep) $("strategy").value = keep;
  $("state").textContent = `${s.strategies.length} estrategias · `
    + `${s.n_sims.toLocaleString("es")} simulaciones por prueba · export ${s.export}`;
}

async function show() {
  if (tab === "tests") return showTests();
  $("content").innerHTML = '<p class="lede">Cargando…</p>';
  const r = await (await fetch(
    `/api/section?strategy=${encodeURIComponent(strategy())}&name=${tab}`)).json();
  $("content").innerHTML = r.html;
}

async function showTests() {
  const r = await (await fetch(
    `/api/runs?strategy=${encodeURIComponent(strategy())}`)).json();
  runs = r.runs; adhoc = r.adhoc || [];
  if (!runs.length) {
    $("content").innerHTML = '<div class="note">Esta estrategia todavía no se ha '
      + 'analizado. Pulsa «Analizar todo».</div>';
    return;
  }
  const options = runs.map(x =>
    `<option value="${x.label}">${x.family} · ${x.title}</option>`).join("");
  const metrics = METRICS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  $("content").innerHTML = `
    <h2>Explorador de pruebas</h2>
    <p class="lede">Cada una de las ${runs.length} sub-pruebas que se corrieron, y
      cualquiera de sus ocho estadísticos. Guardado el ${r.saved}
      ${r.stale ? "· <b>con otra configuración</b>" : ""}.</p>
    <div class="tools">
      <select id="pick">${options}</select>
      <select id="metric">${metrics}</select>
      <button id="again">Re-ejecutar esta prueba</button>
      <label class="state"><input type="checkbox" id="useAdhoc"> ver la re-ejecutada</label>
    </div>
    <div id="figure"></div>`;
  $("pick").onchange = () => {
    const now = runs.find(x => x.label === $("pick").value).family;
    if (Object.values(FIRST).includes($("metric").value)) $("metric").value = FIRST[now];
    figure();
  };
  $("metric").onchange = figure;
  $("metric").value = FIRST[runs[0].family];
  $("useAdhoc").onchange = figure;
  $("again").onclick = async () => {
    const r = await post("/api/run", {strategy: strategy(), label: $("pick").value});
    if (r.started) poll();
  };
  figure();
}

async function figure() {
  const source = $("useAdhoc").checked ? "adhoc" : "cache";
  const label = $("pick").value;
  if (source === "adhoc" && !adhoc.includes(label)) {
    $("figure").innerHTML = '<div class="note">Esa prueba no se ha re-ejecutado en esta '
      + 'sesión todavía.</div>';
    return;
  }
  const r = await (await fetch(`/api/figure?strategy=${encodeURIComponent(strategy())}`
    + `&label=${encodeURIComponent(label)}&metric=${$("metric").value}`
    + `&source=${source}`)).json();
  $("figure").innerHTML = r.html;
}

async function poll() {
  busy = true; buttons();
  const s = await (await fetch("/api/status")).json();
  $("fill").style.width = `${(s.share * 100).toFixed(1)}%`;
  $("stage").textContent = s.error ? "falló — mira el terminal" : s.stage;
  $("counts").textContent = s.total
    ? `${s.done.toLocaleString("es")} / ${s.total.toLocaleString("es")}`
      + (s.steps ? ` · prueba ${s.step} de ${s.steps}` : "") : "";
  if (s.running) { setTimeout(poll, 700); return; }
  busy = false; buttons();
  if (s.error) { $("content").innerHTML = `<pre>${s.error}</pre>`; return; }
  if (s.result && s.result.path) $("stage").textContent = `informe escrito en ${s.result.path}`;
  await state(); await show();
}

function buttons() {
  for (const id of ["all", "report"]) $(id).disabled = busy;
  $("track").className = busy ? "track on" : "track";
}

$("strategy").onchange = show;
$("all").onclick = async () => {
  const r = await post("/api/analyse", {strategy: strategy()});
  if (r.started) poll();
};
$("report").onclick = async () => {
  const r = await post("/api/report", {strategy: strategy()});
  if (r.started) poll();
};

drawTabs(); state().then(show);
</script>
</body>
</html>
