<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte Carlo — __TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
    --grid: #d9d8d4; --null: #2a78d6; --real: #eb6834;
    --good: #1baf7a; --bad: #e34948;
    --price: var(--real); --vol: var(--null);
    --vol-low: color-mix(in srgb, var(--ink-2) 9%, transparent);
    --vol-mid: color-mix(in srgb, var(--ink-2) 19%, transparent);
    --vol-high: color-mix(in srgb, var(--ink-2) 31%, transparent);
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #131312; --card: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --grid: #3a3a37; --null: #3987e5; --real: #d95926;
      --good: #199e70; --bad: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 14.5px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 24px 96px; }
  h1 { font-size: 25px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 19px; margin: 38px 0 12px; padding-top: 16px;
       border-top: 1px solid var(--grid); letter-spacing: -0.01em; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  p, li { color: var(--ink); max-width: 68ch; }
  .lede { color: var(--ink-2); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 8px;
          padding: 15px 18px; margin: 14px 0; }
  .headline { display: flex; flex-wrap: wrap; gap: 20px; margin: 18px 0 8px; }
  .stat { min-width: 140px; }
  .stat b { display: block; font: 600 25px/1.2 var(--mono); letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); font-size: 12.5px; }
  .fig { margin: 16px 0 8px; }
  .fig figcaption { margin-bottom: 6px; }
  .fig figcaption b { font-size: 14.5px; }
  .fig figcaption span { display: block; color: var(--ink-2); font-size: 12.5px; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px 16px; margin: 2px 0 12px;
            font-size: 11.5px; color: var(--ink-2); }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { display: inline-block; width: 14px; height: 9px; border-radius: 2px; }
  .legend i[style*="border-top"] { height: 0; margin-top: 5px; border-radius: 0; }
  svg { width: 100%; height: auto; display: block; }
  .tick { fill: var(--ink-2); font: 11px var(--mono); }
  .mark { fill: var(--ink); font: 600 12px var(--mono); }
  .clears { fill: var(--good); } .misses { fill: var(--bad); }
  .series-price, .series-vol { opacity: .68; transition: opacity .12s, stroke-width .12s; }
  .series-price:hover, .series-vol:hover { opacity: 1; stroke-width: 2.5; }
  .scroll { overflow-x: auto; border: 1px solid var(--grid); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 520px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--grid);
           white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 700; font-size: 11.5px; text-transform: uppercase;
       letter-spacing: .03em;
       background: color-mix(in srgb, var(--null) 8%, var(--card)); }
  tr:last-child td { border-bottom: 0; }
  tr:nth-child(even) td { background: color-mix(in srgb, var(--grid) 22%, transparent); }
  tr:hover td { background: color-mix(in srgb, var(--null) 12%, transparent); }
  td:first-child { font-weight: 600; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ok { color: var(--good); font-weight: 700; }
  .no { color: var(--bad); font-weight: 700; }
  .figure-row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .figure-row .fig { flex: 3 1 560px; min-width: 0; }
  .figure-row .scroll { flex: 2 1 420px; }
  .note { border-left: 3px solid var(--real); padding: 2px 0 2px 16px; margin: 18px 0;
          color: var(--ink-2); }
  .note b { color: var(--ink); }
  .fail { border-left: 3px solid var(--bad); padding: 2px 0 2px 16px; margin: 10px 0; }
  .fail b { color: var(--bad); }
  .tier { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px;
          font-weight: 700; border: 1px solid var(--grid); }
  .tier.pass { color: var(--good); } .tier.no { color: var(--bad); }
  a { color: var(--null); }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--grid);
           color: var(--ink-2); font-size: 13px; }
  code { font-size: 0.92em; background: color-mix(in srgb, var(--grid) 40%, transparent);
         padding: 1px 5px; border-radius: 4px; }

  body { margin: 0; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--grid); padding: 10px 24px 0; }
  header h1 { font-size: 16px; margin: 0 0 8px; font-family: var(--mono); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 5px;
                   border: 1px solid var(--grid); background: var(--surface);
                   color: var(--ink); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--null); color: var(--null); }
  button:disabled { opacity: .45; cursor: default; }
  button.go { background: var(--null); border-color: var(--null); color: #fff; }
  .state { color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
  .track { height: 4px; border-radius: 2px; background: transparent; margin: 8px 0 3px;
           overflow: hidden; }
  .track.on { background: var(--grid); }
  .fill { height: 100%; width: 0; background: var(--null); transition: width .25s; }
  .run { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2);
         font-size: 12px; font-family: var(--mono); min-height: 18px; padding-bottom: 6px; }
  nav { display: flex; gap: 3px; flex-wrap: wrap; padding: 8px 24px 0; }
  nav button { border-radius: 5px 5px 0 0; border-bottom-color: transparent; font-size: 12.5px; }
  nav button.on { background: var(--card); color: var(--null); font-weight: 600;
                  border-color: var(--grid); border-bottom-color: var(--card); }
  main { max-width: min(94vw, 1500px); margin: 0 auto; padding: 6px 24px 96px; }
  main > h2:first-child { margin-top: 14px; border-top: 0; padding-top: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           margin: 14px 0 6px; }
  details.config { border-bottom: 1px solid var(--grid); padding: 8px 24px 12px; }
  details.config summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px;
                           font-weight: 600; list-style: none; }
  details.config summary::-webkit-details-marker { display: none; }
  details.config summary::before { content: "▸ "; }
  details.config[open] summary::before { content: "▾ "; }
  .cfg-groups { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px; }
  .cfg-group { min-width: 190px; }
  .cfg-group h4 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase;
                  letter-spacing: .04em; color: var(--ink-2); }
  .cfg-field { display: flex; justify-content: space-between; gap: 8px; align-items: center;
               margin: 3px 0; }
  .cfg-field label { font-size: 12px; color: var(--ink-2); cursor: help;
                     border-bottom: 1px dotted var(--grid); }
  .cfg-field input { width: 108px; font: 12px var(--mono); padding: 3px 6px;
                     border: 1px solid var(--grid); border-radius: 4px;
                     background: var(--surface); color: var(--ink); text-align: right; }
  .cfg-field input.changed { border-color: var(--null); color: var(--null); }
  #cfgReset { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Monte Carlo — __TITLE__</h1>
  <div class="bar">
    <select id="strategy"></select>
    <button class="go" id="all">Analizar todo</button>
    <button id="report">Generar informe</button>
    <span class="state" id="state"></span>
  </div>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
  <div class="run"><span id="stage"></span><span id="counts"></span></div>
</header>
<details class="config" id="cfgDrawer">
  <summary>Configuración de este runeo — valores de fábrica salvo lo que cambies aquí</summary>
  <div class="cfg-groups" id="cfgGroups"></div>
  <button id="cfgReset">Restablecer valores de fábrica</button>
</details>
<nav id="tabs"></nav>
<main id="content"></main>
<script>
const TABS = [["verdict", "Veredicto"], ["A", "Familia A"], ["B", "Familia B"],
              ["C", "Familia C"], ["D", "Familia D"], ["E", "Familia E"],
              ["tests", "Explorador de pruebas"]];
const METRICS = [["net", "Beneficio neto"], ["dd_pct", "Drawdown %"], ["dd", "Drawdown $"],
                 ["ret_dd", "Ret/DD"], ["sharpe", "Sharpe"], ["pf", "Profit factor"],
                 ["losing_run", "Racha perdedora"], ["return_pct", "Retorno"]];
let tab = location.hash.slice(1) || "verdict";
let busy = false, runs = [], adhoc = [];
const FIRST = {A: "dd_pct", B: "net", C: "net"};   // what each family is about

const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
    .then(r => r.json());
const strategy = () => $("strategy").value;
const withOverrides = body => ({...body, cfg: OVERRIDES.cfg, asset: OVERRIDES.asset});
// Every GET that checks freshness needs the drawer's current state too, or a result saved
// under an override reads as stale forever, no matter how many times it is redone.
const overrideQS = () => `&cfg=${encodeURIComponent(JSON.stringify(OVERRIDES.cfg))}`
  + `&asset=${encodeURIComponent(JSON.stringify(OVERRIDES.asset))}`;

// --- Config drawer: every knob of config.yaml plus the asset's cost basis, defaults
// preloaded, editable for one run only. Nothing here is written back to disk.
const GROUPS = {global: "Global", blocks: "Bloques", family_b: "Familia B",
                family_c: "Familia C", family_d: "Familia D", family_e: "Familia E",
                scoring: "Scoring", stability: "Estabilidad", asset: "Coste del activo"};
let DEFAULTS = null, TIPS = {};
const OVERRIDES = {cfg: {}, asset: {}};

function fieldInput(section, path, value, root) {
  const input = document.createElement("input");
  const text = Array.isArray(value) ? JSON.stringify(value) : String(value);
  input.value = text;
  const key = root === "asset" ? path[0] : `${section}.${path.join(".")}`;
  const bucket = root === "asset" ? OVERRIDES.asset : OVERRIDES.cfg;
  input.oninput = () => {
    const changed = input.value !== text;
    input.className = changed ? "changed" : "";
    if (changed) bucket[key] = typeof value === "number" ? Number(input.value) : input.value;
    else delete bucket[key];
  };
  return input;
}

function humanize(parts) {
  const text = parts.map(p => p.replace(/_/g, " ")).join(" ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function tipFor(key) {
  // Falls back toward the parent path — "scoring.weights.A" has no tip of its own, but
  // "scoring.weights" does, and that is still the right sentence for one of its entries.
  let parts = key.split(".");
  while (parts.length) {
    if (TIPS[parts.join(".")]) return TIPS[parts.join(".")];
    parts = parts.slice(0, -1);
  }
  return "";
}

function buildGroup(container, section, node, path, root) {
  for (const [k, v] of Object.entries(node)) {
    if (v !== null && typeof v === "object" && !Array.isArray(v)) {
      buildGroup(container, section, v, [...path, k], root);
      continue;
    }
    const row = document.createElement("div");
    row.className = "cfg-field";
    const label = document.createElement("label");
    label.textContent = humanize([...path, k]);
    const key = root === "asset" ? k : `${section}.${[...path, k].join(".")}`;
    label.title = tipFor(key);
    row.append(label, fieldInput(section, [...path, k], v, root));
    container.append(row);
  }
}

async function loadConfig() {
  DEFAULTS = await (await fetch("/api/config")).json();
  TIPS = DEFAULTS.tips;
  const box = $("cfgGroups");
  box.innerHTML = "";
  for (const [section, label] of Object.entries(GROUPS)) {
    const data = section === "asset" ? DEFAULTS.asset : DEFAULTS.cfg[section];
    if (!data) continue;
    const group = document.createElement("div");
    group.className = "cfg-group";
    group.innerHTML = `<h4>${label}</h4>`;
    buildGroup(group, section, data, [], section === "asset" ? "asset" : "cfg");
    box.append(group);
  }
}

$("cfgReset").onclick = () => { OVERRIDES.cfg = {}; OVERRIDES.asset = {}; loadConfig(); };

function drawTabs() {
  $("tabs").innerHTML = "";
  for (const [key, name] of TABS) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = key === tab ? "on" : "";
    b.onclick = () => { tab = key; location.hash = key; drawTabs(); show(); };
    $("tabs").append(b);
  }
}

async function state() {
  const s = await (await fetch("/api/state")).json();
  const keep = strategy();
  $("strategy").innerHTML = s.strategies.map(x =>
    `<option value="${x.name}">${x.name}${x.saved ? " ·  analizada" : ""}</option>`).join("");
  if (keep) $("strategy").value = keep;
  $("state").textContent = `${s.strategies.length} estrategias · `
    + `${s.n_sims.toLocaleString("es")} simulaciones por prueba · export ${s.export}`;
}

async function show() {
  if (tab === "tests") return showTests();
  $("content").innerHTML = '<p class="lede">Cargando…</p>';
  const r = await (await fetch(
    `/api/section?strategy=${encodeURIComponent(strategy())}&name=${tab}${overrideQS()}`)).json();
  $("content").innerHTML = r.html;
  if (["A", "B", "C"].includes(tab)) await showFamilyPicker(tab);
}

// Every sub-test of this family, any of its eight statistics, right inside the tab — the
// same data the "Explorador de pruebas" tab already offers, pre-filtered so switching tabs
// is not required to see one block size on its own.
async function showFamilyPicker(fam) {
  const r = await (await fetch(
    `/api/runs?strategy=${encodeURIComponent(strategy())}${overrideQS()}`)).json();
  const mine = r.runs.filter(x => x.family === fam);
  if (!mine.length) return;
  const box = document.createElement("div");
  box.innerHTML = `<h3>Cualquier prueba de esta familia, por separado</h3>
    <div class="tools">
      <select id="famPick">${mine.map(x =>
        `<option value="${x.label}">${x.title}</option>`).join("")}</select>
      <select id="famMetric">${METRICS.map(([k, n]) =>
        `<option value="${k}">${n}</option>`).join("")}</select>
    </div>
    <div id="famFigure"></div>`;
  $("content").append(box);
  const draw = async () => {
    const r2 = await (await fetch(`/api/figure?strategy=${encodeURIComponent(strategy())}`
      + `&label=${encodeURIComponent($("famPick").value)}`
      + `&metric=${$("famMetric").value}&source=cache${overrideQS()}`)).json();
    $("famFigure").innerHTML = r2.html;
  };
  $("famPick").onchange = draw;
  $("famMetric").onchange = draw;
  $("famMetric").value = FIRST[fam] || "net";
  draw();
}

async function showTests() {
  const r = await (await fetch(
    `/api/runs?strategy=${encodeURIComponent(strategy())}${overrideQS()}`)).json();
  runs = r.runs; adhoc = r.adhoc || [];
  if (!runs.length) {
    $("content").innerHTML = '<div class="note">Esta estrategia todavía no se ha '
      + 'analizado. Pulsa «Analizar todo».</div>';
    return;
  }
  const options = runs.map(x =>
    `<option value="${x.label}">${x.family} · ${x.title}</option>`).join("");
  const metrics = METRICS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  $("content").innerHTML = `
    <h2>Explorador de pruebas</h2>
    <p class="lede">Cada una de las ${runs.length} sub-pruebas que se corrieron, y
      cualquiera de sus ocho estadísticos. Guardado el ${r.saved}
      ${r.stale ? "· <b>con otra configuración</b>" : ""}.</p>
    <div class="tools">
      <select id="pick">${options}</select>
      <select id="metric">${metrics}</select>
      <button id="again">Re-ejecutar esta prueba</button>
      <label class="state"><input type="checkbox" id="useAdhoc"> ver la re-ejecutada</label>
    </div>
    <div id="figure"></div>`;
  $("pick").onchange = () => {
    const now = runs.find(x => x.label === $("pick").value).family;
    if (Object.values(FIRST).includes($("metric").value)) $("metric").value = FIRST[now];
    figure();
  };
  $("metric").onchange = figure;
  $("metric").value = FIRST[runs[0].family];
  $("useAdhoc").onchange = figure;
  $("again").onclick = async () => {
    const r = await post("/api/run", withOverrides({strategy: strategy(),
                                                     label: $("pick").value}));
    if (r.started) poll();
  };
  figure();
}

async function figure() {
  const source = $("useAdhoc").checked ? "adhoc" : "cache";
  const label = $("pick").value;
  if (source === "adhoc" && !adhoc.includes(label)) {
    $("figure").innerHTML = '<div class="note">Esa prueba no se ha re-ejecutado en esta '
      + 'sesión todavía.</div>';
    return;
  }
  const r = await (await fetch(`/api/figure?strategy=${encodeURIComponent(strategy())}`
    + `&label=${encodeURIComponent(label)}&metric=${$("metric").value}`
    + `&source=${source}${overrideQS()}`)).json();
  $("figure").innerHTML = r.html;
}

async function poll() {
  busy = true; buttons();
  const s = await (await fetch("/api/status")).json();
  $("fill").style.width = `${(s.share * 100).toFixed(1)}%`;
  $("stage").textContent = s.error ? "falló — mira el terminal" : s.stage;
  $("counts").textContent = s.total
    ? `${s.done.toLocaleString("es")} / ${s.total.toLocaleString("es")}`
      + (s.steps ? ` · prueba ${s.step} de ${s.steps}` : "") : "";
  if (s.running) { setTimeout(poll, 700); return; }
  busy = false; buttons();
  if (s.error) { $("content").innerHTML = `<pre>${s.error}</pre>`; return; }
  if (s.result && s.result.path) $("stage").textContent = `informe escrito en ${s.result.path}`;
  await state(); await show();
}

function buttons() {
  for (const id of ["all", "report"]) $(id).disabled = busy;
  $("track").className = busy ? "track on" : "track";
}

$("strategy").onchange = show;
$("all").onclick = async () => {
  const r = await post("/api/analyse", withOverrides({strategy: strategy()}));
  if (r.started) poll();
};
$("report").onclick = async () => {
  const r = await post("/api/report", withOverrides({strategy: strategy()}));
  if (r.started) poll();
};

drawTabs(); loadConfig(); state().then(show);
</script>
</body>
</html>
