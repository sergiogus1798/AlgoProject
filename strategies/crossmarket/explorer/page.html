<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-market — __TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
    --grid: #d9d8d4; --null: #2a78d6; --real: #eb6834;
    --good: #1baf7a; --bad: #e34948;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #131312; --card: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --grid: #3a3a37; --null: #3987e5; --real: #d95926;
      --good: #199e70; --bad: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 14.5px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 8px; font-family: var(--mono); font-weight: 600; }
  h2 { font-size: 19px; margin: 38px 0 12px; padding-top: 16px;
       border-top: 1px solid var(--grid); letter-spacing: -0.01em; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .lede { color: var(--ink-2); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 8px;
          padding: 15px 18px; margin: 14px 0; }
  .headline { display: flex; flex-wrap: wrap; gap: 20px; margin: 18px 0 8px; }
  .stat { min-width: 140px; }
  .stat b { display: block; font: 600 25px/1.2 var(--mono); letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); font-size: 12.5px; }
  .fig { margin: 16px 0 8px; }
  .fig figcaption { margin-bottom: 6px; }
  .fig figcaption b { font-size: 14.5px; }
  .fig figcaption span { display: block; color: var(--ink-2); font-size: 12.5px; }
  svg { width: 100%; height: auto; display: block; }
  .tick { fill: var(--ink-2); font: 11px var(--mono); }
  .mark { fill: var(--ink); font: 600 12px var(--mono); }
  .clears { fill: var(--good); } .misses { fill: var(--bad); }
  .scroll { overflow-x: auto; border: 1px solid var(--grid); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 520px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--grid);
           white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 700; font-size: 11.5px; text-transform: uppercase;
       letter-spacing: .03em;
       background: color-mix(in srgb, var(--null) 8%, var(--card)); }
  tr:last-child td { border-bottom: 0; }
  tr:nth-child(even) td { background: color-mix(in srgb, var(--grid) 22%, transparent); }
  td:first-child { font-weight: 600; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ok { color: var(--good); font-weight: 700; }
  .no { color: var(--bad); font-weight: 700; }
  .figure-row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .note { border-left: 3px solid var(--real); padding: 2px 0 2px 16px; margin: 18px 0;
          color: var(--ink-2); }
  .note b { color: var(--ink); }
  .fail { border-left: 3px solid var(--bad); padding: 2px 0 2px 16px; margin: 10px 0; }
  .fail b { color: var(--bad); }
  a { color: var(--null); }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--grid);
           color: var(--ink-2); font-size: 13px; }
  code { font-size: 0.92em; background: color-mix(in srgb, var(--grid) 40%, transparent);
         padding: 1px 5px; border-radius: 4px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--grid); padding: 10px 24px 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button, input { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 5px;
                          border: 1px solid var(--grid); background: var(--surface);
                          color: var(--ink); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--null); color: var(--null); }
  button:disabled { opacity: .45; cursor: default; }
  button.go { background: var(--null); border-color: var(--null); color: #fff; }
  .state { color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
  .track { height: 4px; border-radius: 2px; background: transparent; margin: 8px 0 3px;
           overflow: hidden; }
  .track.on { background: var(--grid); }
  .fill { height: 100%; width: 0; background: var(--null); transition: width .25s; }
  .run { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2);
         font-size: 12px; font-family: var(--mono); min-height: 18px; padding-bottom: 6px; }
  nav { display: flex; gap: 3px; flex-wrap: wrap; padding: 8px 24px 0; }
  nav button { border-radius: 5px 5px 0 0; border-bottom-color: transparent; font-size: 12.5px; }
  nav button.on { background: var(--card); color: var(--null); font-weight: 600;
                  border-color: var(--grid); border-bottom-color: var(--card); }
  main { max-width: min(94vw, 1500px); margin: 0 auto; padding: 6px 24px 96px; }
  main > h2:first-child { margin-top: 14px; border-top: 0; padding-top: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           margin: 14px 0 6px; }
  details.config { border-bottom: 1px solid var(--grid); padding: 8px 24px 12px; }
  details.config summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px;
                           font-weight: 600; list-style: none; }
  details.config summary::-webkit-details-marker { display: none; }
  details.config summary::before { content: "▸ "; }
  details.config[open] summary::before { content: "▾ "; }
  .cfg-group { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 10px; }
  .cfg-field { display: flex; justify-content: space-between; gap: 8px; align-items: center;
               margin: 3px 0; min-width: 190px; }
  .cfg-field label { font-size: 12px; color: var(--ink-2); }
  .cfg-field input { width: 150px; font: 12px var(--mono); padding: 3px 6px;
                     border: 1px solid var(--grid); border-radius: 4px;
                     background: var(--surface); color: var(--ink); text-align: right; }
  .cfg-field input.changed { border-color: var(--null); color: var(--null); }
  #cfgReset { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Cross-market — __TITLE__</h1>
  <div class="bar">
    <select id="strategy"></select>
    <button class="go" id="analyse">Analizar esta estrategia</button>
    <button id="all">Analizar toda la base de datos</button>
    <button id="report">Generar informe</button>
    <span class="state" id="state"></span>
  </div>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
  <div class="run"><span id="stage"></span><span id="counts"></span></div>
</header>
<details class="config" id="cfgDrawer">
  <summary>Configuración de este runeo — valores de fábrica salvo lo que cambies aquí</summary>
  <div class="cfg-group" id="cfgGroup"></div>
  <button id="cfgReset">Restablecer valores de fábrica</button>
</details>
<div id="dbSummary"></div>
<nav id="tabs"></nav>
<main id="content"></main>
<script>
const TABS = [["verdict", "Veredicto"], ["exposure", "Exposición"],
              ["significance", "Significancia"], ["fingerprint", "Huella"],
              ["cost", "Coste"], ["correlation", "Correlación"],
              ["tests", "Explorador de pruebas"]];
let tab = location.hash.slice(1) || "verdict";
let busy = false, marketsList = [], models = [], adhoc = [];

const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
    .then(r => r.json());
const strategy = () => $("strategy").value;
const withCfg = body => ({...body, cfg: OVERRIDES});

// --- Config drawer: every knob the panel exposes, defaults preloaded, editable for one run
// only. Nothing here is written back to disk.
let DEFAULTS = null;
const OVERRIDES = {};

function fieldInput(key, value) {
  const input = document.createElement("input");
  const text = Array.isArray(value) ? JSON.stringify(value) : String(value);
  input.value = text;
  input.oninput = () => {
    const changed = input.value !== text;
    input.className = changed ? "changed" : "";
    if (!changed) { delete OVERRIDES[key]; return; }
    if (Array.isArray(value)) OVERRIDES[key] = JSON.parse(input.value);
    else if (typeof value === "number") OVERRIDES[key] = Number(input.value);
    else OVERRIDES[key] = input.value;
  };
  return input;
}

function humanize(key) {
  const text = key.replace(/_/g, " ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

async function loadConfig() {
  DEFAULTS = await (await fetch("/api/config")).json();
  models = DEFAULTS.models;
  const box = $("cfgGroup");
  box.innerHTML = "";
  for (const [key, value] of Object.entries(DEFAULTS)) {
    const row = document.createElement("div");
    row.className = "cfg-field";
    const label = document.createElement("label");
    label.textContent = humanize(key);
    row.append(label, fieldInput(key, value));
    box.append(row);
  }
}

$("cfgReset").onclick = () => { for (const k in OVERRIDES) delete OVERRIDES[k]; loadConfig(); };

function drawTabs() {
  $("tabs").innerHTML = "";
  for (const [key, name] of TABS) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = key === tab ? "on" : "";
    b.onclick = () => { tab = key; location.hash = key; drawTabs(); show(); };
    $("tabs").append(b);
  }
}

function drawDatabase(db) {
  if (!db || !db.table || !db.table.length) {
    $("dbSummary").innerHTML = '<p class="lede" style="padding:0 24px">'
      + 'Todavía no se ha analizado la base de datos completa.</p>';
    return;
  }
  $("dbSummary").innerHTML = `<div class="headline" style="padding:0 24px">
    <div class="stat"><b>${db.table.length}</b><span>estrategias</span></div>
    <div class="stat"><b>${db.kept}</b><span>MANTENER, frente a ${db.luck.correlated.toFixed(1)}
      esperadas por suerte</span></div></div>`;
}

async function state() {
  const s = await (await fetch("/api/state")).json();
  const keep = strategy();
  $("strategy").innerHTML = s.strategies.map(x =>
    `<option value="${x.name}">${x.name}${x.saved ? " · analizada" : ""}</option>`).join("");
  if (keep) $("strategy").value = keep;
  $("state").textContent = `${s.strategies.length} estrategias · export ${s.export}`;
  drawDatabase(s.database);
}

async function show() {
  if (tab === "tests") return showTests();
  $("content").innerHTML = '<p class="lede">Cargando…</p>';
  const r = await (await fetch(
    `/api/section?strategy=${encodeURIComponent(strategy())}&name=${tab}`)).json();
  $("content").innerHTML = r.html;
}

async function showTests() {
  const r = await (await fetch(
    `/api/runs?strategy=${encodeURIComponent(strategy())}`)).json();
  marketsList = r.markets; adhoc = r.adhoc || [];
  if (!marketsList.length) {
    $("content").innerHTML = '<div class="note">Esta estrategia todavía no se ha '
      + 'analizado. Pulsa «Analizar esta estrategia».</div>';
    return;
  }
  const marketOpts = marketsList.map(m => `<option value="${m}">${m}</option>`).join("");
  const modelOpts = models.map(m => `<option value="${m}">${m}</option>`).join("");
  $("content").innerHTML = `
    <h2>Explorador de pruebas</h2>
    <p class="lede">Cualquier mercado por cualquier modelo de aleatorización. Guardado el
      ${r.saved} ${r.stale ? "· <b>con otra configuración</b>" : ""}.</p>
    <div class="tools">
      <select id="pickMarket">${marketOpts}</select>
      <select id="pickModel">${modelOpts}</select>
      <input id="reDraws" type="number" value="5000" style="width:90px">
      <button id="again">Re-ejecutar esta prueba</button>
      <label class="state"><input type="checkbox" id="useAdhoc"> ver la re-ejecutada</label>
    </div>
    <div id="figure"></div>`;
  $("pickMarket").onchange = figure;
  $("pickModel").onchange = figure;
  $("useAdhoc").onchange = figure;
  $("again").onclick = async () => {
    const r = await post("/api/run", withCfg({strategy: strategy(),
      market: $("pickMarket").value, model: $("pickModel").value,
      draws: Number($("reDraws").value)}));
    if (r.started) poll();
  };
  figure();
}

async function figure() {
  const market = $("pickMarket").value, model = $("pickModel").value;
  const source = $("useAdhoc").checked ? "adhoc" : "cache";
  if (source === "adhoc" && !adhoc.includes(`${market}|${model}`)) {
    $("figure").innerHTML = '<div class="note">Ese par no se ha re-ejecutado en esta sesión '
      + 'todavía.</div>';
    return;
  }
  const r = await (await fetch(`/api/figure?strategy=${encodeURIComponent(strategy())}`
    + `&market=${encodeURIComponent(market)}&model=${encodeURIComponent(model)}`
    + `&source=${source}`)).json();
  $("figure").innerHTML = r.html;
}

async function poll() {
  busy = true; buttons();
  const s = await (await fetch("/api/status")).json();
  $("fill").style.width = `${(s.share * 100).toFixed(1)}%`;
  $("stage").textContent = s.error ? "falló — mira el terminal" : s.stage;
  $("counts").textContent = s.steps ? `paso ${s.step} de ${s.steps}` : "";
  if (s.running) { setTimeout(poll, 700); return; }
  busy = false; buttons();
  if (s.error) { $("content").innerHTML = `<pre>${s.error}</pre>`; return; }
  if (s.result && s.result.path) $("stage").textContent = `informe escrito en ${s.result.path}`;
  await state(); await show();
}

function buttons() {
  for (const id of ["analyse", "all", "report"]) $(id).disabled = busy;
  $("track").className = busy ? "track on" : "track";
}

$("strategy").onchange = show;
$("analyse").onclick = async () => {
  const r = await post("/api/analyse", withCfg({strategy: strategy()}));
  if (r.started) poll();
};
$("all").onclick = async () => {
  const r = await post("/api/analyse_all", withCfg({}));
  if (r.started) poll();
};
$("report").onclick = async () => {
  const r = await post("/api/report", withCfg({}));
  if (r.started) poll();
};

drawTabs(); loadConfig(); state().then(show);
</script>
</body>
</html>
