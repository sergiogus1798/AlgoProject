<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-market — __TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
    --grid: #d9d8d4; --null: #2a78d6; --real: #eb6834;
    --good: #1baf7a; --bad: #e34948;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #131312; --card: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --grid: #3a3a37; --null: #3987e5; --real: #d95926;
      --good: #199e70; --bad: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 14.5px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 8px; font-family: var(--mono); font-weight: 600; }
  h2 { font-size: 19px; margin: 38px 0 12px; padding-top: 16px;
       border-top: 1px solid var(--grid); letter-spacing: -0.01em; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .lede { color: var(--ink-2); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 8px;
          padding: 15px 18px; margin: 14px 0; }
  .headline { display: flex; flex-wrap: wrap; gap: 20px; margin: 18px 0 8px; }
  .stat { min-width: 140px; }
  .stat b { display: block; font: 600 25px/1.2 var(--mono); letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); font-size: 12.5px; }
  .fig { margin: 16px 0 8px; max-width: 1100px; }
  .fig figcaption { margin-bottom: 6px; }
  .fig figcaption b { font-size: 14.5px; }
  .fig figcaption span { display: block; color: var(--ink-2); font-size: 12.5px; }
  svg { width: 100%; height: auto; display: block; }
  .tick { fill: var(--ink-2); font: 11px var(--mono); }
  .mark { fill: var(--ink); font: 600 12px var(--mono); }
  .clears { fill: var(--good); } .misses { fill: var(--bad); }
  .scroll { overflow-x: auto; border: 1px solid var(--grid); border-radius: 8px;
            margin: 10px 0 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 520px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--grid);
           white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 700; font-size: 11.5px; text-transform: uppercase;
       letter-spacing: .03em;
       background: color-mix(in srgb, var(--null) 8%, var(--card)); }
  tr:last-child td { border-bottom: 0; }
  tr:nth-child(even) td { background: color-mix(in srgb, var(--grid) 22%, transparent); }
  td:first-child { font-weight: 600; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ok { color: var(--good); font-weight: 700; }
  .no { color: var(--bad); font-weight: 700; }
  .figure-row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .note { border-left: 3px solid var(--real); padding: 2px 0 2px 16px; margin: 18px 0;
          color: var(--ink-2); }
  .note b { color: var(--ink); }
  .fail { border-left: 3px solid var(--bad); padding: 2px 0 2px 16px; margin: 10px 0; }
  .fail b { color: var(--bad); }
  a { color: var(--null); }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--grid);
           color: var(--ink-2); font-size: 13px; }
  code { font-size: 0.92em; background: color-mix(in srgb, var(--grid) 40%, transparent);
         padding: 1px 5px; border-radius: 4px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--grid); padding: 10px 24px 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button, input { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 5px;
                          border: 1px solid var(--grid); background: var(--surface);
                          color: var(--ink); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--null); color: var(--null); }
  button:disabled { opacity: .45; cursor: default; }
  button.go { background: var(--null); border-color: var(--null); color: #fff; }
  .state { color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
  .track { height: 4px; border-radius: 2px; background: transparent; margin: 8px 0 3px;
           overflow: hidden; }
  .track.on { background: var(--grid); }
  .fill { height: 100%; width: 0; background: var(--null); transition: width .25s; }
  .run { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2);
         font-size: 12px; font-family: var(--mono); min-height: 18px; padding-bottom: 6px; }
  nav { display: flex; gap: 3px; flex-wrap: wrap; padding: 8px 24px 0; }
  nav button { border-radius: 5px 5px 0 0; border-bottom-color: transparent; font-size: 12.5px; }
  nav button.on { background: var(--card); color: var(--null); font-weight: 600;
                  border-color: var(--grid); border-bottom-color: var(--card); }
  main { max-width: min(98vw, 2100px); margin: 0 auto; padding: 6px 28px 96px; }
  .subtabs { display: flex; gap: 3px; flex-wrap: wrap; margin: 14px 0 0;
             border-bottom: 1px solid var(--grid); }
  .subtabs button { border: 1px solid transparent; border-bottom: 0; border-radius: 5px 5px 0 0;
                    background: transparent; font-size: 12.5px; padding: 4px 11px; }
  .subtabs button.on { background: var(--card); border-color: var(--grid);
                       color: var(--null); font-weight: 600; }
  .subtabs.sub2 { border-bottom: 0; margin: 6px 0 0; }
  .subtabs.sub2 button { border-radius: 14px; border-color: var(--grid); font-size: 12px;
                         padding: 3px 12px; }
  .subtabs.sub2 button.on { background: var(--null); border-color: var(--null); color: #fff; }
  .pair { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .pair > .fig { flex: 1 1 560px; max-width: 900px; }
  .pair > div { flex: 1 1 380px; max-width: 620px; }
  .pair > div > .fig { max-width: 620px; margin-top: 0; }
  .chip-pass, .chip-fail { display: inline-block; padding: 1px 8px; border-radius: 10px;
      font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip-pass { background: color-mix(in srgb, #1baf7a 22%, transparent); color: #0c6e4c; }
  .chip-fail { background: color-mix(in srgb, #e34948 20%, transparent); color: #a02020; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip-pass { color: #6fe3b6; }
    :root:not([data-theme="light"]) .chip-fail { color: #ff9a9a; }
  }
  .scroll.mini { margin: 6px 0 8px; max-width: 420px; }
  .scroll.mini table { min-width: 0; font-size: 12px; }
  .scroll.mini th, .scroll.mini td { padding: 4px 10px; }
  .scroll.mini .real { color: var(--real); font-weight: 700; }
  .beats { margin: 2px 0 0; padding: 8px 12px; border-radius: 6px; font-size: 13px;
           background: color-mix(in srgb, var(--real) 10%, transparent);
           border-left: 3px solid var(--real); }
  .beats b { font: 600 17px/1 var(--mono); }
  .model { margin: 18px 0 22px; padding-left: 14px; border-left: 3px solid var(--grid); }
  .model h3 { margin: 0 0 2px; }
  .model p { margin: 4px 0; max-width: 78ch; }
  .tagline { font: 400 11.5px var(--mono); color: var(--real); }
  .tools label { font-size: 12px; color: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 2px 0 10px;
            color: var(--ink-2); font-size: 12px; }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  .hint { color: var(--ink-2); font-weight: 400; font-size: 11.5px; }
  .markets { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }
  .mkt { display: flex; align-items: center; gap: 8px; border: 1px solid var(--grid);
         border-radius: 6px; padding: 4px 6px 4px 10px; background: var(--surface);
         font: 12px var(--mono); }
  .mkt.none { opacity: .5; }
  .mkt .cat { color: var(--ink-2); font-size: 11px; }
  .mkt .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grid); }
  .mkt.done .dot { background: var(--good); }
  main > h2:first-child { margin-top: 14px; border-top: 0; padding-top: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           margin: 14px 0 6px; }
  details.config { border-bottom: 1px solid var(--grid); padding: 8px 24px 12px; }
  details.config summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px;
                           font-weight: 600; list-style: none; }
  details.config summary::-webkit-details-marker { display: none; }
  details.config summary::before { content: "▸ "; }
  details.config[open] summary::before { content: "▾ "; }
  .cfg-group { margin-top: 10px; columns: 4 250px; column-gap: 26px; }
  .cfg-section { break-inside: avoid; margin: 0 0 14px; }
  .cfg-section h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--ink-2); }
  ul.warn { margin: 4px 0 12px 18px; }
  ul.warn li { margin: 2px 0; }
  .cfg-field { display: flex; justify-content: space-between; gap: 8px; align-items: center;
               margin: 2px 0; }
  .cfg-field label { font-size: 11.5px; color: var(--ink-2); cursor: help; }
  .cfg-field input { width: 96px; font: 11.5px var(--mono); padding: 2px 5px;
                     border: 1px solid var(--grid); border-radius: 4px;
                     background: var(--surface); color: var(--ink); text-align: right; }
  .cfg-field input.changed { border-color: var(--null); color: var(--null); }
  #cfgReset { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Cross-market — __TITLE__</h1>
  <div class="bar">
    <select id="strategy"></select>
    <button class="go" id="analyse">Run analysis</button>
    <span class="state" id="state"></span>
  </div>
  <div class="markets" id="markets"></div>
  <div class="track" id="track"><div class="fill" id="fill"></div></div>
  <div class="run"><span id="stage"></span><span id="counts"></span></div>
</header>

<details class="config" id="cfgDrawer">
  <summary>Configuración — todos los parámetros del módulo, para la próxima ejecución</summary>
  <div class="cfg-group" id="cfgGroup"></div>
  <button id="cfgReset">Restablecer valores de fábrica</button>
</details>

<nav id="tabs"></nav>
<main id="content"></main>

<script>
let TABS = [];
let tab = location.hash.slice(1) || "summary";
let busy = false, markets = [];

const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
    .then(r => r.json());
const strategy = () => $("strategy").value;

// --- Config drawer: every knob of config.yaml, grouped, defaults preloaded, editable for
// one run only. Nothing here is written back to disk.
let DEFAULTS = null;
const OVERRIDES = {};

function fieldInput(key, value) {
  const input = document.createElement("input");
  const text = Array.isArray(value) ? JSON.stringify(value) : String(value);
  input.value = text;
  input.oninput = () => {
    const changed = input.value !== text;
    input.className = changed ? "changed" : "";
    if (!changed) { delete OVERRIDES[key]; return; }
    if (Array.isArray(value)) { try { OVERRIDES[key] = JSON.parse(input.value); } catch (e) {} }
    else if (typeof value === "number") OVERRIDES[key] = Number(input.value);
    else if (typeof value === "boolean") OVERRIDES[key] = input.value === "true";
    else OVERRIDES[key] = input.value;
  };
  return input;
}

function humanize(key) {
  const text = key.replace(/_/g, " ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

async function loadConfig() {
  const got = await (await fetch("/api/config")).json();
  DEFAULTS = got.cfg;
  const box = $("cfgGroup");
  box.innerHTML = "";
  const bySection = {};
  for (const key of Object.keys(DEFAULTS)) {
    const [section] = key.split(".");
    (bySection[section] = bySection[section] || []).push(key);
  }
  for (const [section, keys] of Object.entries(bySection)) {
    const group = document.createElement("div");
    group.className = "cfg-section";
    const title = document.createElement("h4");
    title.textContent = got.groups[section] || section;
    group.append(title);
    for (const key of keys) {
      const row = document.createElement("div");
      row.className = "cfg-field";
      const label = document.createElement("label");
      label.textContent = humanize(key.split(".")[1]);
      label.title = got.tips[key] || "";
      row.append(label, fieldInput(key, DEFAULTS[key]));
      group.append(row);
    }
    box.append(group);
  }
}

$("cfgReset").onclick = () => { for (const k in OVERRIDES) delete OVERRIDES[k]; loadConfig(); };

function drawTabs() {
  $("tabs").innerHTML = "";
  for (const [key, name] of TABS) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = key === tab ? "on" : "";
    b.onclick = () => { tab = key; location.hash = key; drawTabs(); show(); };
    $("tabs").append(b);
  }
}

// The market list is per strategy: a market this one never traded on has no file at all,
// and that is a result about the strategy, not a gap to hide.
async function drawMarkets() {
  const r = await (await fetch(
    `/api/markets?strategy=${encodeURIComponent(strategy())}`)).json();
  markets = r.markets;
  $("markets").innerHTML = "";
  for (const m of markets) {
    const box = document.createElement("div");
    const done = r.analysed.includes(m.feed);
    box.className = "mkt" + (m.traded ? (done ? " done" : "") : " none");
    box.innerHTML = `<span class="dot"></span><span>${m.feed}</span>`
      + `<span class="cat">${m.category}</span>`;
    if (m.traded) {
      const b = document.createElement("button");
      b.textContent = "run";
      b.onclick = () => launch(m.feed);
      b.disabled = busy;
      box.append(b);
    } else {
      box.append(Object.assign(document.createElement("span"),
        {className: "cat", textContent: "sin operaciones"}));
    }
    $("markets").append(box);
  }
}

async function state() {
  const s = await (await fetch("/api/state")).json();
  TABS = s.tabs;
  const keep = strategy();
  $("strategy").innerHTML = s.strategies.map(n =>
    `<option value="${n}">${n}${s.done.includes(n) ? " · analizada" : ""}</option>`).join("");
  if (keep) $("strategy").value = keep;
  $("state").textContent = `${s.strategies.length} estrategias · export ${s.export}`;
  drawTabs();
  await drawMarkets();
}

async function show() {
  $("content").innerHTML = '<p class="lede">Cargando…</p>';
  const r = await (await fetch(
    `/api/section?strategy=${encodeURIComponent(strategy())}&name=${tab}`)).json();
  $("content").innerHTML = r.html;
  if (tab === "random") await wireRandom();
  if (tab === "models") await wireModels();
}

// The Modelos tab compares the same p across the null models; which statistic that p is for
// is the dropdown's job. The options are rendered server-side with the shell, so this only
// has to wire the change and fetch the charts.
let modelMetric = "mean_r";

async function wireModels() {
  const sel = $("modelMetric");
  if (!sel) return;
  sel.value = modelMetric;
  if (sel.value !== modelMetric) modelMetric = sel.value;
  sel.onchange = () => { modelMetric = sel.value; drawModels(); };
  await drawModels();
}

async function drawModels() {
  $("modelsView").innerHTML = '<p class="lede">Dibujando…</p>';
  const q = new URLSearchParams({strategy: strategy(), metric: modelMetric});
  const r = await (await fetch(`/api/models/view?${q}`)).json();
  $("modelsView").innerHTML = r.html;
}

// --- The random-entry tab has three selectors: market, null model, statistic. All of its
// results were computed by the run and are held in memory, so switching any of them only
// asks the server to render figures it already has.
let axes = {markets: [], models: [], metrics: []};
let pick = {market: null, model: null, metric: "net"};

function subtabs(box, items, key, current) {
  box.innerHTML = "";
  for (const it of items) {
    const b = document.createElement("button");
    b.textContent = it.name;
    b.className = it.key === current ? "on" : "";
    b.onclick = () => { pick[key] = it.key; drawRandom(); };
    box.append(b);
  }
}

async function wireRandom() {
  axes = await (await fetch(
    `/api/random?strategy=${encodeURIComponent(strategy())}`)).json();
  if (!axes.markets.length) return;
  if (!axes.markets.includes(pick.market)) pick.market = axes.markets[0];
  if (!axes.models.some(m => m.key === pick.model)) pick.model = axes.models[0].key;
  if (!axes.metrics.some(m => m.key === pick.metric)) pick.metric = axes.metrics[0].key;
  $("metricPick").innerHTML = axes.metrics.map(m =>
    `<option value="${m.key}">${m.label}</option>`).join("");
  $("metricPick").value = pick.metric;
  $("metricPick").onchange = () => { pick.metric = $("metricPick").value; drawRandom(); };
  drawRandom();
}

async function drawRandom() {
  subtabs($("mkTabs"), axes.markets.map(m => ({key: m, name: m})), "market", pick.market);
  subtabs($("mdTabs"), axes.models, "model", pick.model);
  $("randomView").innerHTML = '<p class="lede">Dibujando…</p>';
  const q = new URLSearchParams({strategy: strategy(), market: pick.market,
                                model: pick.model, metric: pick.metric});
  const r = await (await fetch(`/api/random/view?${q}`)).json();
  $("randomView").innerHTML = r.html;
}

async function launch(market) {
  const r = await post("/api/analyse",
    {strategy: strategy(), market: market || null, cfg: OVERRIDES});
  if (r.started) poll();
}

async function poll() {
  busy = true; buttons();
  const s = await (await fetch("/api/status")).json();
  $("fill").style.width = `${(s.share * 100).toFixed(1)}%`;
  $("stage").textContent = s.error ? "falló — mira el terminal" : s.stage;
  $("counts").textContent = s.running ? `${(s.share * 100).toFixed(0)}%` : "";
  if (s.running) { setTimeout(poll, 400); return; }
  busy = false; buttons();
  if (s.error) { $("content").innerHTML = `<pre>${s.error}</pre>`; return; }
  await state(); await show();
}

function buttons() {
  $("analyse").disabled = busy;
  $("track").className = busy ? "track on" : "track";
  for (const b of $("markets").querySelectorAll("button")) b.disabled = busy;
}

$("strategy").onchange = async () => { await drawMarkets(); show(); };
$("analyse").onclick = () => launch(null);

loadConfig(); state().then(show);
</script>
</body>
</html>
