# Every tunable of the cross-market study, in one place. Nothing below is hidden in code.
# Override any of these on the command line with --set key=value (dotted keys), or from the
# panel's config drawer for one run.
#
# There are no acceptance thresholds here and no verdict. This study reports numbers and the
# reasons to distrust them; which strategy to keep is the owner's call, made outside it.

nulls:
  draws: 25000                # random runs **per market and per model**; the smallest p observable is 1/(draws+1)
  seed: 20260908              # fixed and shared across markets, so one draw is one displacement everywhere
  block_months: 6             # regime blocks; six months keeps enough trades in each to move them
  models: [segment_permute, resampled_holds, fitted_holds, block_shift]
  headline: block_shift       # the model whose p the summary table reports; it is
                              # the only one that changes exactly one thing, so it is
                              # the only one whose low p is attributable to timing
  replicate_friday: true      # a hold truncated by the Friday close is re-truncated at its new placement
  min_hold: 1                 # a trade that opens and closes on the same bar is not a trade
  chunk: 500                  # random runs priced per batch; memory, not statistics

sweep:                        # the window sweep of the free-placement models
  windows: [full, 3y, 1y, 6m] # block sizes, "Nm" or "Ny"; "full" is one block, the model as it runs
  models: [segment_permute, resampled_holds, fitted_holds]   # block_shift already fixes the regime
  reference: block_shift      # the model whose p is drawn flat across every sweep chart
  min_months: 6               # a window shorter than this is not computed at all
  min_trades: 10              # a block with fewer real trades than this is weak
  min_free_share: 0.25        # a block with less than this share of its bars free is weak
  max_weak_share: 0.10        # a window whose weak blocks hold more of the trades is withheld
  evidence_drop: 1.0          # orders of magnitude p must climb, widest to narrowest, to read "regime"

joint:                        # the joint null over the out-of-sample markets
  pool: mean_r                # "mean_r" averages the raw statistic, "z" each market's own
                              # standardised one; use z only when one market's null spread is
                              # several times another's, or it decides the verdict alone

strata:                       # regime_strata only, which runs when nulls.models lists it
  atr_bins: 5                 # volatility quantiles the bars are split into
  trend_bars: 8               # bars over which the sign of the trend is read

equity:
  starting: 100000.0          # account the additive equity path starts from, in USD
  steps: 200                  # points per curve; an SVG cannot show more
  bands: [2.5, 25.0, 50.0, 75.0, 97.5]     # percentile cone drawn around the real curve
  risk_target_dd: 0.10        # every market rescaled to this max drawdown, to compare returns at equal risk
  percentiles: [2.5, 5.0, 25.0, 50.0, 75.0, 95.0, 97.5]   # reported in the metric tables

bootstrap:
  draws: 2000                 # block-bootstrap draws for every confidence interval
  block: 5                    # trades per block; bars inside a trade are autocorrelated
  ci: [5.0, 95.0]             # percentiles reported as the interval

exposure:
  mu_min_t: 2.0               # |t| of the market's own drift below which E is flagged as meaningless
  drop_zero_mfe: true         # a trade with MFE = 0 has an undefined capture ratio, not an infinite one
  bar_block: 500              # bars per block of the paired bootstrap E's Fieller interval is built from

paired:
  alternative: greater        # one-sided: the strategy's trades beat a passive long on the same bars
  reference: 3                # half-width in MONTHS of the centered reference window, or `block`
  sensitivity: [3, 6, 12, block]   # every reference the test is also run under, and reported beside it

portfolio:
  block_weeks: 4              # calendar block the combined account is resampled in whole
  draws: 2000                 # resamples and reorderings of the combined account
  order_block: 10             # trades per block of the reordering, from monteCarlo.model.draws

stress:
  cost_multiples: [1.0, 1.5, 2.0, 2.5, 3.0]
  bar_shift: 1                # bars entries and exits are moved by, to see the decay
  slippage_fractions: [0.1, 0.25, 0.5]     # share of the bar's range given back at both ends
  sims: 25000                 # runs of the cost-and-fill stress; the nulls' own count, so the p resolves as finely
  calibrate: true             # take cost_shock and fill_depth from execution.yaml where the feed is declared
  p_skip: 0.05                # chance each trade is simply missed
  cost_shock: [1.0, 2.0]      # cost multiple drawn per run, uniform between these
  fill_frac: 0.15             # share of trades filled worse
  fill_depth: 0.25            # fraction of the trade's own adverse excursion given back

diagnostics:
  alpha: 0.05                 # the level every p-value is coloured against; it decides nothing
  min_trades: 30              # below this a market is flagged as too small — it is never dropped
  min_on_open: 0.95           # below this, entries took a price that is not their bar's own: real
                              # intrabar fills the null cannot place. Measured on the PRICE, never on
                              # the clock -- an entry stamped mid-bar is priced like one stamped on it
  fill_tolerance: 0.05        # how far an entry may sit from the market's constant spread and still
                              # count as having taken its bar's price, in median-ATR units. 🔬 Measured
                              # max deviation over 28,490 trades: 0.0045 ATR, one tick
  max_fill_error: 0.25        # median |recorded price - bar price| above which the bars are probably
                              # not the ones the backtest ran on, in median-ATR units. A spread is a
                              # constant and lives well below it: gold's is 0.023 ATR
  min_on_grid: 0.95           # below this a real share of the trades occupy no bar, so no test that needs a duration sees them
