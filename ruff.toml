# Real-bug lint only. No formatter, no style rules — CODESTYLE.md decides those.
target-version = "py310"
extend-exclude = ["scratch", "tools/sqx-lab"]

[lint]
select = [
    "E9",   # syntax errors
    "F7",   # break/continue/return/yield misuse
    "F63",  # misuse of comparisons (is/== on literals, assert on tuple)
    "F811", # redefinition of unused name
    "F821", # undefined name
    "F823", # local variable referenced before assignment
    "F841", # unused local variable
    "B006", # mutable default argument
    "B008", # function call in default argument
]
