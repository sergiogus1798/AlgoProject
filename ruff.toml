# Real-bug lint, plus `ruff format` for layout (encargo 68 F18); other style is CODESTYLE.md's.
# Markdown is excluded: ruff 0.16 would reflow the code blocks of CODESTYLE.md and the READMEs.
# Python version: pyproject.toml (requires-python) — ruff reads it from there.
extend-exclude = ["scratch", "tools/sqx-lab", "*.md"]

[lint]
select = [
    "E9",   # syntax errors
    "F7",   # break/continue/return/yield misuse
    "F63",  # misuse of comparisons (is/== on literals, assert on tuple)
    "F811", # redefinition of unused name
    "F821", # undefined name
    "F823", # local variable referenced before assignment
    "F841", # unused local variable
    "F401", # unused import
    "B006", # mutable default argument
    "B008", # function call in default argument
    "B007", # unused loop variable
    "B023", # closure over a loop variable
    "B904", # raise without from inside except
    "B034", # re.sub/split count or flags passed positionally
]
