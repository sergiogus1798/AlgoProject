# Every knob of the portfolio construction engine (portfolio/PLAN.md §5.7, answers in §12).
# Correlation thresholds come from ledger/thresholds.yaml as ledger:<key>; a run that overrides
# one (--set pairs.pearson=0.45) is relaxed, and says so on its first line.

compute:                        # owner 2026-09-30: the portfolio engine gets the whole machine
  max_ram_gb: 80                # every parallel stage sizes its workers to stay under this
  worker_ram_gb: 1.5            # 🔬 1.15 GB per universe worker beyond the shared M1 bars (48 workers: 56 GB, 15 s)

equity:
  reference_clock: EET          # owner 2026-09-30, Q4: the shared universe's day
  firm_clocks:                  # the funded objective's day: each firm's server midnight
    ftmo: Europe/Prague         # confirmed: the CE(S)T day of its daily-loss rule
    hantec: EETUS               # New York + 7 h, owner 2026-09-30 — UNCONFIRMED
  unconfirmed_clocks: [hantec]
  block_minutes: 5              # the search's joint intraday resolution (knowhow/perf/intraday-floating-resolution.md)
  reconcile_max_trades: 3       # SQX's own noise floor, sqx/variants/curves.py PLAUSIBLE_TRADES
  excursion_tolerance: 1.0      # account currency: a rebuilt MAE/MFE this close to SQX's counts as exact
  excursion_min_share: 0.99     # share of trades exact on MAE and on MFE that licenses the rebuild

pairs:
  pearson: ledger:portfolio.pairs.pearson
  spearman: ledger:portfolio.pairs.spearman
  co_loss: ledger:portfolio.pairs.co_loss
  tail: ledger:portfolio.pairs.tail
  rolling_whole: ledger:portfolio.pairs.rolling_whole
  rolling_recent: ledger:portfolio.pairs.rolling_recent
  frequencies: [monthly, daily] # owner 2026-09-30, Q7: Pearson and Spearman at both, each must pass
  sign: abs                     # owner 2026-09-30, Q6: |ρ| over the threshold rejects
  one_sided: [tail, co_loss]    # owner 2026-09-30: only ρ > threshold — two independent series read tail ≈ −0.46 (Berkson)
  tail_quantile: 0.30           # a month is a tail month when either is in its own worst 30 %
  rolling_months: 60
  recent_months: 36             # owner 2026-09-30, Q9: windows ending in the last 36 months of build
  min_overlap_months: 24        # owner 2026-09-30, Q8: below it the pair is rejected
  stress_quantile: 0.05         # owner 2026-09-30, Q15: the pool's worst 5 % of build days

funded:                         # F2, the funded search's stage A (PLAN §14.3; owner 2026-09-30)
  stop_percentile: ledger:portfolio.funded.stop_percentile   # the step-24 X that sizes every trade
  risk_grid: [0.001, 0.002, 0.003, 0.004, 0.005, 0.006, 0.007, 0.008, 0.009, 0.010]  # risk per trade, fraction of the INITIAL balance
  horizon_days: 126             # a pass counts only within ~6 months of trading days of the purchase
  min_lot: 0.01                 # a trade whose lot rounds below it cannot be placed: that risk level is infeasible

search:                         # AlphaForge's GA defaults (PLAN §5.3), set_by AlphaForge until the owner moves them
  seeds: 300
  ga: {population: 300, generations: 100, elite: 0.20, tournament: 4, crossover: 0.80, mutation: 0.40, stagnation: 10}

stageb:                         # F3, stage B of the funded search (PLAN §14.3, §14.3b)
  shortlist_size: 50            # PLAN §14.3: the top ~50 diverse combinations of a stage-A run
  max_shared: 0.5               # no two of them share MORE than this share of their members
  shared_of: null               # REQUIRED, no default (rule 11): smaller | larger — half of WHICH combination when the two differ in K
  t1_gap: null                  # REQUIRED, no default (rule 11): T1's gap model; the only one built is close_to_open_blocks
  n_paths: 10000                # PLAN §14.3: paths per Monte Carlo flavour and block length
  sweep_days: [5, 10, 20, 40]   # owner 2026-09-30: block lengths read besides the measured one (Politis-White); the most pessimistic decides
  worker_ram_gb: 2.5            # 🔬 2026-10-02: one member's exact-M1 worker on an 8.7 M-bar feed peaks 2.5 GB
  stability_runs: 8             # the winner's deciding figure recomputed this many times (as monteCarlo's n_stability_runs)
  stability_tol: 0.02           # 🤔 this plan: a spread above 2 points of P(pass) between repeats says n_paths is too low

verdict:                        # F4, the funded verdict on oos1+oos2 (PLAN §14.3, Q11)
  null_draws: 100               # 🤔 this plan: null searches, each one stage A on random admissible combinations + stage B
  null_candidates: 0            # combinations per null search; 0 = as many as the stage-A run evaluated
  pass_measure: null            # OPEN (Q11): which measure the bar reads — start_p or mc_p; empty = no criterion
  pass_percentile: null         # OPEN (Q11), the owner's: when he sets it it becomes ledger:portfolio.funded.verdict_percentile; empty = «sin criterio»

real:                           # M3, the search by ranks (PLAN §5.3). Council 2026-10-04 on the owner's delegation: Q10 (a), Q16 (c, provisional), DECISIONS #2
  account: 10000                # C5: the size is the funding economics' -- the 10k account; a member's floor is the minimum lot on it (funded.min_lot, funded.risk_grid)
  exhaustive_max: 100000        # 🤔 PLAN §5.7: up to this many admissible combinations every one is scored; above it the GA runs
  losing_year: null             # REQUIRED, no default (rule 11): calendar (share of calendar years that lose) | rolling (share of 252-day windows)
  rank_reference: null          # REQUIRED when the GA runs (rule 11): the fixed set the ranks are taken in; the only one built is seeds
  increment: null               # REQUIRED for --base (rule 11): finite (Sharpe of K+1 minus Sharpe of K) | marginal (SR_c - rho * SR_base)
