# Every tunable of step 20, the blind joint reading. Nothing below is hidden in code.
#
# Step 20 opens the three results that were withheld until all of them existed — the WFC (17),
# the CSCV (18) and the WFM (19; 18.5 is off, encargo 65 row 8) — and puts beside them the one
# question none of them asks: does the mother beat a random trader with her own footprint on
# oos2, once every mother that reached this step is paid for (SPA and StepM, encargo 10 part B).
#
# The segment is not a knob: it is oos2, the only stretch no selection step looked at. The
# joined curve the batch keeps repeats two months of dates where each leg's warm-up overlaps the
# leg before it; oos2 from its policy start is clear of them (knowhow/sqx-format/leg-curve-warmup.md).

benchmark:
  # Owner, 2026-10-11: the random trader with the mother's own footprint replaces buy and hold
  # at equal risk. Each mother is held against the MEAN daily P&L of `draws` traders who take
  # her trades — count, side, lots, costs — at entries drawn uniformly over oos2. It discounts
  # the asset's drift for the time she is in the market, without asking her to beat a
  # leveraged long. Read on oos2 only, never on the in-sample (owner, 2026-09-29).
  rung: timing                # which rung of engines/nulls/model.py draws them. timing: each
                              # trade keeps its own holding time and lots (the monkey study's
                              # headline). timing_holds redraws the holding times among her
                              # own; the two differ only if she sizes long and short holds
                              # differently
  draws: 2000                 # random traders averaged. The mean's Monte Carlo error is
                              # sd(one trader's total) / sqrt(draws), and one trader's total
                              # is about as volatile as the mother's own: so the error is
                              # ~1/sqrt(2000) = 2.2 % of the mother's standard error — it
                              # inflates the variance the SPA studentizes by 0.05 % and moves
                              # a t by less than 0.05. Measured per mother: `mc_day`
  seed: 0                     # fixed, like the bootstrap's: a rerun draws the same traders

stepm:
  fwer: ledger:snoopingScreen.stepm.fwer
                              # the FWER the owner set 2026-09-25, read
                              # from this row of ledger/thresholds.yaml

joint:
  # `pieces` is an OPEN DECISION OF THE OWNER (hard rule 11). While either key is null the
  # study shows the verdict under every reading side by side, cuts nobody (every row MANTENER)
  # and records a soft row. Both set make one reading the call.
  pieces: null                # owner, 2026-10-12: NOBODY is discarded at step 20 — null, every row
                              # MANTENER; the step is a summary and the StepM a diagnostic. The
                              # `peor` reading was removed. The readings that remain, selectable:
                              # unanimidad (all three pass), sin_fallo (none fails; indeciso/ciego
                              # tolerated), ninguna (the pieces are context and the StepM decides
                              # alone)
  population: entrantes       # decided 2026-10-04 (P2, the Council on the owner's delegation).
                              # Over whom the StepM counts its search: entrantes (every mother
                              # that reached step 20, as part A reads: the pieces chose on oos2
                              # too, and a test on what a choice kept cannot pay for the
                              # choice) or supervivientes (the mothers the pieces kept)

bootstrap:
  reps: 1000                  # stationary-bootstrap replications, for the SPA and the StepM alike
  seed: 0                     # fixed, so a rerun on the same mothers names the same ones
