# El spread real de Darwinex contra el que se declara en SQX (manual docs/manual/03-datos-costes-y-registro.pdf,
# cap. 59-spread-real). Dueño, 2026-09-27: empezar por XAUUSD y USDJPY, un activo cuyo precio y
# spread se disparan y un forex que en teoría no.
# `ledger:<clave>` = el número vive en ledger/thresholds.yaml, con quién lo puso y cuándo.
assets:                         # activo -> su feed de ticks (Darwinex) y su feed de velas M1 (Dukascopy)
  XAUUSD:
    ticks: XAUUSD_TICK
    bars: XAUUSD_M1
  USDJPY:
    ticks: USDJPY_TICK
    bars: USDJPY_M1
  DAX40:
    ticks: DAX40_TICK
    bars: DAX40_M1
  DJ30:
    ticks: DJ30_TICK
    bars: DJ30_M1
  NIKKEI225:
    ticks: NIKKEI225_TICK
    bars: NIKKEI225_M1
  USA500:
    ticks: USA500_TICK
    bars: USA500_M1
  USATEC:
    ticks: USATEC_TICK
    bars: USATEC_M1
  AUDJPY:
    ticks: AUDJPY_TICK
    bars: AUDJPY_M1
  AUDUSD:
    ticks: AUDUSD_TICK
    bars: AUDUSD_M1
  CADJPY:
    ticks: CADJPY_TICK
    bars: CADJPY_M1
  EURJPY:
    ticks: EURJPY_TICK
    bars: EURJPY_M1
  EURUSD:
    ticks: EURUSD_TICK
    bars: EURUSD_M1
  GBPJPY:
    ticks: GBPJPY_TICK
    bars: GBPJPY_M1
  GBPUSD:
    ticks: GBPUSD_TICK
    bars: GBPUSD_M1
  USDCAD:
    ticks: USDCAD_TICK
    bars: USDCAD_M1
  USDCHF:
    ticks: USDCHF_TICK
    bars: USDCHF_M1
  XAGUSD:
    ticks: XAGUSD_TICK
    bars: XAGUSD_M1
day:
  min_minutes: 300              # un día con menos minutos cotizados (festivo, medio día) no entra en el modelo
constancy:
  tolerance: ledger:spread.constancy.tolerance   # ±: el relativo es «constante» si cada año cae dentro
model:
  candidates: [relativo, puntos, volatilidad, volatilidad_precio]
  split: 2022                   # la validación ajusta en los años de antes y predice desde este, y al revés
  fixed:                        # modelo decidido por el dueño, por encima del que mejor valida (2026-09-27, opción A)
    DAX40: relativo
    DJ30: relativo
    NIKKEI225: relativo
    USA500: relativo
    USATEC: relativo
safety:
  factor: ledger:spread.safety.factor            # multiplica el spread medido al declararlo en SQX
reprice:
  near_minutes: 5               # un tick a más de estos minutos de la hora de la operación no vale: se usa el modelo
  judge: spread_slippage        # spread | spread_slippage: contra qué versión se dice «se rompe»
  action: mark                  # mark | drop: si el reajuste que no cubre el spread real escribe DESCARTAR
mc:                              # el rango de mc_retest.spread/slippage que escribe onboard.plan()
  grain: 0.1                    # el paso de RandomizeSpread/RandomizeSlippage en SQX, mismas unidades que spread_is
  min_steps: 10                 # el rango debe cubrir al menos esto pasos de `grain`, si no la tarea sale sin forma
band:                           # la curva spread = a · precio^b y sus límites (dueño, 2026-09-27), un informe por activo
  assets:                       # activo -> su feed de ticks; sólo hacen falta los ticks
    DAX40: DAX40_TICK
    DJ30: DJ30_TICK
    NIKKEI225: NIKKEI225_TICK
    USA500: USA500_TICK
    USATEC: USATEC_TICK
    XAUUSD: XAUUSD_TICK
    USDJPY: USDJPY_TICK
    AUDJPY: AUDJPY_TICK
    AUDUSD: AUDUSD_TICK
    CADJPY: CADJPY_TICK
    EURJPY: EURJPY_TICK
    EURUSD: EURUSD_TICK
    GBPJPY: GBPJPY_TICK
    GBPUSD: GBPUSD_TICK
    USDCAD: USDCAD_TICK
    USDCHF: USDCHF_TICK
    XAGUSD: XAGUSD_TICK
  quantiles: [0.025, 0.5, 0.975]   # los extremos son el Min y el Max del MC Retest de spread
  min_minutes: 300              # un día con menos minutos cotizados no entra
onboard:                        # alta de un activo nuevo: las reglas por defecto del dueño (2026-09-27), por tipo
  commission_usd_per_lot: 8     # ida y vuelta por lote; en no_forex se pasa a % del nocional al último precio de Darwinex
  index:
    segments: {build: data, build_to: 2019, oos1: [2020, 2023], oos2: [2024, 2026-08-31]}
    commission: 0               # cuenta raw: los índices no pagan comisión
    swap: funded_worst          # dueño 2026-10-01: el peor de FTMO y Hantec, lado a lado, leído en vivo de MT5 (antes [-8, -8])
    triple_swap_on: FRIDAY
    model: relativo             # spread proporcional al precio en el build (opción A)
  metal:
    segments: {build: 2008, build_to: 2017, oos1: [2018, 2022], oos2: [2023, 2026-08-30]}
    commission: usd_per_lot
    swap: funded_worst          # antes [-7, -7]
    triple_swap_on: WEDNESDAY
    model: null                 # null = el que mejor valida
  forex:
    segments: {build: 2008, build_to: 2017, oos1: [2018, 2022], oos2: [2023, 2026-08-30]}
    commission: usd_per_lot
    swap: funded_worst          # antes `brokers`, la media del registro de SQX
    triple_swap_on: WEDNESDAY
    model: null
