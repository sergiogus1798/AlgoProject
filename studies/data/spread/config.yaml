# El spread real de Darwinex contra el que se declara en SQX (manual docs/manual/03-datos-costes-y-registro.pdf,
# cap. 59-spread-real). Dueño, 2026-09-27: empezar por XAUUSD y USDJPY, un activo cuyo precio y
# spread se disparan y un forex que en teoría no.
# `ledger:<clave>` = el número vive en ledger/thresholds.yaml, con quién lo puso y cuándo.
assets:                         # activo -> su feed de ticks (Darwinex) y su feed de velas M1 (Dukascopy)
  XAUUSD:
    ticks: XAUUSD_TICK
    bars: XAUUSD_M1
  USDJPY:
    ticks: USDJPY_TICK
    bars: USDJPY_M1
  DAX40:
    ticks: DAX40_TICK
    bars: DAX40_M1
  DJ30:
    ticks: DJ30_TICK
    bars: DJ30_M1
  NIKKEI225:
    ticks: NIKKEI225_TICK
    bars: NIKKEI225_M1
  USA500:
    ticks: USA500_TICK
    bars: USA500_M1
  USATEC:
    ticks: USATEC_TICK
    bars: USATEC_M1
  AUDJPY:
    ticks: AUDJPY_TICK
    bars: AUDJPY_M1
  AUDUSD:
    ticks: AUDUSD_TICK
    bars: AUDUSD_M1
  CADJPY:
    ticks: CADJPY_TICK
    bars: CADJPY_M1
  EURJPY:
    ticks: EURJPY_TICK
    bars: EURJPY_M1
  EURUSD:
    ticks: EURUSD_TICK
    bars: EURUSD_M1
  GBPJPY:
    ticks: GBPJPY_TICK
    bars: GBPJPY_M1
  GBPUSD:
    ticks: GBPUSD_TICK
    bars: GBPUSD_M1
  USDCAD:
    ticks: USDCAD_TICK
    bars: USDCAD_M1
  USDCHF:
    ticks: USDCHF_TICK
    bars: USDCHF_M1
  XAGUSD:
    ticks: XAGUSD_TICK
    bars: XAGUSD_M1
  EURGBP:
    ticks: EURGBP_TICK
    bars: EURGBP_M1
  EURAUD:
    ticks: EURAUD_TICK
    bars: EURAUD_M1
  NZDUSD:
    ticks: NZDUSD_TICK
    bars: NZDUSD_M1
  AUDNZD:
    ticks: AUDNZD_TICK
    bars: AUDNZD_M1
  UK100:
    ticks: UK100_TICK
    bars: UK100_M1
  AUS200:
    ticks: AUS200_TICK
    bars: AUS200_M1
day:
  min_minutes: 300              # un día con menos minutos cotizados (festivo, medio día) no entra en el modelo
constancy:
  tolerance: ledger:spread.constancy.tolerance   # ±: el relativo es «constante» si cada año cae dentro
model:
  candidates: [relativo, puntos, volatilidad, volatilidad_precio]
  split: 2022                   # la validación ajusta en los años de antes y predice desde este, y al revés
  fixed:                        # modelo decidido por el dueño, por encima del que mejor valida (2026-09-27, opción A)
    DAX40: relativo
    DJ30: relativo
    NIKKEI225: relativo
    USA500: relativo
    USATEC: relativo
    UK100: relativo
    AUS200: relativo
safety:
  factor: ledger:spread.safety.factor            # multiplica el spread medido al declararlo en SQX
  slippage_share: 0.35          # slippage = esta parte del spread (dueño, 2026-10-04; antes la mitad)
band:                           # la curva spread = a · precio^b y sus límites (dueño, 2026-09-27), un informe por activo
  assets:                       # activo -> su feed de ticks; sólo hacen falta los ticks
    DAX40: DAX40_TICK
    DJ30: DJ30_TICK
    NIKKEI225: NIKKEI225_TICK
    USA500: USA500_TICK
    USATEC: USATEC_TICK
    XAUUSD: XAUUSD_TICK
    USDJPY: USDJPY_TICK
    AUDJPY: AUDJPY_TICK
    AUDUSD: AUDUSD_TICK
    CADJPY: CADJPY_TICK
    EURJPY: EURJPY_TICK
    EURUSD: EURUSD_TICK
    GBPJPY: GBPJPY_TICK
    GBPUSD: GBPUSD_TICK
    USDCAD: USDCAD_TICK
    USDCHF: USDCHF_TICK
    XAGUSD: XAGUSD_TICK
    EURGBP: EURGBP_TICK
    EURAUD: EURAUD_TICK
    NZDUSD: NZDUSD_TICK
    AUDNZD: AUDNZD_TICK
    UK100: UK100_TICK
    AUS200: AUS200_TICK
  quantiles: [0.025, 0.5, 0.975]   # los extremos son el Min y el Max del MC Retest de spread
  min_minutes: 300              # un día con menos minutos cotizados no entra
