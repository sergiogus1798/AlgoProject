# Every tunable of the cross-timeframe study, in one place. Nothing below is hidden in code.
#
# The scaling rule itself is NOT here: it lives in sqx/variants/config.yaml, because the
# fabrication owns it. This file only says what to read and how to judge it.

run:
  # project and feed come from the command line (--project, --asset): a default here belonged to
  # whichever asset was studied last, and scored USDJPY against gold bars once (OPEN.md #34).
  source_tf: H1              # the timeframe every mother was built on
  # The <Setup> order of the retest task, which is the order the result blocks come back in.
  # Block 0 is always the main test. Change this and the cells are read off the wrong bars,
  # silently -- `report.py` prints the mapping every run so it can be eyeballed.
  blocks: [H1, H4, H12]

usable:
  # A scaled cell whose parameters were mangled by rounding does not answer the question:
  # whatever it shows could be the rounding rather than the timeframe. Measured 2026-09-23
  # on the three mothers: H1->H4 moves a parameter by at most 20%, H1->D1 by up to 586%
  # with every period clamped, which is why D1 is fabricated but never read as scaled.
  max_rounding_shift: 0.15
  reject_clamped: true
  min_trades: 30             # matches studies/readings/monkey/config.yaml; below it no p is computed

verdict:
  statistic: sharpe          # scale-free, so it compares across timeframes with different
                             # trade counts and different per-trade sizes. `net` does not.
  rung: timing               # the null that randomises entry timing alone, holding the
                             # opportunity set fixed -- the rung that says whether the edge
                             # on this timeframe is its own or inherited from the source
  alpha: 0.05
  control_drop: 0.50         # how much of the baseline statistic the control cell may lose
                             # before the scaled cell stops being attributable to timeframe
