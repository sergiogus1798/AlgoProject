# Every tunable of the cross-market study (step 10), in one place. Nothing is hidden in code.
# Override any of these on the command line with --set key=value (dotted keys), or from the
# panel's config drawer for one run. The rules P1-P9 and their lines live in
# pipeline/autopilot/criteria.yaml; this file holds only how the numbers are measured.

travel:                       # «¿la lógica viaja?» (encargo 46): the joint random runs of travel/
  draws: 5000                 # B, random runs; the same ones serve every market, window and rule
  seed: 20261007              # keyed with each calendar cell, so one run is one shift in every market
  judge_on: gross             # gross | net — what every z is read on (cost in R is cost / ATR at entry, so
                              # it does not cancel against the shifted copies); `e` and what is built on
                              # it (tau_half, e_end, beta, e_end_ratio) stay on net R
  shift_unit: year            # year | semester — the block a run's trades are shifted inside
  shift_step: week            # week | day — what the shift is counted in; week keeps weekday and hour
  min_trades_market: 30       # below it a market still adds to the total, but tau = -inf and it is
                              # not counted among the markets against
  worse_z: -1.65              # the z of one market at or below which it is a market against
  frequency: {z: 3.5, phi_min: 1.5, phi_max: 3.5}   # P2: |z_freq| that flags a market, and the
                              # bounds of the overdispersion estimated on the main's build
  validity: {point_value_margin: 0.02, flat_atr_fraction: 0.02, max_displaced_share: 0.20, max_fill_error: 0.25}
                              # 7.1: card vs regression; the share of the median ATR under which a bar is
                              # defective (1/50); and the share of uniformly placed entries a shift may
                              # displace onto a later bar (a hole in the data) before that (market, cell)
                              # is left out of the tensor as no data; and the median |recorded price - bar price|, in median-ATR
                              # units, above which the bars are probably not the ones the backtest ran on
                              # (a constant spread lives well below it: gold's is 0.023 ATR)
  degradation: {min_trades_year: 30, min_years: 4}  # P9: years with fewer trades are pooled with
                              # the next; fewer years than this after pooling is «no data»
