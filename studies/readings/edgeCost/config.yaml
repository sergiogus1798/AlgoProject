# Edge per trade and breakeven cost (encargo 11, built 2026-09-26; manual docs/manual/06-lecturas.pdf (cap. 50-edge-por-coste)).
#
# `min_edge_spreads` y `action` son decisión del DUEÑO, no de este código — regla dura 11 y
# owner 2026-09-26. Se fijan ANTES de mirar resultados: un umbral ajustado después de verlos
# no es un umbral. Orden de magnitud de partida del encargo: 2-3 spreads por operación.
#
# `ledger:<clave>` = el número vive en ledger/thresholds.yaml, con quién lo puso y cuándo;
# inputs.config() lo sustituye al leer (ledger.thresholds.fill). Cambiarlo es del dueño, allí.
verdict:
  min_edge_spreads: ledger:edgeCost.min_edge_spreads
  action: ledger:edgeCost.action

# Color de las tablas de sensibilidad (encargo 39). PROPUESTA, no fijada: la fija el DUEÑO.
# Múltiplo de punto muerto a partir del cual un coste se pinta en verde (hay margen para que
# empeore); por debajo, rojo. Ver el informe del encargo para el reparto medido de la población.
sensitivity:
  margin_ok: 2.0
