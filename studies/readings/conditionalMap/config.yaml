# Every tunable of the conditional map, in one place. Nothing below is hidden in code.
#
# Descriptive only: this module fabricates hypotheses rather than testing one (encargo 14 §1).
# It carries no verdict and touches no databank verdict; a filter is never derived from it
# without registering it in the ledger (encargo 8) and revalidating on data not yet looked at.

run:
  symbol: USDJPY              # assets/symbols/<symbol>.yaml — source of the frozen build
                              # segment the tercile cut-offs are measured on
  feed: USDJPY_M1
  timeframe: H1                # the grid the strategy was built on
  sample: OOS1                 # the `Sample type` the map opens on; the «Muestra» selector
                               # always offers «Completa» beside it — every harvested trade,
                               # build + OOS1 (owner, 2026-10-01)

volatility:
  atr_period: 20               # trading days of daily true range the tercile is cut on
                              # (engines.regimes.regime.atr, zero fitted parameters)

trend:
  window: 20                   # trading days behind each entry the efficiency ratio is
                              # measured over: |close_t - close_t-n| / sum|close_i - close_i-1|

bootstrap:
  resamples: 9999              # draws behind each cell's confidence interval
  confidence: 0.95
  seed: 0

# Trading sessions (owner, 2026-09-26). Each city's working hours in its OWN local time, so
# daylight saving moves each boundary on its own date; where two cities are open at once the
# hour is their overlap (sessions.py). Entry times are first moved from the feed's clock to UTC:
# SQX stamps bars in the broker's zone (EET for Infinox, Asia/Jerusalem for the5ers), read from
# its data registry by sqx.inspect.feeds — never assumed.
sessions:
  asia: {zone: Asia/Tokyo, open: 9, close: 18}
  london: {zone: Europe/London, open: 8, close: 17}
  new_york: {zone: America/New_York, open: 8, close: 17}
