# The negative control of the chain (encargo 9): monkeys through its criteria.
#
# No threshold lives here. The rules a monkey is judged by are the chain's own —
# pipeline/autopilot/criteria.yaml, or the file `--criteria` names — and the gate's screens
# read theirs from ledger/thresholds.yaml as they do for a real population.

monkeys:
  per_donor: 50     # monkeys drawn on each real strategy's footprint. The smallest rate a
                    # run can see is 1 / (donors x per_donor)
  rung: free        # what a monkey keeps of its donor, a rung of engines/nulls/model.py.
                    # `free` keeps the trade count and the cost and hands entry, holding time
                    # and sizing to chance: the monkey. `timing` keeps the donor's own holds
                    # and sizes — whatever a rung keeps, it gives to the monkey
  sizing: atr       # how a monkey's trade is sized. `atr`: by the ATR of the bar before the
                    # one it landed on, at the donor's own size x ATR — the doctrine's sizing
                    # and the gate's monkey's (owner, 2026-10-07). `donor`: the size the rung
                    # drew (the donor's own, or its mean under `free`): fitted to the
                    # volatility of the DONOR's entry, so the floating-risk rules then mostly
                    # measure that broken pairing

population:         # encargo 44, part K: the test populations, the whole chain, cascade off
  per_level: 5000   # strategies per population: per_level / per_donor donors are drawn from
                    # the harvest, and the same monkeys make every population
  edges: [0.05, 0.10, 0.15]   # planted Sharpe per trade NET of costs, one population each
                    # beside the null one (0): every oos1 trade gains edge x the sd of its
                    # strategy's excess plus its mean cost per trade, so what is left after
                    # the costs the gate charges is the edge (owner, 2026-10-07)
  seed:             # root of every draw; empty = fresh on each run, written in the result.
                    # `--seed` wins over it
