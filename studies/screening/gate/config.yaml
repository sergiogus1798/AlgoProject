# Las cribas, en orden, como datos. `cascade.py` lee este fichero y nada mas decide que es
# la puerta. Añadir la octava criba es añadir una fila aqui y una funcion en screens.py.
#
# Campos de cada fila:
#   name   como la llaman el scorecard, el veredicto y el informe
#   kind   hard = elimina a quien no pasa · soft = mide y no elimina a nadie
#   why    por que existe, en una frase; se copia al informe
#   resto  los umbrales que lee su propia funcion
#          `ledger:<clave>` = el numero vive en ledger/thresholds.yaml, con quien lo puso y
#          cuando; inputs.config() lo sustituye al leer. Cambiarlo es del dueño, alli.
#
# ⚠️ TODOS LOS UMBRALES DE AQUI SON DELIBERADAMENTE LAXOS. Decision del dueño, 2026-09-23:
# estan puestos para VER cuanta poblacion mata cada criba sobre datos reales, no para
# seleccionar nada. Ninguno de estos numeros esta decidido; apretarlos viene despues, con
# la distribucion delante. Ver el apendice A de docs/AgentPDFs/puerta-oos-2026-09-23.md.

# Las metricas vienen de DOS databanks, porque SQX solo admite un spread y un slippage por
# backtest y la ventana es de años: la de construccion y la de retesteo. Cada metrica aparece
# dos veces, `[IS]` del databank de build y `[OOS]` del de retesteo, y las dos se unen por la
# identidad de la estrategia, nunca por el nombre.

screens:
  - name: presencia
    kind: hard
    why: >-
      si SQX la tiro del databank de retesteo —demasiados trades ambiguos, o cualquier otra
      de sus banderas rojas— esa decision ya esta tomada y la estrategia se va. Decision del
      dueño, 2026-09-23

  - name: sanidad
    kind: hard
    min_trades: ledger:gate.sanidad.min_trades
    why: >-
      una estrategia con cuatro trades fuera de muestra no tiene error estandar que leer, y
      una que repite los trades de otra no es una segunda observacion

  - name: estaticas
    kind: hard
    keep: "`Net profit [OOS]` > 0"
    value: "Net profit [OOS]"
    why: >-
      el suelo de metricas estaticas sobre el periodo fuera de muestra. Laxo a proposito:
      hoy solo pide no perder dinero

  - name: degradacion
    kind: hard
    min_retention: ledger:gate.degradacion.min_retention
    min_t: 0.0
    min_years_positive: 1
    max_concentration: ledger:gate.degradacion.max_concentration
    why: >-
      cuanto del filo dentro de muestra sobrevivio, y si lo que queda bate a su propio error
      estandar. Laxo a proposito: hoy solo pide que la pendiente fuera de muestra sea positiva

  - name: forma
    kind: hard
    max_dd_ratio: ledger:gate.forma.max_dd_ratio
    why: >-
      si el peor descenso fuera de muestra cabe en lo que dentro de muestra hacia esperar.
      Un multiplo de 5 es casi no pedir nada

  - name: mono
    kind: hard
    statistic: sharpe
    rung: timing
    max_p: ledger:gate.mono.max_p
    why: >-
      si bate a un aleatorio con la misma oportunidad de mercado. max_p 0.50 es la mediana
      del mono: hoy solo pide estar en la mitad buena

  - name: familia
    kind: soft
    alpha: ledger:gate.familia.alpha
    why: >-
      de los que pasan el mono, cuantos daria el azar. Corrige Benjamini-Hochberg sobre todas
      las que entraron al mono (no solo las que pasaron su p). SOFT: informa, no elimina, hasta que el dueño vea el exceso

  - name: redundancia
    kind: soft
    why: >-
      si son N estrategias o una repetida N veces, por la LOGICA del XML: los bloques y su
      orden, ignorando los valores de los parametros. Sustituye a la correlacion de equity
      (dueño 2026-09-23), que es un proxy y depende de la ventana. SOFT: agrupar puede
      matar estrategias buenas, asi que nombra al representante de cada grupo y no descarta
      a nadie. El valor de la criba es el TAMAÑO del grupo

monkey:
  draws: 2000        # corridas nulas por estrategia. engines/nulls/config.yaml manda en el resto
  timeframe: M30
  seed:              # raiz de los sorteos del mono de niveles. Vacia = nueva en cada corrida; la
                     # usada queda en el scorecard (mono_seed)

# ── Encargo 44: la puerta por niveles (levels.py) ─────────────────────────────────────────
# Las claves de aqui abajo, y monkey.seed, las leen los niveles nuevos. Hasta que el paquete I
# conmute la puerta, nada de produccion las lee: la cascada de arriba sigue siendo la que corre.
# Los sorteos del mono de niveles seran 5000 (P.3): monkey.draws sigue en 2000 porque es el
# de la criba `mono` viva; lo sube quien conmute.

cascade:
  "on": true         # una estrategia sale en su primer Falla y no se le calcula nada mas.
                     # false = se calcula todo para todas (poblaciones de prueba, calibracion).
                     # Entre comillas: YAML lee un `on` suelto como el booleano true

drift:               # R3: el exceso de cada operacion sobre la deriva del mercado
  window: year       # ventana de calendario dentro de oos1 en la que se mide el movimiento
                     # medio, y en la que se sortean los monos: year | semester | quarter.
                     # Nada menor: al acercarse a la duracion de una operacion el exceso -> 0
  variant: d         # termino de deriva: a = el de hoy · b = movimiento por ventana ·
                     # c = operacion ciega de la misma duracion · d = b y c. Dueno,
                     # 2026-10-07, tras D-m: d deja 0,017 de t de sesgo por lado (a 0,09)
  se_skew_kurt: true # error estandar de la t corregido por sesgo y curtosis del exceso

frequency:           # R5: sobredispersion φ de la frecuencia, estimada en el build
  phi_min: 1.5       # cota inferior de φ
  phi_max: 3.5       # cota superior de φ

centring:            # R5 y R5d: el centro de la poblacion (mismo activo, timeframe y lado)
  min_strategies: 30 # con menos estrategias no se centra
  cap_log_rate: 0.35 # tope del centro de R5, en logaritmo del cociente de frecuencias
                     # (-30 % / +42 %): lo que pase de ahi se queda en la z de cada una
  cap_slope:         # tope del centro de R5d, en unidades de la pendiente. Sin valor: lo
                     # propone K-m con las poblaciones de prueba

cost_stress:
  k: 1.25            # R5c: t_exceso_k resta a cada operacion (k - 1) x su coste

concentration:       # R8: la t de R3 sin lo mejor
  drop_trades: 3     # cuantas de las mejores operaciones se quitan
  drop_period: quarter   # el mejor periodo natural que se quita

mae:
  percentile: 95     # R9b: percentil de |MAE| / 1R sobre las operaciones de oos1

delay:               # nivel 2: la ejecucion una barra tarde
  variants: ["E+1", "S+1", "ES+1"]   # E = entrada, S = salida, ES = las dos, en la apertura
                     # de la barra siguiente; se juzga la peor. Admite "E-1"
  on_build: false    # true = tambien sobre las operaciones del build

homogeneity:         # R7: Q del exceso por periodo, contra operaciones barajadas entre periodos
  permutations: 5000
  period: quarter
  min_trades: 5      # un periodo con menos operaciones se une al siguiente
  seed:              # vacia = nueva en cada corrida; la usada queda en el scorecard (q_seed)

drawdown:            # R6: el drawdown de oos1 contra las operaciones del build remuestreadas
  block: 8           # longitud del bloque, en operaciones
  sequences: 5000    # secuencias remuestreadas, cada una de tantas operaciones como oos1
  seed:              # vacia = nueva en cada corrida; la usada queda en el scorecard (dd_seed)
