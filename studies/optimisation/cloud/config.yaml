# Every tunable of the parameter map (step 16.5). Nothing below is hidden in code.
#
# The map is a DIAGNOSIS: it has no rule and removes no strategy (`criteria.yaml` "16.5",
# `rules: []`). `ledger:<key>`: the number lives in ledger/thresholds.yaml, with who set it
# and when. The inside trade floor (15 per live parameter) is not here: it is the WFC's,
# `engines/variants/config.yaml#panel.floor_is_per_param`, and `inputs/config.py` adds it.

# How many times the metric is shuffled among the variants to get the adjusted R² that pure
# noise reaches with this many coefficients and this many variants.
shuffles: ledger:parameterCloud.shuffles

# The ranking is «legible» only if the real adjusted R² is above this percentile of the
# shuffled ones. 95 -> a cloud of pure noise is called legible about 5 % of the time.
shuffle_percentile: ledger:parameterCloud.shuffle_percentile

# How many parameters, the ones with the highest Sobol total, are crossed two by two in the
# heat maps: 4 give 6 maps, 3 give 3, 2 give 1.
heatmap_pairs: ledger:parameterCloud.heatmap_pairs

# Under this many variants per coefficient of the quadratic the report warns (the factory
# sizes the batch for it and only falls short at its cap).
per_coefficient: ledger:variants.per_coefficient

sobol_power: 12   # 2**12 base points for the Sobol indices; arithmetic on the surface, not SQX runs
seed: 0           # of the Sobol sample and of the shuffles
