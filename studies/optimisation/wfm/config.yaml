# Every tunable of the Walk-Forward Matrix reading (step 19; owner's proposal of 2026-10-07).
# `ledger:<key>`: the number lives in ledger/thresholds.yaml, with who set it and when.

# How the strategy will be traded live, fixed BEFORE the run: `fijo` (the mother with its own
# parameters; the WFM is indirect evidence) or `reoptimizado` (re-optimised periodically; the
# WFM is the test of what is traded, and two more rules can add LIMBO).
modo_real: fijo

# The cell traded in `reoptimizado`, chosen before looking: never the best cell on oos2.
centre:
  runs: ledger:wfm.centre_runs
  oos_pct: ledger:wfm.centre_oos_pct

# The segment whose costs the EXPORT's task was charged with (`wfm.costs_segment` of
# assets/_build.yaml when it ran). Trades closing in oos2 are re-charged from these to oos2's.
# 🔬 2026-10-07, Trade_NIKKEI225_M30_volatilidadL: the mother's build and oos1 trades reprice
# at oos1's costs to 0.21 USD at worst, at build's or oos2's they miss by 19 and 37 a trade.
recharge:
  charged: oos1

# The weekly sign-flip null: each oos2 week takes one sign, the same for the 30 cells.
# Quoted: YAML reads a bare `null` as the empty value.
"null":
  draws: ledger:wfm.null_draws          # sign vectors per mother, not per cell
  alpha: ledger:wfm.alpha               # cut on p- (NO PASA) and on p+ («reoptimizar gana»)
  seed: ledger:wfm.seed
  # Share of trades closed on a Monday or Tuesday after a weekend above which the null is
  # ALSO drawn in blocks of two weeks, and a warning raised. It never changes the state.
  straddle_max: ledger:wfm.straddle_max
  # Skewness of the weekly median-of-cells series above which the result warns that the
  # null's lower tail over-rejects (engines/weekly/README.md). It never changes the state.
  skew_warn: ledger:wfm.skew_warn

read:
  drop_future: true       # steps whose run window extends past the data. Never false.
