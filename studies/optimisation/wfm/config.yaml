# Every tunable of the Walk-Forward Matrix study, in one place.

read:
  # Bare metric name; `is_` and `oos_` are prefixed when reading a step.
  # NOT `Fitness`: SQX stores it as 0 on every step (the cell-level fitness_is/fitness_oos
  # are the only real ones), so a study reading Fitness per step would correlate zeros.
  metric: ReturnDDRatio
  companion_metrics: [NetProfit, SharpeRatio, ProfitFactor]
  drop_future: true       # steps whose run window extends past the data. Never false.

measure:
  min_steps: 5            # a cell with fewer is not correlated at all
  confidence: 0.95
  n_resamples: 9999
  seed: 0

verdict:
  zero_band: 0.0          # how far the interval must clear zero to be called either way
  drift_high: 0.5         # share of parameters re-decided per step that counts as high

benchmark:
  # The original strategy over `oos2` only — `oos1` screened the population and is spent —
  # against holding its asset at the same volatility (days resampled in pairs, stationary
  # bootstrap) and against random traders with its own footprint (engines/nulls, rung timing).
  n_resamples: 2000
  block_days: 20          # mean block length, about a month of trading days
  monkey_draws: 10000     # random traders; the smallest p observable is 1/10001
  monkey_min_trades: 30   # fewer trades inside oos2 and the monkey is not run
  confidence: 0.95
  seed: 0
