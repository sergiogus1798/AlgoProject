# Every tunable of the market surfaces (step 18.5; owner's proposal of 2026-10-07).
# `ledger:<key>`: the number lives in ledger/thresholds.yaml, with who set it and when.
# The two trade floors are the WFC's and live in engines/variants/config.yaml (`panel`):
# `floor_oos_per_year` trades per year of the window on every market, and on the main one
# `floor_is_per_param` x live parameters besides.

# The workflow step the ledger records this at.
step: 18.5

# The joint sign-flip null: each WEEK of the other markets' window takes one random sign,
# the same for every variant and every market that is not the main one. The main market is
# never flipped. Quoted: YAML reads a bare `null` as the empty value.
"null":
  draws: ledger:marketSurfaces.null_draws              # sign vectors drawn
  block_weeks: ledger:marketSurfaces.null_block_weeks  # consecutive weeks that share one sign
  alpha: ledger:marketSurfaces.alpha                   # cut on p+ (positivo) and on p- (perverso)
  seed: ledger:marketSurfaces.seed                     # root seed; every null is a child of it
  chunk: 250                                           # draws flipped at a time: bounds the memory
  # Share of the other markets' trades closed on a Monday or Tuesday after a weekend held
  # from which the result warns and the order is classified again with two-week blocks.
  straddle_max: ledger:marketSurfaces.straddle_max

# Which markets enter the joint mean.
markets:
  min_common: ledger:marketSurfaces.min_common   # variants usable on the main market AND on this one
  max_ties: ledger:marketSurfaces.max_ties       # share of those variants tied with another there
  # Under this SUM OF WEIGHTS in the mean (a group of near-identical markets shares 1) the
  # order is «sin dato». The proposal's «menos de 5 mercados (con los pesos)» read as a sum
  # of weights, not as a count of markets: open question for the owner.
  min_weight: ledger:marketSurfaces.min_weight

# The top-20 % premium, on net excess.
premium:
  top_share: ledger:marketSurfaces.top_share     # the main market's top an optimiser would pick
  percentile: ledger:marketSurfaces.premium_percentile   # at or under this percentile of its null: LIMBO

# The main market against itself (build against oos1): the ratio rho / rho_auto is written
# only when rho_auto is above this.
reference:
  min_rho: ledger:marketSurfaces.auto_min_rho

# The planted-transmission power curve: for each true rho, `draws` flipped families with the
# main market's order mixed in; the share read as a positive order is annotated.
power:
  rhos: [0.1, 0.2, 0.3]
  draws: ledger:marketSurfaces.power_draws

# The cost check: the repriced trades of a variant must add up to SQX's NetProfit on that
# market and leg within `tolerance` (account currency) + `relative` x |NetProfit|; the result
# warns when more than `max_share` of the variants of any market miss it.
costs:
  tolerance: 1.0
  relative: 0.01
  max_share: ledger:marketSurfaces.cost_max_share

# Processes that reprice the markets in parallel (one market each, one BLAS thread).
workers: 12
