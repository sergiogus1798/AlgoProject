# Every tunable of the market surfaces. The trade floor is shared with the WFC and the CSCV
# and lives in engines/variants/config.yaml: a surface here and the WFC's cloud are two
# readings of one set of points, so which points cannot live in two files.

# Which segments of the batch are read, one surface per market per segment.
# `oos2` is reserved (assets/_policy.yaml) and this step is one it is reserved for (owner,
# 2026-09-26: same group as the WFC and the WFM, read blind at step 20). `ledger.gate.allow`
# is still asked before any file is opened, so a step without the claim is refused.
segments: [build, oos1, oos2]

# The metric each surface is made of. The WFC reads net profit per segment
# (engines/variants/panel.columns), so the surfaces do too: a rho here and the WFC's rho
# then speak about the same number. Ranks, so the account currency and the size of each
# market's moves drop out.
metric: NetProfit

# The top share whose overlap the Jaccard measures: the top decile, as the encargo defines.
# The same share is the plateau of the consensus map: a cell counts for a market when it is in
# the top decile of that market's surface on the pair (owner, 2026-09-27, encargo 24 Q13).
top_share: 0.10

# The Spearman that the whole Fisher interval must clear to call two markets' rankings the
# same. The WFC's floor, for the same reason: below 0.30 the ranks share under 9 % of
# their variance, and a region "shared" at that level is not one a person would pick twice.
rho_floor: "ledger:marketSurfaces.rho_floor"

# The quantile of the Jaccard under independence (hypergeometric overlap) that the observed
# one must exceed. ⚠️ Optimistic: the design clusters variants, so the true null is wider.
j_quantile: "ledger:marketSurfaces.j_quantile"

# The share of the declared markets that must pass, in EVERY segment read, for the region
# to be called one that travels. Below it in every segment is a fail; mixed is watch.
min_share: "ledger:marketSurfaces.min_share"

# The workflow step the ledger records this at (owner, 2026-09-26: same level as the WFC
# and the CSCV, read blind at step 20).
step: 18.5

# The plateau on the main asset (owner, 2026-09-30 §8.5): a point counts when it is within
# `region_radius` level steps of the mother on EVERY parameter at once, and within
# `region_delta` of the mother's own score there. Mirrors `cloud.config.neighbourhood`'s
# `radius`/`delta` exactly, on purpose — it is meant to read as the same plateau, not a
# second definition of one. Marked on every market's own heatmap; the table beside it
# reads each market's performance inside this fixed region against outside it.
region_radius: 2
region_delta: 0.20

# The second metric a heatmap can show beside `metric`, switched with a drop-down that
# needs no second run (CONTRACT §1 «selectors»): both are precomputed.
region_metric: ProfitFactor
