# Every tunable of step 18 (CSCV and PBO). The proposal is the owner's
# «criterios-implementados-2026-10-12» (2026-10-07); a number written `ledger:<key>` lives in
# ledger/thresholds.yaml with who set it, when and why. Override per run with
# `--set section.key=value`.

cscv:
  # Blocks the history is cut into, of near-equal length. Sixteen gives C(16,8) = 12,870
  # partitions; more blocks do not narrow the PBO's margin (proposal §2.4 and §5.1).
  blocks: ledger:cscv.blocks
  # Root seed of everything random: each draw seeds its own stream from (seed, kind, draw),
  # so the result is the same for any number of processes.
  seed: 20260922

# Which variants of the batch enter the panel (proposal §2.2 and §2.3). Controls (canaries,
# inert pairs) and exact duplicates always leave; the mother always enters.
panel:
  # Trades over the WHOLE history per live parameter: with 6 live and 15, a variant needs 90.
  floor_per_param: ledger:cscv.floor_per_param
  # Trades per year over the whole history.
  floor_per_year: ledger:cscv.floor_per_year
  # Under this many variants after the filters the step says «sin dato» and stays in LIMBO.
  min_variants: ledger:cscv.min_variants

# The null: every column equalised to the panel's median Sharpe, weeks redrawn by stationary
# bootstrap, the whole CSCV per draw (proposal §5.2).
"null":
  # Draws per mother and per kind (the null on net, the null on gross, each planted Sharpe).
  # 200 to start with; only the precision of the null's percentiles improves with more
  # (standard error of its p95: about 0.03 at 200, 0.013 at 1,000).
  draws: ledger:cscv.null_draws
  # Mean length, in weeks, of the bootstrap's geometric blocks.
  block_weeks: ledger:cscv.null_block_weeks
  # The null's median PBO must fall in this band, or the study warns that the resampling is
  # off. A check of the machinery, not a criterion.
  median_low: 0.4
  median_high: 0.6

# The positive control: an extra annual Sharpe planted in a share of the equalised columns,
# and how often the PBO then falls under the null's p5 (proposal §5.3).
power:
  deltas: [0.1, 0.2, 0.3]
  share: 0.10

# The state (proposal §6.1). The PBO's cut is its own null's p95 and has no number here.
state:
  p_perdida_fail: ledger:cscv.p_perdida_fail      # NO PASA at or above
  # LIMBO when the pick loses more often than this percentile of its own null's probability
  # of loss (owner, 2026-10-08). The facts keep the name `p95` whatever this says.
  p_perdida_null_pct: ledger:cscv.p_perdida_null_pct

# Stochastic dominance of choosing over picking at random, read on a histogram.
dominance:
  # How far the chosen's distribution function may rise above the other's and still count as
  # first order. The chosen are a subset of all the values, so strict dominance fails by
  # construction just under the maximum; the largest gap is annotated as a number.
  tolerance: 0.01
  bins: 512
  # Standard errors of a half-sample Sharpe the histogram reaches beyond the full-sample ones.
  reach: 6.0

# Independent trials behind the variants (display only: it feeds no deflated Sharpe).
trials:
  # Largest cluster count tried (knowhow/research/trial-count-half-rule.md).
  k_max: 40
  # Silhouette under which the reading says «débil». The owner's reading aid, not a threshold:
  # no code path changes with it.
  weak: 0.2

perf:
  # Processes of the one queue; core.fanout never uses more than the physical cores.
  workers: 96
  # Halves of a CSCV scored at once: 128 x 1,000 variants x 8 bytes = 1 MB per working array.
  chunk: 128
  # Wall-clock seconds the queue may take before the report says it is over budget.
  budget_s: 60.0
