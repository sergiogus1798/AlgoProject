# Every tunable of the SPP reconnaissance, in one place. Nothing below is hidden in code.

read:
  # The metric the verdict and the design are read on. Ret/DD is SQX's own Fitness
  # (Spearman +0.999 with it at >=100 trades), so this is the axis the builder optimised.
  # It is NOT invariant to window length -- see knowhow/export/ -- which is fine here
  # because Phase 0 never compares two windows.
  metric: ReturnDDRatio
  # Metrics the eta-squared table reports alongside it. One parameter can explain 8% of
  # one and 78% of another, so a single column would hide the choice being made.
  companion_metrics: [NetProfit, ProfitFactor, NumberOfTrades, SharpeRatio]
  breakeven: 0.0          # where `metric` stops being profitable; 1.0 for profit factor

verdict:
  margin: 1.0             # multiples of the null maximum the observed max must clear

design:
  n_target: 500           # variants the design is sized for
  strata:                 # shares of n_target; §5 of the protocol
    neighbourhood: 0.20
    factorial: 0.60
    coverage: 0.20
  # There is no eta-squared freezing threshold, deliberately. Freezing is decided by the
  # duplicate test alone, which is proof; eta-squared on an unbalanced sampled grid is
  # confounded and biased upward, so an inert parameter still scores above any threshold
  # you would pick. See run.brief(). Eta-squared allocates levels instead.
  min_span: 0.30          # levels cover at least +/-30 % of the original (owner, 2026-09-26)
  # Every live parameter gets up to nine levels across its +/-30 % (owner, 2026-09-26: coverage
  # first, "no nos vale un pequeño rango"). Integer parameters get fewer when the span holds
  # fewer distinct values — Fractal 5 has only 4, 5, 6 inside +/-30 %.
  min_levels: 9           # a live parameter never gets fewer
  max_levels: 9           # nor more, however much variance it explains
  plateau_share: 0.5      # how far below the best level still counts as plateau

surface:
  # The plateau of a two-parameter surface is the top decile of its cells (owner, 2026-09-27,
  # encargo 24 Q13) — the same top share the parameter cloud tracks. One grid per ordered
  # pair of parameters, each cell the median of `read.metric` over every tuple that used it.
  top_share: 0.10
